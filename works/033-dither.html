<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #322f28; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
// A memory-LCD palette: the panel reflects room light, its pixels are flat ink.
const INK = [50, 47, 40];
const PANEL = [177, 174, 167];
// The mushroom is drawn on a fixed grid of chunky pixels, scaled to fit.
const GRID = 200;

const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const lowres = document.createElement('canvas');
const lowresCtx = lowres.getContext('2d');
const glCanvas = document.createElement('canvas');
const gl = glCanvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// The lit mushroom as a greyscale image, one texel per screen pixel of the grid.
const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uYaw;
out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (p.y < m.x) m = vec2(p.y, 4.0);
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.15);
    if (res < 0.002 || t > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 material(vec3 p, vec3 n, float part) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.43, 0.07, 0.04), vec3(0.72, 0.2, 0.1), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.94, 0.91, 0.84), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) return vec3(0.82, 0.78, 0.68) * (0.75 + 0.25 * cos(atan(q.z, q.x) * 70.0));
  return mix(vec3(0.78, 0.75, 0.68), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 target = vec3(0.0, 0.55, 0.0);
  vec3 ro = target + vec3(sin(uYaw), 0.3, cos(uYaw)) * 3.3;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.0 * fw);
  // A low, hard key from the viewer's left reaches under the cap; the mushroom turns beneath it.
  vec3 key = normalize(-0.75 * rt + vec3(0.0, 0.42, 0.0) + 0.5 * vec3(sin(uYaw), 0.0, cos(uYaw)));

  float luma = 0.0;
  float t = 0.0;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 90; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.001 * t) { hit = vec2(t, m.y); break; }
    t += m.x;
    if (t > 7.0) break;
  }

  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    float shadow = softShadow(p + n * 0.003, key);
    if (hit.y > 3.5) {
      // A pool of light on a dark stage, cut by the mushroom's shadow.
      float pool = smoothstep(1.7, 0.1, length(p.xz));
      luma = 0.8 * pool * pool * (0.15 + 0.85 * shadow);
    } else {
      vec3 albedo = material(p, n, hit.y);
      float diff = max(dot(n, key), 0.0) * shadow;
      // A back light traces the silhouette against the dark.
      float rim = pow(clamp(1.0 + dot(rd, n), 0.0, 1.0), 3.0) * smoothstep(-0.2, 0.4, n.y + 0.3);
      vec3 lit = albedo * (diff * 1.4 + (0.5 + 0.5 * n.y) * 0.12) + rim * 0.7;
      luma = dot(lit, vec3(0.299, 0.587, 0.114));
    }
  }
  outColor = vec4(vec3(clamp(luma, 0.0, 1.0)), 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
const uResolution = gl.getUniformLocation(program, 'uResolution');
const uYaw = gl.getUniformLocation(program, 'uYaw');

let pixels, tone, image;
function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w;
  canvas.height = h;
  const scale = GRID / Math.min(w, h);
  glCanvas.width = lowres.width = Math.round(w * scale);
  glCanvas.height = lowres.height = Math.round(h * scale);
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  pixels = new Uint8Array(glCanvas.width * glCanvas.height * 4);
  tone = new Float32Array(glCanvas.width * glCanvas.height);
  image = lowresCtx.createImageData(glCanvas.width, glCanvas.height);
}

// Atkinson dithering, as on the original Macintosh: only 6/8 of the error is
// passed on, so highlights and shadows clip to clean white and solid ink.
function dither(width, height) {
  for (let y = 0; y < height; y++) {
    // WebGL rows run bottom-up; flip while copying.
    const row = (height - 1 - y) * width;
    for (let x = 0; x < width; x++) tone[y * width + x] = pixels[(row + x) * 4] / 255;
  }
  const spread = [[1, 0], [2, 0], [-1, 1], [0, 1], [1, 1], [0, 2]];
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = y * width + x;
      const lit = tone[i] > 0.5;
      const error = (tone[i] - (lit ? 1 : 0)) / 8;
      for (const [dx, dy] of spread) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < width && ny < height) tone[ny * width + nx] += error;
      }
      image.data.set(lit ? PANEL : INK, i * 4);
      image.data[i * 4 + 3] = 255;
    }
  }
}

function frame(ms) {
  resize();
  gl.uniform2f(uResolution, glCanvas.width, glCanvas.height);
  gl.uniform1f(uYaw, 0.6 + ms / 1000 * 0.35);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, glCanvas.width, glCanvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  dither(glCanvas.width, glCanvas.height);
  lowresCtx.putImageData(image, 0, 0);

  // Hard pixel edges, unless the grid is finer than two screen pixels.
  ctx.imageSmoothingEnabled = canvas.height / lowres.height < 2;
  ctx.drawImage(lowres, 0, 0, canvas.width, canvas.height);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 58%, #415039 0%, #2c3727 55%, #1f281d 100%); }
  .loader {
    all: unset;
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .loader:focus-visible { outline: 0.5vmin solid #efe7d655; outline-offset: -2vmin; }
  svg { display: block; width: 100%; height: 100%; }
  .spore { fill: #efe7d6; }
</style>
</head>
<body>
<button class="loader" role="progressbar" aria-label="Loading" aria-busy="true">
  <svg viewBox="-1000 -1640 2000 1880" preserveAspectRatio="xMidYMid meet">
    <ellipse class="floor" cx="0" cy="0" rx="820" ry="150" fill="url(#moss)"/>
    <ellipse class="shadow" cx="0" cy="0" rx="260" ry="40" fill="#141b12" opacity="0.5"/>
    <g class="behind"></g>
    <g class="mushroom">
      <path fill="#e8e2d2" d="M175 0 L153 -43 L138 -86 L127 -129 L120 -172 L115 -215 L112 -258 L110 -301 L109 -344 L108 -387 L108 -430 L108 -473 L109 -516 L110 -559 L111 -602 L112 -645 L114 -688 L116 -731 L118 -774 L120 -817 L122 -860 L-48 -860 L-53 -817 L-58 -774 L-62 -731 L-66 -688 L-71 -645 L-75 -602 L-79 -559 L-82 -516 L-86 -473 L-90 -430 L-93 -387 L-97 -344 L-101 -301 L-106 -258 L-111 -215 L-117 -172 L-126 -129 L-137 -86 L-153 -43 L-175 0 Z"/>
      <path fill="#ddd5c2" d="M145 -555 L132 -605 L119 -655 L-76 -655 L-95 -605 L-114 -555 Z"/>
      <g class="cap">
        <path fill="#d2c6ad" d="M-518 -822 Q32 -862 582 -822 L552 -800 Q32 -830 -488 -800 Z"/>
        <path fill="url(#capShade)" d="M591 -820 A560 310 0 1 0 -527 -820 Q32 -860 591 -820 Z"/>
        <g fill="#efe7d6">
          <ellipse cx="12" cy="-1070" rx="30" ry="24"/>
          <ellipse cx="202" cy="-1050" rx="26" ry="21"/>
          <ellipse cx="-188" cy="-1030" rx="28" ry="22"/>
          <ellipse cx="362" cy="-990" rx="30" ry="24"/>
          <ellipse cx="-348" cy="-960" rx="24" ry="19"/>
          <ellipse cx="92" cy="-990" rx="34" ry="27"/>
          <ellipse cx="-88" cy="-940" rx="22" ry="18"/>
          <ellipse cx="252" cy="-930" rx="25" ry="20"/>
          <ellipse cx="472" cy="-900" rx="20" ry="16"/>
          <ellipse cx="-438" cy="-880" rx="18" ry="14"/>
          <ellipse cx="-248" cy="-890" rx="26" ry="21"/>
          <ellipse cx="132" cy="-880" rx="20" ry="16"/>
          <ellipse cx="372" cy="-875" rx="17" ry="14"/>
          <ellipse cx="-28" cy="-880" rx="16" ry="13"/>
        </g>
      </g>
    </g>
    <g class="front"></g>
    <defs>
      <radialGradient id="moss">
        <stop offset="0" stop-color="#55664a"/>
        <stop offset="1" stop-color="#55664a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="capShade" cx="-60" cy="-1110" r="660" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#6e130b"/>
        <stop offset="1" stop-color="#b8321a"/>
      </radialGradient>
    </defs>
  </svg>
</button>
<script type="module">
const loader = document.querySelector('.loader');
const mushroom = loader.querySelector('.mushroom');
const cap = loader.querySelector('.cap');
const shadow = loader.querySelector('.shadow');
const behind = loader.querySelector('.behind');
const front = loader.querySelector('.front');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

const HOP_MS = 1150;
const HOP_HEIGHT = 300;
const ORBIT_MS = 1700;
const SETTLE_MS = 1400;

const smooth = (k) => k * k * (3 - 2 * k);
const clamp01 = (k) => Math.min(Math.max(k, 0), 1);
const mix = (a, b, k) => a + (b - a) * k;

// One hop as a pure function of its phase: crouch, launch, a parabolic flight
// that stretches with speed, then a squash that rings down on landing.
function hop(p) {
  if (p < 0.16) {
    const k = smooth(p / 0.16);
    return { y: 0, squash: 0.15 * k };
  }
  if (p < 0.76) {
    const u = (p - 0.16) / 0.6;
    const speed = Math.abs(1 - 2 * u) * Math.min(u / 0.06, 1, (1 - u) / 0.08);
    const release = 0.15 * Math.max(0, 1 - u / 0.05);
    return { y: HOP_HEIGHT * 4 * u * (1 - u), squash: release - 0.11 * speed };
  }
  const u = (p - 0.76) / 0.24;
  return { y: 0, squash: 0.17 * Math.exp(-u * 3.2) * Math.sin(Math.min(u * 9, Math.PI) + u * 3) };
}

// The final landing is heavier and slower, then the mushroom breathes at rest.
function settle(ms) {
  const u = ms / SETTLE_MS;
  if (u > 1) return { y: 0, squash: 0.012 * Math.sin((ms - SETTLE_MS) / 600) };
  return { y: 0, squash: 0.22 * Math.exp(-u * 4) * Math.cos(u * Math.PI * 3.5) };
}

// Loading runs hops from `since`. Finishing waits for the hop in flight to land.
let loading = true;
let since = 600;
let doneAt = Infinity;
let toggledAt = -Infinity;

function pose(t) {
  if (calm) return { y: 0, squash: 0 };
  if (!loading && t >= doneAt) return settle(t - doneAt);
  if (t < since) return { y: 0, squash: 0 };
  return hop(((t - since) % HOP_MS) / HOP_MS);
}

function setLoading(next, t) {
  if (next === loading) return;
  loading = next;
  toggledAt = t;
  loader.setAttribute('aria-busy', next);
  if (next) {
    since = Math.max(t, doneAt) + 450;
    return;
  }
  const hops = (t - since) / HOP_MS;
  doneAt = t < since ? t : since + (Math.floor(hops - 0.76) + 1.76) * HOP_MS;
}

// Spores chase each other around a tilted orbit like a comet with a fading tail.
const spores = Array.from({ length: 9 }, (_, i) => {
  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.classList.add('spore');
  front.append(circle);
  return { circle, size: 40 - i * 3.4, lag: i * 0.34, rest: null };
});

function orbit(spore, t, hopY) {
  const angle = (t / (calm ? ORBIT_MS * 2.5 : ORBIT_MS)) * Math.PI * 2 - spore.lag;
  return {
    x: 32 + Math.cos(angle) * 660,
    y: -640 - hopY * 0.7 + Math.sin(angle) * 170,
    depth: Math.sin(angle),
  };
}

// Finished spores spread evenly into a fairy ring on the floor, led by the head of the tail.
function landing(spore, index, t) {
  const head = (t / ORBIT_MS) * Math.PI * 2 + 0.5;
  const angle = head - index * (Math.PI * 2 / spores.length);
  return { x: 32 + Math.cos(angle) * 560, y: Math.sin(angle) * 95, depth: Math.sin(angle), size: 24 };
}

function placeSpores(t, hopY) {
  spores.forEach((spore, i) => {
    let { x, y, depth } = orbit(spore, t, hopY);
    let size = spore.size;
    const k = clamp01((t - toggledAt - i * 55) / 900);
    if (!loading) {
      spore.rest ??= landing(spore, i, toggledAt);
      // Drifting down: sideways motion eases out while the fall eases in.
      x = mix(x, spore.rest.x, 1 - (1 - k) ** 2);
      y = mix(y, spore.rest.y, k * k);
      depth = mix(depth, spore.rest.depth, k);
      size = mix(size, spore.rest.size, k);
    } else if (spore.rest) {
      const lift = smooth(k);
      x = mix(spore.rest.x, x, lift);
      y = mix(spore.rest.y, y, lift);
      depth = mix(spore.rest.depth, depth, lift);
      size = mix(spore.rest.size, size, lift);
      if (k >= 1) spore.rest = null;
    }
    spore.circle.setAttribute('cx', x.toFixed(1));
    spore.circle.setAttribute('cy', y.toFixed(1));
    spore.circle.setAttribute('r', (size * (0.78 + 0.22 * depth)).toFixed(1));
    spore.circle.setAttribute('opacity', (0.55 + 0.45 * (depth + 1) / 2).toFixed(2));
    const layer = depth >= 0 ? front : behind;
    if (spore.circle.parentNode !== layer) layer.append(spore.circle);
  });
}

function frame(t) {
  const now = pose(t);
  // The cap trails the stem: compare with where the body was a moment ago.
  const lag = (pose(t - 70).y - now.y) * 0.35;
  const sx = 1 + now.squash * 0.8, sy = 1 - now.squash;
  mushroom.setAttribute('transform', `translate(0 ${-now.y}) scale(${sx.toFixed(4)} ${sy.toFixed(4)})`);
  cap.setAttribute('transform', `translate(0 ${lag.toFixed(1)})`);
  const lift = now.y / HOP_HEIGHT;
  shadow.setAttribute('transform', `scale(${(sx * (1 - 0.35 * lift)).toFixed(3)} 1)`);
  shadow.setAttribute('opacity', (0.5 - 0.25 * lift).toFixed(2));
  placeSpores(t, now.y);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Real input takes over from the demo, which resumes after a few idle seconds.
const IDLE_MS = 4000;
let lastInput = -IDLE_MS;
loader.addEventListener('click', () => {
  lastInput = performance.now();
  setLoading(!loading, performance.now());
});

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function demo() {
  for (;;) {
    await wait(loading ? HOP_MS * 3.3 : 2400);
    if (performance.now() - lastInput > IDLE_MS) setLoading(!loading, performance.now());
  }
}
demo();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Like</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 46%, #f7f0e7 0%, #ece1d3 70%, #e3d6c5 100%);
  }
  .like {
    all: unset;
    cursor: pointer;
    width: min(66vmin, 86vw);
    aspect-ratio: 1240 / 1200;
    border-radius: 50%;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .like:focus-visible { outline: 0.5vmin solid #b8321a66; outline-offset: 3vmin; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .outline path, .ink { fill: #f6efe6; stroke: #3d2c25; stroke-width: 30; stroke-linejoin: round; }
  .filled { opacity: 0; }
  .spots ellipse { transform-box: fill-box; transform-origin: center; transform: scale(0); }
  .cap { transform-origin: 32px -820px; }
  .ripple { fill: none; stroke: #b8321a; stroke-width: 10; opacity: 0; transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>
<button class="like" aria-label="Like" aria-pressed="false">
  <svg viewBox="-620 -1160 1240 1200">
    <ellipse class="shadow" cx="0" cy="0" rx="250" ry="34" fill="#5a3a2a" opacity="0.14"/>
    <ellipse class="ripple" cx="0" cy="0" rx="300" ry="50"/>
    <ellipse class="ripple" cx="0" cy="0" rx="300" ry="50"/>
    <g class="body">
      <g class="outline">
        <path d="M175 0 L153 -43 L138 -86 L127 -129 L120 -172 L115 -215 L112 -258 L110 -301 L109 -344 L108 -387 L108 -430 L108 -473 L109 -516 L110 -559 L111 -602 L112 -645 L114 -688 L116 -731 L118 -774 L120 -817 L122 -860 L-48 -860 L-53 -817 L-58 -774 L-62 -731 L-66 -688 L-71 -645 L-75 -602 L-79 -559 L-82 -516 L-86 -473 L-90 -430 L-93 -387 L-97 -344 L-101 -301 L-106 -258 L-111 -215 L-117 -172 L-126 -129 L-137 -86 L-153 -43 L-175 0 Z"/>
        <path d="M145 -555 L132 -605 L119 -655 L-76 -655 L-95 -605 L-114 -555 Z"/>
      </g>
      <g class="filled">
        <path fill="#e8e2d2" d="M175 0 L153 -43 L138 -86 L127 -129 L120 -172 L115 -215 L112 -258 L110 -301 L109 -344 L108 -387 L108 -430 L108 -473 L109 -516 L110 -559 L111 -602 L112 -645 L114 -688 L116 -731 L118 -774 L120 -817 L122 -860 L-48 -860 L-53 -817 L-58 -774 L-62 -731 L-66 -688 L-71 -645 L-75 -602 L-79 -559 L-82 -516 L-86 -473 L-90 -430 L-93 -387 L-97 -344 L-101 -301 L-106 -258 L-111 -215 L-117 -172 L-126 -129 L-137 -86 L-153 -43 L-175 0 Z"/>
        <path fill="#ddd5c2" d="M145 -555 L132 -605 L119 -655 L-76 -655 L-95 -605 L-114 -555 Z"/>
      </g>
      <g class="cap">
        <path class="ink" d="M591 -820 A560 310 0 1 0 -527 -820 Q32 -860 591 -820 Z"/>
        <g class="filled">
          <path fill="#d2c6ad" d="M-518 -822 Q32 -862 582 -822 L552 -800 Q32 -830 -488 -800 Z"/>
          <path fill="url(#capShade)" d="M591 -820 A560 310 0 1 0 -527 -820 Q32 -860 591 -820 Z"/>
        </g>
        <g class="spots" fill="#efe7d6">
          <ellipse cx="12" cy="-1070" rx="30" ry="24"/>
          <ellipse cx="202" cy="-1050" rx="26" ry="21"/>
          <ellipse cx="-188" cy="-1030" rx="28" ry="22"/>
          <ellipse cx="362" cy="-990" rx="30" ry="24"/>
          <ellipse cx="-348" cy="-960" rx="24" ry="19"/>
          <ellipse cx="92" cy="-990" rx="34" ry="27"/>
          <ellipse cx="-88" cy="-940" rx="22" ry="18"/>
          <ellipse cx="252" cy="-930" rx="25" ry="20"/>
          <ellipse cx="472" cy="-900" rx="20" ry="16"/>
          <ellipse cx="-438" cy="-880" rx="18" ry="14"/>
          <ellipse cx="-248" cy="-890" rx="26" ry="21"/>
          <ellipse cx="132" cy="-880" rx="20" ry="16"/>
          <ellipse cx="372" cy="-875" rx="17" ry="14"/>
          <ellipse cx="-28" cy="-880" rx="16" ry="13"/>
        </g>
      </g>
    </g>
    <g class="spores"></g>
    <defs>
      <radialGradient id="capShade" cx="32" cy="-1110" r="620" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#6e130b"/>
        <stop offset="1" stop-color="#b8321a"/>
      </radialGradient>
    </defs>
  </svg>
</button>
<script type="module">
const button = document.querySelector('.like');
const body = button.querySelector('.body');
const cap = button.querySelector('.cap');
const shadow = button.querySelector('.shadow');
const ripples = button.querySelectorAll('.ripple');
const filled = button.querySelectorAll('.filled');
const spots = [...button.querySelectorAll('.spots ellipse')];
const sporeLayer = button.querySelector('.spores');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SVG = 'http://www.w3.org/2000/svg';

// Integrates a damped spring from 0 to 1 and returns it as a CSS linear() easing,
// so a single WAAPI keyframe pair carries the overshoot and the settle.
function spring(stiffness, damping) {
  const dt = 1 / 120;
  const samples = [];
  let x = 0, v = 0;
  while (samples.length < 600) {
    v += ((1 - x) * stiffness - v * damping) * dt;
    x += v * dt;
    samples.push(x);
    if (Math.abs(1 - x) < 0.001 && Math.abs(v) < 0.01) break;
  }
  const stops = samples.filter((_, i) => i % 3 === 2).map((s) => s.toFixed(3));
  return { easing: `linear(0, ${stops.join(', ')}, 1)`, duration: samples.length * dt * 1000 };
}

const settle = calm ? { easing: 'ease-out', duration: 240 } : spring(260, 11);
const capSettle = calm ? settle : spring(200, 9);

// Every move starts from wherever the element is now, so presses can interrupt each other.
function moveTo(element, transform, timing) {
  const from = getComputedStyle(element).transform;
  return element.animate([{ transform: from === 'none' ? 'none' : from }, { transform }],
    { fill: 'forwards', ...timing });
}

let liked = false;
let pressed = false;

function press() {
  if (pressed) return;
  pressed = true;
  const squash = calm ? 'scale(1.03, 0.97)' : 'scale(1.16, 0.8)';
  const ease = { duration: 170, easing: 'cubic-bezier(0.3, 0, 0.2, 1)' };
  moveTo(body, squash, ease);
  moveTo(cap, calm ? 'none' : 'translate(0px, 30px) scale(1.04, 0.94)', ease);
  moveTo(shadow, calm ? 'none' : 'scale(1.25, 1)', ease);
}

function release() {
  if (!pressed) return;
  pressed = false;
  liked = !liked;
  button.setAttribute('aria-pressed', liked);
  moveTo(body, 'none', settle);
  moveTo(cap, 'none', { ...capSettle, delay: calm ? 0 : 40 });
  moveTo(shadow, 'none', settle);
  for (const layer of filled) {
    layer.animate({ opacity: liked ? 1 : 0 }, { duration: liked ? 90 : 220, fill: 'forwards', easing: 'ease-out' });
  }
  liked ? popSpots() : dropSpots();
  if (liked && !calm) {
    ripple();
    shedSpores();
  }
}

// Warts appear from the crown outward, so the cap reads as filling up.
function popSpots() {
  const crown = { x: 32, y: -1110 };
  for (const spot of spots) {
    const distance = Math.hypot(spot.cx.baseVal.value - crown.x, spot.cy.baseVal.value - crown.y);
    spot.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], {
      ...(calm ? settle : spring(320, 14)), delay: (calm ? 0 : 60) + distance * 0.35, fill: 'forwards',
    });
  }
}

function dropSpots() {
  for (const spot of spots) {
    spot.animate({ transform: 'scale(0)' }, { duration: 160, easing: 'ease-in', fill: 'forwards' });
  }
}

// The stomp sends two rings out along the ground.
function ripple() {
  ripples.forEach((ellipse, i) => {
    ellipse.animate([
      { transform: 'scale(0.6)', opacity: 0.7, strokeWidth: 16 },
      { transform: 'scale(2.3)', opacity: 0, strokeWidth: 2 },
    ], { duration: 900, delay: 20 + i * 140, easing: 'cubic-bezier(0.15, 0.6, 0.3, 1)' });
  });
}

// Spores puff up off the cap, coast outward, then sink as they slow down.
function shedSpores() {
  const count = 22;
  for (let i = 0; i < count; i++) {
    const angle = Math.PI * (1.08 + 0.84 * (i / (count - 1))) + (Math.random() - 0.5) * 0.12;
    const ox = 32 + Math.cos(angle) * 480, oy = -820 + Math.sin(angle) * 270;
    const reach = 180 + Math.random() * 260;
    const dx = Math.cos(angle) * reach * 1.2, dy = Math.sin(angle) * reach;
    const spore = document.createElementNS(SVG, 'circle');
    spore.setAttribute('cx', ox);
    spore.setAttribute('cy', oy);
    spore.setAttribute('r', 12 + Math.random() * 22);
    const cream = i % 3 !== 0;
    spore.setAttribute('fill', cream ? '#efe7d6' : '#c2462a');
    if (cream) spore.setAttribute('stroke', '#3d2c25');
    spore.setAttribute('stroke-width', 8);
    spore.style.transformBox = 'fill-box';
    spore.style.transformOrigin = 'center';
    sporeLayer.append(spore);
    spore.animate([
      { transform: 'translate(0px, 0px) scale(0)', opacity: 1 },
      { transform: `translate(${dx * 0.8}px, ${dy * 0.8}px) scale(1)`, opacity: 1, offset: 0.35 },
      { transform: `translate(${dx}px, ${dy + 200 + Math.random() * 120}px) scale(0.3)`, opacity: 0 },
    ], { duration: 1000 + Math.random() * 500, easing: 'cubic-bezier(0.2, 0.6, 0.4, 1)', delay: 30 + Math.random() * 60 })
      .finished.then(() => spore.remove());
  }
}

// Real input takes over from the demo, which resumes after a few idle seconds.
const IDLE_MS = 4000;
let lastInput = -IDLE_MS;
const human = () => { lastInput = performance.now(); };

button.addEventListener('pointerdown', (event) => {
  human();
  button.setPointerCapture(event.pointerId);
  press();
});
button.addEventListener('pointerup', () => { human(); release(); });
button.addEventListener('pointercancel', () => { pressed = false; moveTo(body, 'none', settle); moveTo(cap, 'none', settle); });
button.addEventListener('keydown', (event) => {
  if (event.key !== ' ' && event.key !== 'Enter') return;
  event.preventDefault();
  human();
  press();
});
button.addEventListener('keyup', (event) => {
  if (event.key !== ' ' && event.key !== 'Enter') return;
  human();
  release();
});

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function demo() {
  await wait(900);
  for (;;) {
    if (performance.now() - lastInput > IDLE_MS) {
      press();
      await wait(liked ? 140 : 220);
      release();
    }
    await wait(liked ? 2800 : 1600);
  }
}
demo();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fog</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8d9692; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

// The fog march dominates the cost and the scene is soft, so it renders smaller.
const RENDER_SCALE = 0.5;

const vertex = `#version 300 es
layout(location = 0) in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 BOUNDS_CENTER = vec3(0.0, 0.56, 0.0);
const float BOUNDS_RADIUS = 0.82;
const vec3 SUN = vec3(0.6, 0.5, -0.62);
const vec3 SUN_COLOR = vec3(1.0, 0.78, 0.52);
const vec3 SKY = vec3(0.42, 0.5, 0.54);
const float CANOPY = 26.0;
const int TRUNKS = 20;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(vec3(i, 0.0)), hash(vec3(i + vec2(1, 0), 0.0)), f.x),
             mix(hash(vec3(i + vec2(0, 1), 0.0)), hash(vec3(i + vec2(1, 1), 0.0)), f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(1.7, 9.2);
    a *= 0.5;
  }
  return v;
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(mushroom(p + e.xyy).x - mushroom(p - e.xyy).x,
                        mushroom(p + e.yxy).x - mushroom(p - e.yxy).x,
                        mushroom(p + e.yyx).x - mushroom(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 32; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.02, 0.2);
    if (res < 0.002 || t > 3.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

// Nearest feature point on a jittered 3D grid, for warts and dew beads.
float cells(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return d;
}

vec3 material(vec3 q, vec3 n, float part) {
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.42, 0.06, 0.035), vec3(0.70, 0.22, 0.06), smoothstep(0.2, 0.56, r));
    float wart = 1.0 - smoothstep(0.18, 0.26, cells((q - vec3(0.0, 0.8, 0.0)) * 10.0));
    return mix(cap, vec3(0.86, 0.82, 0.72), wart * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) {
    float a = atan(q.z, q.x) * 70.0;
    float resolved = clamp(1.5 - fwidth(a), 0.0, 1.0);
    float depth = smoothstep(0.1, 0.5, length(q.xz));
    return vec3(0.82, 0.77, 0.66) * (0.85 + 0.15 * resolved * cos(a)) * (0.45 + 0.55 * depth);
  }
  float scales = 0.5 + 0.5 * sin(q.y * 90.0 + sin(atan(q.z, q.x) * 5.0) * 2.0);
  vec3 stem = mix(vec3(0.72, 0.68, 0.6), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
  return stem * (1.0 - 0.06 * scales * smoothstep(0.5, 0.1, q.y));
}

// Trunk i: centre on the ground plane (xy = world xz) and radius (z).
vec3 trunk(int i) {
  float fi = float(i);
  float z = -9.0 - fi * 3.2 - 3.0 * hash(vec3(fi, 1.0, 0.0));
  float x = (hash(vec3(fi, 2.0, 0.0)) - 0.5) * -z * 1.3;
  return vec3(x, z, 0.35 + 0.6 * hash(vec3(fi, 3.0, 0.0)));
}

// Direct sun reaching p: blocked by trunks, then filtered through canopy gaps
// that sway a little in the morning air.
float sunlight(vec3 p) {
  vec2 s = normalize(SUN.xz);
  float lit = 1.0;
  for (int i = 0; i < TRUNKS; i++) {
    vec3 tr = trunk(i);
    vec2 v = tr.xy - p.xz;
    float along = dot(v, s);
    float penumbra = 0.15 + along * 0.04;
    if (along > 0.0) lit *= smoothstep(tr.z - penumbra, tr.z + penumbra, length(v - s * along));
  }
  vec2 q = p.xz + SUN.xz * (CANOPY - p.y) / SUN.y;
  vec2 overMushroom = SUN.xz * (CANOPY - 0.6) / SUN.y;
  q += vec2(sin(uTime * 0.13), cos(uTime * 0.11)) * 0.6;
  // One gap is kept over the mushroom so a shaft always finds it.
  float gap = max(fbm(q * 0.06), 0.75 * exp(-dot(q - overMushroom, q - overMushroom) * 0.05));
  return lit * smoothstep(0.62, 0.7, gap);
}

float fogDensity(vec3 p) {
  float mist = fbm(p.xz * 0.25 + vec2(uTime * 0.04, uTime * 0.015));
  return (0.003 + 0.02 * mist) * exp(-p.y * 0.08) + 0.1 * mist * exp(-p.y * 1.0);
}

float traceTrunks(vec3 ro, vec3 rd, out int which) {
  float best = 1e9;
  which = -1;
  vec2 d = rd.xz;
  float a = dot(d, d);
  for (int i = 0; i < TRUNKS; i++) {
    vec3 tr = trunk(i);
    vec2 o = ro.xz - tr.xy;
    float b = dot(o, d), c = dot(o, o) - tr.z * tr.z;
    float disc = b * b - a * c;
    if (disc < 0.0) continue;
    float t = (-b - sqrt(disc)) / a;
    if (t > 0.0 && t < best) { best = t; which = i; }
  }
  return best;
}

float traceMushroom(vec3 ro, vec3 rd, out float part) {
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float disc = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (disc < 0.0) return 1e9;
  float t = max(-b - sqrt(disc), 0.0), tEnd = -b + sqrt(disc);
  for (int i = 0; i < 100; i++) {
    vec2 m = mushroom(ro + rd * t);
    if (m.x < 0.0005 * t) { part = m.y; return t; }
    t += m.x * 0.9;
    if (t > tEnd) break;
  }
  return 1e9;
}

vec3 shadeMushroom(vec3 p, vec3 rd, float part) {
  vec3 n = normalAt(p);
  vec3 q = p;
  q.x -= 0.05 * q.y * q.y;
  vec3 albedo = material(q, n, part);
  float ao = clamp(0.4 + 0.6 * (mushroom(p + n * 0.06).x / 0.06), 0.0, 1.0);
  float sun = max(dot(n, SUN), 0.0) * softShadow(p + n * 0.004, SUN) * sunlight(p);
  vec3 bounce = vec3(0.2, 0.17, 0.09) * (0.5 - 0.5 * n.y);
  vec3 col = albedo * (SUN_COLOR * sun * 2.2 + (SKY * (0.3 + 0.2 * n.y) + bounce) * ao);
  // Backlight soaks through the thin cap margin and halos the silhouette.
  float back = pow(max(dot(rd, SUN), 0.0), 2.0);
  if (part < 0.5) col += vec3(0.75, 0.15, 0.04) * back * smoothstep(0.38, 0.56, length(q.xz)) * sunlight(p) * 1.2;
  col += SUN_COLOR * pow(1.0 - abs(dot(n, rd)), 3.0) * back * 2.5 * sunlight(p);
  // Dew beads on the cap: tiny bright points where they mirror the sky.
  if (part < 0.5 && n.y > 0.0) {
    float bead = 1.0 - smoothstep(0.05, 0.11, cells(q * 38.0));
    float glint = pow(max(dot(reflect(rd, n), normalize(SUN + vec3(0.0, 0.6, 0.0))), 0.0), 6.0);
    col += bead * (SKY * 0.35 + SUN_COLOR * glint * 1.2);
  }
  return col;
}

vec3 shadeTrunk(vec3 p, int i) {
  vec3 tr = trunk(i);
  vec3 n = normalize(vec3(p.x - tr.x, 0.0, p.z - tr.y));
  float angle = atan(n.z, n.x) * tr.z;
  float bark = fbm(vec2(angle * 6.0, p.y * 0.7));
  vec3 albedo = mix(vec3(0.07, 0.06, 0.05), vec3(0.15, 0.13, 0.1), bark);
  albedo = mix(albedo, vec3(0.1, 0.13, 0.05), smoothstep(1.4, 0.0, p.y) * 0.8);
  vec3 col = albedo * SKY * (0.35 + 0.2 * n.y);
  col += SUN_COLOR * albedo * 3.0 * max(dot(n, SUN), 0.0) * sunlight(p + n * 0.05);
  return col;
}

vec3 shadeGround(vec3 p) {
  vec2 g = p.xz;
  float patches = fbm(g * 0.7);
  vec3 litter = mix(vec3(0.17, 0.11, 0.06), vec3(0.26, 0.17, 0.08), fbm(g * 3.0));
  vec3 moss = mix(vec3(0.07, 0.11, 0.035), vec3(0.15, 0.2, 0.06), fbm(g * 9.0));
  float mossy = smoothstep(0.45, 0.6, patches) + smoothstep(1.8, 0.4, length(g));
  vec3 albedo = mix(litter, moss, clamp(mossy, 0.0, 1.0));
  float shadow = length(g) < 4.0 ? softShadow(p + vec3(0.0, 0.01, 0.0), SUN) : 1.0;
  float sun = sunlight(p) * shadow;
  vec3 col = albedo * (SUN_COLOR * sun * SUN.y * 2.6 + SKY * 0.5);
  // Dew on the moss: sparse beads that catch the sun and twinkle as the air moves.
  vec2 cell = floor(g * 26.0);
  vec2 f = fract(g * 26.0) - 0.5;
  float seed = hash(vec3(cell, 4.0));
  float bead = step(0.9, seed) * smoothstep(0.18, 0.04, length(f));
  float twinkle = 0.55 + 0.45 * sin(uTime * 2.0 + seed * 60.0);
  col += SUN_COLOR * bead * twinkle * sun * 1.5 * clamp(mossy, 0.0, 1.0);
  return col;
}

vec3 sky(vec3 rd) {
  float toward = max(dot(rd, SUN), 0.0);
  return SKY * 0.35 + vec3(1.0, 0.84, 0.6) * 0.45 * pow(toward, 6.0);
}

// Drifting motes on a few depth layers; they only show where a shaft finds them.
float motes(vec3 ro, vec3 rd, vec3 fw, vec2 uv, float tHit) {
  float glow = 0.0;
  for (int k = 0; k < 4; k++) {
    float depth = 1.6 + float(k) * 1.4;
    float t = depth / dot(rd, fw);
    if (t > tHit) continue;
    vec2 g = uv * depth * 9.0 + vec2(uTime * 0.05, uTime * 0.03) * (1.0 + float(k));
    vec2 cell = floor(g);
    vec2 f = fract(g);
    float seed = hash(vec3(cell, float(k) + 11.0));
    vec2 c = vec2(hash(vec3(cell, float(k) + 3.0)), seed) * 0.7 + 0.15;
    c += 0.1 * vec2(sin(uTime * 0.6 + seed * 20.0), cos(uTime * 0.5 + seed * 13.0));
    float speck = step(0.95, seed) * smoothstep(0.07, 0.0, length(f - c));
    if (speck > 0.0) glow += speck * sunlight(ro + rd * t);
  }
  return glow;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  float yaw = 0.14 * sin(uTime * 0.035) - 0.08;
  vec3 target = vec3(0.0, 0.6, 0.0);
  vec3 ro = vec3(sin(yaw) * 3.0, 0.45, cos(yaw) * 3.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.75 * fw);

  float part;
  int which;
  float tMushroom = traceMushroom(ro, rd, part);
  float tTrunk = traceTrunks(ro, rd, which);
  float tGround = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
  float tHit = min(min(tMushroom, tTrunk), tGround);

  vec3 surface;
  if (tHit > 1e8) surface = sky(rd);
  else if (tHit == tMushroom) surface = shadeMushroom(ro + rd * tHit, rd, part);
  else if (tHit == tTrunk) surface = shadeTrunk(ro + rd * tHit, which);
  else surface = shadeGround(ro + rd * tHit);
  surface = mix(surface, sky(rd), smoothstep(10.0, 60.0, tHit));

  // Single-scattering fog: steps bunch up near the eye where detail matters.
  float mu = dot(rd, SUN);
  float phase = 0.19 * (1.0 - 0.36) / pow(1.36 - 1.2 * mu, 1.5) + 0.08;
  float tMax = min(tHit, 70.0);
  float jitter = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  vec3 scatter = vec3(0.0);
  float transmittance = 1.0, prev = 0.0;
  for (int i = 0; i < 36; i++) {
    float s = (float(i) + jitter) / 36.0;
    float t = tMax * s * s;
    float dt = t - prev;
    prev = t;
    vec3 p = ro + rd * t;
    // At mushroom scale the air between lens and subject is only a hand deep.
    float sigma = fogDensity(p) * smoothstep(1.0, 8.0, t);
    vec3 light = SUN_COLOR * sunlight(p) * phase * 16.0 + SKY * 0.35;
    scatter += transmittance * sigma * dt * light;
    transmittance *= exp(-sigma * dt);
  }
  vec3 col = surface * transmittance + scatter;
  col += SUN_COLOR * motes(ro, rd, fw, uv, tHit) * phase * 1.6;

  col = 1.0 - exp(-col);
  col = pow(col, vec3(0.4545));
  outColor = vec4(col, 1.0);
}`;

const presentFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform sampler2D uScene;
out vec4 outColor;

float grain(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;
  vec3 col = texture(uScene, uv).rgb;
  vec2 q = uv - 0.5;
  col *= 1.0 - 0.35 * dot(q, q);
  col += (grain(gl_FragCoord.xy) - 0.5) * 0.015;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(fragmentSource) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  return program;
}

const sceneProgram = createProgram(sceneFragment);
const presentProgram = createProgram(presentFragment);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const sceneUniforms = {
  resolution: gl.getUniformLocation(sceneProgram, 'uResolution'),
  time: gl.getUniformLocation(sceneProgram, 'uTime'),
};
const presentUniforms = {
  resolution: gl.getUniformLocation(presentProgram, 'uResolution'),
  scene: gl.getUniformLocation(presentProgram, 'uScene'),
};

function target(width, height) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, width, height);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const framebuffer = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  return { framebuffer, texture, width, height };
}

let buffer = null;
function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  const sw = Math.round(w * RENDER_SCALE), sh = Math.round(h * RENDER_SCALE);
  if (!buffer || buffer.width !== sw || buffer.height !== sh) {
    if (buffer) {
      gl.deleteFramebuffer(buffer.framebuffer);
      gl.deleteTexture(buffer.texture);
    }
    buffer = target(sw, sh);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, buffer.framebuffer);
  gl.viewport(0, 0, sw, sh);
  gl.useProgram(sceneProgram);
  gl.uniform2f(sceneUniforms.resolution, sw, sh);
  gl.uniform1f(sceneUniforms.time, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(presentProgram);
  gl.uniform2f(presentUniforms.resolution, w, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, buffer.texture);
  gl.uniform1i(presentUniforms.scene, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

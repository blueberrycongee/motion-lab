<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toggle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    --dusk: 700ms cubic-bezier(0.45, 0, 0.2, 1);
    display: grid;
    place-items: center;
    background: #e6e1d3;
    transition: background-color var(--dusk);
  }
  body.night { background: #1a212c; }

  .toggle {
    all: unset;
    --w: min(90vw, 118vmin);
    --h: calc(var(--w) / 2.2);
    --pad: calc(var(--h) * 0.08);
    --knob: calc(var(--h) - 2 * var(--pad));
    position: relative;
    width: var(--w);
    height: var(--h);
    border-radius: var(--h);
    overflow: hidden;
    cursor: pointer;
    isolation: isolate;
    background: linear-gradient(#bcd6dc, #e9e1c8 78%);
    box-shadow: inset 0 calc(var(--h) * 0.03) calc(var(--h) * 0.08) #0003, 0 calc(var(--h) * 0.02) 0 #fff6;
    transition: box-shadow var(--dusk);
    -webkit-tap-highlight-color: transparent;
  }
  .toggle:focus-visible { outline: calc(var(--h) * 0.025) solid #b8321a88; outline-offset: calc(var(--h) * 0.05); }
  .night .toggle { box-shadow: inset 0 calc(var(--h) * 0.03) calc(var(--h) * 0.08) #0008, 0 calc(var(--h) * 0.02) 0 #ffffff14; }

  .sky-night {
    position: absolute;
    inset: 0;
    background: linear-gradient(#141b29, #2b3550 80%);
    opacity: 0;
    transition: opacity var(--dusk);
  }
  .night .sky-night { opacity: 1; }

  .sun, .moon {
    position: absolute;
    width: calc(var(--h) * 0.36);
    aspect-ratio: 1;
    border-radius: 50%;
    top: calc(var(--h) * 0.2);
    transition: transform 900ms cubic-bezier(0.5, 0, 0.2, 1), opacity 600ms ease;
  }
  .sun {
    right: calc(var(--h) * 0.42);
    background: #f3d283;
    box-shadow: 0 0 0 calc(var(--h) * 0.06) #f3d28340;
  }
  .night .sun { transform: translateY(calc(var(--h) * 0.8)); opacity: 0; }
  .moon {
    left: calc(var(--h) * 0.48);
    box-shadow: inset calc(var(--h) * -0.07) calc(var(--h) * -0.02) 0 0 #ebe4cf;
    transform: translateY(calc(var(--h) * 0.8)) rotate(-30deg);
    opacity: 0;
  }
  .night .moon { transform: rotate(-20deg); opacity: 1; transition-delay: 200ms; }

  .cloud {
    position: absolute;
    height: calc(var(--h) * 0.12);
    border-radius: var(--h);
    background: #f7f2e6;
    transition: opacity 500ms ease, translate 900ms cubic-bezier(0.5, 0, 0.2, 1);
    animation: drift 14s ease-in-out infinite alternate;
  }
  .cloud::before {
    content: "";
    position: absolute;
    left: 22%;
    bottom: 45%;
    width: 42%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: inherit;
  }
  .cloud.one { width: calc(var(--h) * 0.44); top: calc(var(--h) * 0.22); left: calc(var(--w) * 0.43); }
  .cloud.two { width: calc(var(--h) * 0.3); top: calc(var(--h) * 0.44); left: calc(var(--w) * 0.6); animation-delay: -6s; }
  .night .cloud { opacity: 0; translate: 0 calc(var(--h) * 0.3); }
  @keyframes drift { to { transform: translateX(calc(var(--h) * 0.18)); } }

  .star {
    position: absolute;
    width: calc(var(--h) * 0.022);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #efe7d6;
    opacity: 0;
    scale: 0;
    transition: opacity 400ms ease, scale 500ms cubic-bezier(0.3, 1.4, 0.5, 1);
  }
  .night .star { opacity: 1; scale: 1; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: 0.35; } }

  .hill {
    position: absolute;
    border-radius: 50%;
    transition: background-color var(--dusk);
  }
  .hill.back { width: 70%; height: 60%; left: 40%; top: 72%; background: #a7b48c; }
  .hill.front { width: 90%; height: 70%; left: -10%; top: 78%; background: #8f9f78; }
  .night .hill.back { background: #283244; }
  .night .hill.front { background: #1f2837; }

  .knob {
    position: absolute;
    left: var(--pad);
    top: var(--pad);
    width: var(--knob);
    height: var(--knob);
    transition: translate var(--travel);
  }
  .on .knob { translate: calc(var(--w) - var(--knob) - 2 * var(--pad)) 0; }
  .body {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 calc(var(--h) * 0.035) calc(var(--h) * 0.03) #2a140c55);
  }
  .knob svg { display: block; width: 100%; height: 100%; overflow: visible; transition: filter var(--dusk); }
  /* Rolling without slipping: the travel (w − knob − 2·pad = 1.2 h) over the radius (0.42 h)
     is 2.86 rad, so the cap turns 164 degrees. */
  .roll { transition: rotate var(--travel); }
  .on .roll { rotate: 164deg; }
  .night .knob svg { filter: brightness(0.7) saturate(0.85); }
</style>
</head>
<body>
<button class="toggle" role="switch" aria-checked="false" aria-label="Night">
  <div class="sky-night"></div>
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="hill back"></div>
  <div class="hill front"></div>
  <div class="knob">
    <div class="body">
      <svg viewBox="-100 -100 200 200">
        <defs>
          <radialGradient id="dome" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6e130b"/>
            <stop offset="0.7" stop-color="#a32a15"/>
            <stop offset="1" stop-color="#b8321a"/>
          </radialGradient>
          <radialGradient id="light" cx="-38" cy="-42" r="150" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
            <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
            <stop offset="0.85" stop-color="#2a0804" stop-opacity="0"/>
            <stop offset="1" stop-color="#2a0804" stop-opacity="0.18"/>
          </radialGradient>
        </defs>
        <clipPath id="underside"><ellipse cy="10" rx="96" ry="90"/></clipPath>
        <g clip-path="url(#underside)">
          <ellipse cy="10" rx="96" ry="90" fill="#d2c6ad"/>
          <!-- Gills as radial ticks: a wide dashed stroke around the stem's position. -->
          <circle cy="10" r="58" fill="none" stroke="#b3a68b" stroke-width="80" stroke-dasharray="1.2 3.4"/>
        </g>
        <g transform="translate(0 -5) scale(1 0.92)">
          <g class="roll">
            <circle r="100" fill="url(#dome)"/>
            <g class="warts" fill="#efe7d6"></g>
          </g>
          <circle r="100" fill="url(#light)"/>
        </g>
      </svg>
    </div>
  </div>
</button>
<script type="module">
const toggle = document.querySelector('.toggle');
const knobBody = toggle.querySelector('.body');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SVG = 'http://www.w3.org/2000/svg';

// Integrates a damped spring from 0 to 1 and returns it as a CSS linear() easing.
function spring(stiffness, damping) {
  const dt = 1 / 120;
  const samples = [];
  let x = 0, v = 0;
  while (samples.length < 600) {
    v += ((1 - x) * stiffness - v * damping) * dt;
    x += v * dt;
    samples.push(x);
    if (Math.abs(1 - x) < 0.001 && Math.abs(v) < 0.01) break;
  }
  const stops = samples.filter((_, i) => i % 3 === 2).map((s) => s.toFixed(3));
  return { easing: `linear(0, ${stops.join(', ')}, 1)`, duration: Math.round(samples.length * dt * 1000) };
}

const travel = calm ? { easing: 'ease-in-out', duration: 300 } : spring(90, 13);
toggle.style.setProperty('--travel', `${travel.duration}ms ${travel.easing}`);

// Warts seen from above: a jittered sunflower spiral, larger and denser at the crown.
function scatterWarts() {
  const warts = toggle.querySelector('.warts');
  let seed = 7;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 1; i <= 26; i++) {
    const radius = 90 * Math.sqrt(i / 26) + (random() - 0.5) * 10;
    const angle = i * 2.39996 + random() * 0.8;
    const size = 8 - radius * 0.045 + random() * 2.5;
    const x = (Math.cos(angle) * radius).toFixed(1), y = (Math.sin(angle) * radius).toFixed(1);
    const wart = document.createElementNS(SVG, 'ellipse');
    wart.setAttribute('cx', x);
    wart.setAttribute('cy', y);
    // Warts foreshorten along the radius toward the rim, where the dome turns edge-on.
    wart.setAttribute('rx', (size * (1 - radius / 160)).toFixed(1));
    wart.setAttribute('ry', (size * (0.8 + random() * 0.4)).toFixed(1));
    wart.setAttribute('transform', `rotate(${(angle * 180 / Math.PI).toFixed(0)} ${x} ${y})`);
    warts.append(wart);
  }
}

function scatterStars() {
  let seed = 3;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 30; i++) {
    const left = 6 + random() * 58, top = 8 + random() * 56;
    // Stars fill the sky beside the knob but stay off the moon.
    if (left > 18 && left < 42 && top < 62) continue;
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = `${left}%`;
    star.style.top = `${top}%`;
    star.style.transitionDelay = `${250 + i * 30}ms`;
    star.style.animationDelay = `${-random() * 3}s`;
    star.style.width = `calc(var(--h) * ${(0.016 + random() * 0.02).toFixed(3)})`;
    toggle.querySelector('.sky-night').after(star);
  }
}

// The knob leans back before it goes, stretches along its path, then lands and settles.
function squish(towardRight) {
  if (calm) return;
  const lean = towardRight ? -1 : 1;
  knobBody.animate([
    { transform: 'none' },
    { transform: `translateX(${lean * 4}%) scale(0.92, 1.06)`, offset: 0.14 },
    { transform: `translateX(${-lean * 3}%) scale(1.16, 0.88)`, offset: 0.4 },
    { transform: `translateX(${-lean * 2}%) scale(0.95, 1.04)`, offset: 0.7 },
    { transform: 'none' },
  ], { duration: 640, easing: 'cubic-bezier(0.3, 0, 0.3, 1)' });
}

let on = false;
function flip() {
  on = !on;
  toggle.classList.toggle('on', on);
  document.body.classList.toggle('night', on);
  toggle.setAttribute('aria-checked', on);
  squish(on);
}

// Real input takes over from the demo, which resumes after a few idle seconds.
const IDLE_MS = 4000;
let lastInput = -IDLE_MS;
toggle.addEventListener('pointerdown', () => {
  lastInput = performance.now();
  if (!calm) knobBody.animate({ transform: 'scale(0.94)' }, { duration: 140, easing: 'ease-out', fill: 'forwards' });
});
toggle.addEventListener('click', () => {
  lastInput = performance.now();
  knobBody.getAnimations().forEach((animation) => animation.cancel());
  flip();
});

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function demo() {
  for (;;) {
    await wait(on ? 3200 : 2600);
    if (performance.now() - lastInput > IDLE_MS) flip();
  }
}

scatterWarts();
scatterStars();
demo();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ecebe4; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
// Typewriter art: a monospaced face, struck through a black and red ribbon.
const FONT = '"Courier New", Courier, "Courier 10 Pitch", "Liberation Mono", monospace';
const CANDIDATES = ' .\'`,-:;~=+*!?ivxzocsaeXJYUOQ0#%&@WM8B';
const RAMP_SIZE = 14;
const ROWS = 50;

const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// Pass 1: one texel per character cell. R is how much ink the cell wants,
// G whether it is typed in red.
const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uScreen;
uniform vec2 uCell;
uniform vec2 uOrigin;
uniform float uYaw;
out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (p.y < m.x) m = vec2(p.y, 4.0);
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.15);
    if (res < 0.002 || t > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 material(vec3 p, vec3 n, float part) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.43, 0.07, 0.04), vec3(0.72, 0.2, 0.1), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.94, 0.91, 0.84), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) return vec3(0.82, 0.78, 0.68) * (0.75 + 0.25 * cos(atan(q.z, q.x) * 70.0));
  return mix(vec3(0.78, 0.75, 0.68), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

void main() {
  vec2 screen = uOrigin + gl_FragCoord.xy * uCell;
  vec2 uv = (screen - 0.5 * uScreen) / min(uScreen.x, uScreen.y);
  vec3 target = vec3(0.0, 0.55, 0.0);
  vec3 ro = target + vec3(sin(uYaw), 0.25, cos(uYaw)) * 3.3;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.0 * fw);
  // The light stays upper left of the viewer while the mushroom turns.
  vec3 key = normalize(-0.8 * rt + vec3(0.0, 0.5, 0.0) + 0.45 * vec3(sin(uYaw), 0.0, cos(uYaw)));

  vec2 ink = vec2(0.0);
  float t = 0.0;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 90; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.001 * t) { hit = vec2(t, m.y); break; }
    t += m.x;
    if (t > 7.0) break;
  }

  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    float shadow = softShadow(p + n * 0.003, key);
    float light = clamp(max(dot(n, key), 0.0) * shadow * 0.9 + (0.5 + 0.5 * n.y) * 0.25, 0.0, 1.0);
    if (hit.y > 3.5) {
      ink.x = 0.5 * (1.0 - shadow) * smoothstep(1.5, 0.3, length(p.xz));
    } else if (hit.y < 0.5) {
      // The cap is typed in red; its warts are left as bare paper.
      vec3 q = p; q.x -= 0.05 * q.y * q.y;
      float wart = warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2);
      ink = vec2(mix(0.45 + 0.55 * (1.0 - light), 0.0, wart), 1.0 - wart);
    } else if (hit.y < 1.5) {
      ink.x = 0.75;
    } else {
      // The pale stem: wrapped light keeps its lit flank to a few fine marks.
      float wrap = (0.5 + 0.5 * dot(n, key)) * mix(0.6, 1.0, shadow);
      ink.x = 0.12 + 0.75 * smoothstep(0.3, 0.95, 1.0 - wrap);
    }
  }
  outColor = vec4(ink, 0.0, 1.0);
}`;

// Pass 2: strike a glyph in every cell, slightly off its slot and unevenly inked.
const typeFragment = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uAtlas;
uniform vec2 uCell;
uniform vec2 uOrigin;
uniform float uGlyphs;
out vec4 outColor;

const vec3 PAPER = vec3(0.93, 0.925, 0.89);
const vec3 BLACK = vec3(0.13, 0.13, 0.15);
const vec3 RED = vec3(0.78, 0.12, 0.1);

float hash(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

void main() {
  vec2 px = gl_FragCoord.xy - uOrigin;
  vec2 cell = floor(px / uCell);
  vec2 sceneSize = vec2(textureSize(uScene, 0));
  vec3 col = PAPER * (0.985 + 0.03 * hash(floor(gl_FragCoord.xy * 0.5)));
  if (any(lessThan(cell, vec2(0.0))) || any(greaterThanEqual(cell, sceneSize))) {
    outColor = vec4(col, 1.0);
    return;
  }

  vec2 cellInk = texelFetch(uScene, ivec2(cell), 0).rg;
  float glyph = floor(cellInk.x * (uGlyphs - 0.01));

  // Every strike lands a little off and with its own pressure; a retyped cell gets a new one.
  vec2 seed = cell + glyph * 13.1;
  vec2 local = fract(px / uCell) + (vec2(hash(seed), hash(seed + 7.3)) - 0.5) * vec2(0.08, 0.12);
  float inside = step(0.0, local.x) * step(local.x, 1.0) * step(0.0, local.y) * step(local.y, 1.0);
  float coverage = texture(uAtlas, vec2((glyph + clamp(local.x, 0.0, 1.0)) / uGlyphs, 1.0 - local.y)).a * inside;
  float pressure = 0.7 + 0.3 * hash(seed + 2.9);
  float ribbon = 0.85 + 0.15 * hash(floor(gl_FragCoord.xy * 0.7));

  vec3 inkColor = mix(BLACK, RED, step(0.5, cellInk.y));
  col = mix(col, inkColor, coverage * pressure * ribbon);
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(fragment) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
  gl.bindAttribLocation(program, 0, 'position');
  gl.linkProgram(program);
  const uniforms = {};
  for (let i = 0; i < gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); i++) {
    const { name } = gl.getActiveUniform(program, i);
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return { program, uniforms };
}

const scene = createProgram(sceneFragment);
const type = createProgram(typeFragment);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function createTexture(filter) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return texture;
}

const sceneTexture = createTexture(gl.NEAREST);
const atlasTexture = createTexture(gl.LINEAR);
const sceneBuffer = gl.createFramebuffer();

function drawGlyphs(context, glyphs, w, h) {
  context.clearRect(0, 0, context.canvas.width, context.canvas.height);
  context.font = `bold ${Math.round(h * 0.86)}px ${FONT}`;
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillStyle = '#000';
  [...glyphs].forEach((glyph, i) => context.fillText(glyph, (i + 0.5) * w, h * 0.54));
}

// Rank the candidate glyphs by how much ink they lay down in this font, then
// keep a ramp whose steps are evenly spaced in darkness.
function buildRamp(w, h) {
  const atlas = document.createElement('canvas');
  atlas.width = w * CANDIDATES.length;
  atlas.height = h;
  const context = atlas.getContext('2d', { willReadFrequently: true });
  drawGlyphs(context, CANDIDATES, w, h);
  const alpha = context.getImageData(0, 0, atlas.width, h).data;
  const ink = [...CANDIDATES].map((glyph, i) => {
    let sum = 0;
    for (let y = 0; y < h; y++)
      for (let x = i * w; x < (i + 1) * w; x++) sum += alpha[(y * atlas.width + x) * 4 + 3];
    return { glyph, sum };
  });
  const darkest = Math.max(...ink.map((entry) => entry.sum));
  let ramp = '';
  for (let step = 0; step < RAMP_SIZE; step++) {
    const target = darkest * step / (RAMP_SIZE - 1);
    const nearest = ink.reduce((a, b) => (Math.abs(b.sum - target) < Math.abs(a.sum - target) ? b : a));
    if (!ramp.includes(nearest.glyph)) ramp += nearest.glyph;
  }
  atlas.width = w * ramp.length;
  drawGlyphs(context, ramp, w, h);
  return { atlas, length: ramp.length };
}

let grid, glyphCount;
function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w;
  canvas.height = h;

  // Courier's pitch: characters are three fifths as wide as a line is tall.
  const cellH = Math.min(w, h) / ROWS;
  const cell = [cellH * 0.6, cellH];
  const size = [Math.floor(w / cell[0]), Math.floor(h / cell[1])];
  grid = { cell, size, origin: [(w - size[0] * cell[0]) / 2, (h - size[1] * cell[1]) / 2] };

  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, size[0], size[1], 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneBuffer);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTexture, 0);

  const ramp = buildRamp(Math.max(Math.round(cell[0] * 2), 6), Math.max(Math.round(cell[1] * 2), 10));
  glyphCount = ramp.length;
  gl.bindTexture(gl.TEXTURE_2D, atlasTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ramp.atlas);
}

function frame(ms) {
  resize();
  const { cell, size, origin } = grid;

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneBuffer);
  gl.viewport(0, 0, size[0], size[1]);
  gl.useProgram(scene.program);
  gl.uniform2f(scene.uniforms.uScreen, canvas.width, canvas.height);
  gl.uniform2f(scene.uniforms.uCell, cell[0], cell[1]);
  gl.uniform2f(scene.uniforms.uOrigin, origin[0], origin[1]);
  gl.uniform1f(scene.uniforms.uYaw, 0.6 + ms / 1000 * 0.3);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(type.program);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, atlasTexture);
  gl.uniform1i(type.uniforms.uScene, 0);
  gl.uniform1i(type.uniforms.uAtlas, 1);
  gl.uniform2f(type.uniforms.uCell, cell[0], cell[1]);
  gl.uniform2f(type.uniforms.uOrigin, origin[0], origin[1]);
  gl.uniform1f(type.uniforms.uGlyphs, glyphCount);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>

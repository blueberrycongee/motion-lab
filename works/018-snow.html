<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5d6672; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
uniform float uCapSnow;      // depth of snow on the cap
uniform float uGroundSnow;   // depth of snow on the ground
uniform float uWet;          // 0 powder, 1 thawing slush
uniform float uSnowfall;     // 0 calm, 1 steady snowfall
uniform vec4 uSlab;          // the slab sliding off: origin xy in the cap frame, tilt, impact 0..1
uniform float uSlabSize;     // 0 while there is no slab
out vec4 outColor;

const float FOCAL = 2.0;
const vec3 SUN = vec3(-0.78, 0.2, -0.59);       // the last light, low behind the trees
const vec3 SKY = vec3(0.42, 0.5, 0.64);
const vec3 SUNLIGHT = vec3(0.78, 0.66, 0.6);
const float SLAB_DEPTH = 0.07;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(vec3(i, 0.0)), hash(vec3(i + vec2(1, 0), 0.0)), f.x),
             mix(hash(vec3(i + vec2(0, 1), 0.0)), hash(vec3(i + vec2(1, 1), 0.0)), f.x), f.y);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// Snow on the cap, c relative to the cap centre: a pillow raised over the dome, thickest
// at the crown and thinning out where the dome gets too steep to hold it. Hidden inside the cap at depth 0.
float snowPillow(vec3 c, float depth) {
  vec3 centre = vec3(0.0, depth * 0.5 - 0.015, 0.0);
  vec3 radii = vec3(0.52 + depth * 0.3, 0.31 + depth * 0.55, 0.52 + depth * 0.3);
  float lumps = 0.012 * (noise(c.xz * 13.0) - 0.5);
  return -smin(-(sdEllipsoid(c - centre, radii) + lumps), c.y - 0.14, 0.04);
}

// Where the load cracks: the part beyond this line slides off, the rest stays to thaw.
float crack(vec3 c) {
  return c.x + 0.05 - 0.04 * sin(c.z * 9.0 + 1.0);
}

// The slab that slid off, as a shell: its share of the pillow minus the dome it rested on.
// On impact it slumps against the ground into a solid mound.
float slab(vec3 c) {
  float squash = 1.0 - 0.65 * uSlab.w;
  vec3 q = c - vec3(uSlab.xy, 0.0);
  float ground = uSlab.y + 0.8;
  q.y = (q.y + ground) / squash - ground;
  float s = sin(uSlab.z), k = cos(uSlab.z);
  q.xy = mat2(k, s, -s, k) * q.xy / uSlabSize;
  float hollow = sdEllipsoid(q, vec3(0.56, 0.31, 0.56) * (1.0 - uSlab.w) + 0.001);
  float shell = max(snowPillow(q, SLAB_DEPTH), -hollow);
  return max(shell, -crack(q)) * uSlabSize * squash;
}

// Snow lies thinner under the cap and drifts in soft waves; it melts from the thin spots first.
float groundSnow(vec2 xz) {
  float shelter = smoothstep(0.2, 0.75, length(xz - vec2(0.03, 0.0)));
  float drift = noise(xz * 1.7) * 0.6 + noise(xz * 5.0) * 0.4;
  return max(uGroundSnow * (0.35 + 0.65 * shelter) + 0.03 * (drift - 0.65), 0.0);
}

// Parts: 0 cap, 1 gills, 2 stem, 3 ring, 4 ground, 5 snow.
vec2 map(vec3 p) {
  vec2 res = vec2(p.y - groundSnow(p.xz), 4.0);
  vec3 c = p - vec3(0.05 * p.y * p.y, 0.8, 0.0);
  if (length(p - vec3(0.04, 0.58, 0.0)) - 0.75 < res.x) {
    vec2 m = mushroom(p);
    if (m.x < res.x) res = m;
    float snow = snowPillow(c, uCapSnow);
    if (uSlabSize > 0.0) snow = max(snow, crack(c));
    if (snow < res.x) res = vec2(snow, 5.0);
  }
  if (uSlabSize > 0.0) {
    float s = slab(c);
    if (s < res.x) res = vec2(s, 5.0);
  }
  return res;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 48; i++) {
    float h = map(ro + rd * t).x;
    res = min(res, 8.0 * h / t);
    t += clamp(h, 0.01, 0.2);
    if (res < 0.002 || t > 5.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float occlusion(vec3 p, vec3 n) {
  float o = 0.0, w = 1.0;
  for (int i = 1; i <= 5; i++) {
    float h = 0.02 + 0.06 * float(i);
    o += (h - map(p + n * h).x) * w;
    w *= 0.7;
  }
  return clamp(1.0 - 2.2 * o, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

// Dusk sky over a far line of spruce, fading into the cold haze at the horizon.
vec3 sky(vec3 rd) {
  vec3 col = mix(vec3(0.6, 0.62, 0.66), vec3(0.25, 0.3, 0.4), smoothstep(0.0, 0.5, rd.y));
  col = mix(col, vec3(0.72, 0.64, 0.6), 0.45 * pow(max(dot(normalize(rd.xz), normalize(SUN.xz)), 0.0), 3.0) * exp(-max(rd.y, 0.0) * 9.0));
  float a = atan(rd.x, rd.z);
  float spires = abs(fract(a * 34.0 + noise(vec2(a * 9.0, 0.0)) * 2.0) * 2.0 - 1.0) * (0.6 + 0.4 * noise(vec2(a * 70.0, 2.0)));
  float treeline = 0.025 + 0.05 * noise(vec2(a * 6.0, 3.0)) + 0.035 * (1.0 - spires) * noise(vec2(a * 40.0, 1.0));
  return mix(col, vec3(0.36, 0.4, 0.47), smoothstep(0.004, 0.0, rd.y - treeline) * 0.55);
}

// Albedo of a part; also reports its glossiness and how much of it is snow.
vec3 material(vec3 p, vec3 n, float part, out float gloss, out float snowCover) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  gloss = 0.1 + 0.6 * uWet;
  snowCover = 0.0;
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.38, 0.05, 0.035), vec3(0.62, 0.18, 0.07), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.86, 0.82, 0.74), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) return vec3(0.82, 0.77, 0.66) * (0.85 + 0.15 * cos(atan(q.z, q.x) * 70.0));
  if (part < 3.5) return mix(vec3(0.72, 0.68, 0.6), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
  vec3 snow = mix(vec3(0.9, 0.93, 0.98), vec3(0.7, 0.75, 0.8), uWet);
  gloss = 0.1 + 0.15 * uWet;
  snowCover = part > 4.5 ? 1.0 : smoothstep(0.0, 0.012, p.y);
  if (part > 4.5) return snow;
  // Frozen leaf litter shows through where the snow is thin.
  float leaves = noise(p.xz * 31.0 + noise(p.xz * 9.0) * 3.0);
  float litter = noise(p.xz * 4.0) * 0.4 + leaves * 0.6;
  vec3 soil = mix(vec3(0.12, 0.1, 0.09), vec3(0.36, 0.28, 0.2), litter) * (1.0 - 0.35 * uWet);
  gloss = mix(0.2 + 0.4 * uWet, gloss, snowCover);
  return mix(soil, snow, snowCover);
}

// Ice crystals that catch the light: rare cells of a fine grid, twinkling as the view drifts.
float glints(vec3 p, vec3 rd) {
  vec3 cell = floor(p * 140.0);
  float facet = hash(cell + floor(rd * 40.0));
  return step(0.985, facet) * hash(cell + 3.1);
}

// Flakes in layers at increasing depth, each drifting and swaying, hidden behind nearer surfaces.
float snowfall(vec2 uv, float sceneDepth) {
  float sum = 0.0;
  float pixel = 1.0 / min(uResolution.x, uResolution.y);
  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    float depth = 0.9 * pow(1.45, fi);
    if (depth > sceneDepth) break;
    vec2 w = uv * depth / FOCAL * 4.5 + vec2(fi * 7.3, 0.0);
    w.y += uTime * 0.55 + fi * 0.41;
    w.x += sin(uTime * 0.7 + w.y * 1.3 + fi) * 0.15;
    vec2 id = floor(w), f = fract(w) - 0.5;
    vec2 at = vec2(hash(vec3(id, fi)), hash(vec3(id, fi + 9.0))) - 0.5;
    at.x += 0.15 * sin(uTime * 1.6 + hash(vec3(id, 4.0)) * 6.3);
    float size = (0.03 + 0.03 * hash(vec3(id, 2.0)));
    float blur = max(abs(depth - 2.6) * 0.012, pixel * depth / FOCAL * 4.5);
    float flake = smoothstep(size + blur, size - blur, length((f - at * 0.6)));
    sum += flake * step(0.35, hash(vec3(id, fi + 5.0))) * size / (size + blur);
  }
  return min(sum, 1.0);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  float yaw = 0.55 + 0.12 * sin(uTime * 0.07);
  vec3 target = vec3(0.0, 0.5, 0.0);
  vec3 ro = target + vec3(sin(yaw), 0.24, cos(yaw)) * 3.5;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + FOCAL * fw);

  vec3 col = sky(rd);
  float t = 0.0, depth = 1e9;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 100; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0005 * t) { hit = vec2(t, m.y); break; }
    t += m.x;
    if (t > 14.0) break;
  }

  if (hit.x > 0.0) {
    depth = hit.x;
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    vec3 sun = normalize(SUN);
    float shadow = softShadow(p + n * 0.004, sun);
    float ao = occlusion(p, n);
    float gloss, snowCover;
    vec3 albedo = material(p, n, hit.y, gloss, snowCover);
    // Wrapped diffuse: light scatters a little way into snow and flesh alike.
    float diff = clamp((dot(n, sun) + 0.25) / 1.25, 0.0, 1.0) * shadow;
    float bounce = (0.5 - 0.5 * n.y) * (0.4 + uGroundSnow * 6.0);   // snow lights things from below
    vec3 lit = albedo * (SUNLIGHT * diff * 0.7 + (SKY * (0.72 + 0.38 * n.y) + vec3(0.5, 0.54, 0.6) * bounce) * ao);
    vec3 h = normalize(sun - rd);
    lit += SUNLIGHT * pow(max(dot(n, h), 0.0), 40.0) * shadow * gloss;
    lit += albedo * SKY * 0.3 * snowCover;      // light scattered inside the snow fills its creases
    lit += sky(reflect(rd, n)) * pow(1.0 - max(dot(n, -rd), 0.0), 4.0) * gloss * ao;
    lit += vec3(0.9, 0.9, 1.0) * glints(p, rd) * snowCover * (1.0 - uWet) * (0.3 + 0.7 * shadow);
    col = mix(lit, sky(rd), smoothstep(5.0, 13.0, hit.x));
  }

  col = mix(col, vec3(0.86, 0.89, 0.94), snowfall(uv, depth) * uSnowfall * 0.9);
  col *= 1.0 - 0.3 * dot(uv, uv);
  col = pow(col, vec3(0.9));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.012;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uniform = (name) => gl.getUniformLocation(program, name);
const uResolution = uniform('uResolution');
const uTime = uniform('uTime');
const uCapSnow = uniform('uCapSnow');
const uGroundSnow = uniform('uGroundSnow');
const uWet = uniform('uWet');
const uSnowfall = uniform('uSnowfall');
const uSlab = uniform('uSlab');
const uSlabSize = uniform('uSlabSize');

// One winter evening in 32 seconds: snow builds up, the cap sheds its load, everything thaws.
const CYCLE = 32;
const SLIDE_AT = 20;
const CAP_DEPTH = 0.07;
const GROUND_DEPTH = 0.06;
const ramp = (t, a, b) => {
  const x = Math.min(Math.max((t - a) / (b - a), 0), 1);
  return x * x * (3 - 2 * x);
};

// The slab hinges over the crown's centre of curvature, slipping faster and faster, then
// leaves the rim, tumbles and lands as a squashed lump. Poses place the cap frame's origin.
const PIVOT_Y = -0.7, ARM = 0.7, TIP = 0.8, RELEASE = 1.4, GRAVITY = 4;
function slabPose(s) {
  if (s < RELEASE) {
    const a = TIP * (s / RELEASE) ** 2;
    return [ARM * Math.sin(a), PIVOT_Y + ARM * Math.cos(a), a, 0];
  }
  const spin = 2 * TIP / RELEASE;
  const x0 = ARM * Math.sin(TIP), y0 = PIVOT_Y + ARM * Math.cos(TIP);
  const vx = spin * ARM * Math.cos(TIP), vy = -spin * ARM * Math.sin(TIP);
  const floor = -0.45;
  const tLand = (vy + Math.sqrt(vy * vy + 2 * GRAVITY * (y0 - floor))) / GRAVITY;
  const f = Math.min(s - RELEASE, tLand);
  const impact = ramp(s - RELEASE - tLand, 0, 0.3);
  return [x0 + vx * f, y0 + vy * f - 0.5 * GRAVITY * f * f, TIP + spin * 0.6 * f, impact];
}

function setScene(t) {
  const u = t % CYCLE;
  const melt = 1 - ramp(u, 23, 31);
  gl.uniform1f(uCapSnow, CAP_DEPTH * ramp(u, 0.5, SLIDE_AT - 1) * melt);
  gl.uniform1f(uGroundSnow, GROUND_DEPTH * ramp(u, 1, 19) * melt);
  gl.uniform1f(uWet, ramp(u, 22, 25) * (1 - ramp(u, 30, 32)));
  gl.uniform1f(uSnowfall, ramp(u, 0, 2) * (1 - ramp(u, 20, 24)));
  gl.uniform4fv(uSlab, slabPose(Math.max(u - SLIDE_AT, 0)));
  gl.uniform1f(uSlabSize, u < SLIDE_AT ? 0 : Math.sqrt(melt));
}

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  setScene(ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
  body { background: radial-gradient(120% 90% at 50% 40%, #e2d6b8, #cbbb94 70%, #b8a67e); }
  .walker, .shadow, .print { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .lean { position: absolute; transform-origin: 0 0; }
  .body {
    position: absolute; left: -0.5345em; bottom: 0; width: 1.069em; height: 1em;
    overflow: visible; transform-origin: 50% 100%;
  }
  .head { transform-box: fill-box; transform-origin: 50% 100%; }
  .shadow::after, .print::after {
    content: ''; position: absolute; border-radius: 50%;
    left: -0.38em; top: -0.05em; width: 0.76em; height: 0.1em;
    background: radial-gradient(closest-side, #5b4a2bb0, #5b4a2b00);
  }
  .print::after { left: -0.06em; top: -0.025em; width: 0.12em; height: 0.05em; background: #b09c70; }
</style>
</head>
<body>
<svg width="0" height="0">
  <defs>
    <radialGradient id="cap-shade" cx="32" cy="-1110" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e130b"/>
      <stop offset="1" stop-color="#b8321a"/>
    </radialGradient>
  </defs>
</svg>
<template>
  <div class="walker">
    <div class="lean">
      <svg class="body" viewBox="-620 -1160 1240 1160">
        <path fill="#e8e2d2" d="M175 0 L153 -43 L138 -86 L127 -129 L120 -172 L115 -215 L112 -258 L110 -301 L109 -344 L108 -387 L108 -430 L108 -473 L109 -516 L110 -559 L111 -602 L112 -645 L114 -688 L116 -731 L118 -774 L120 -817 L122 -860 L-48 -860 L-53 -817 L-58 -774 L-62 -731 L-66 -688 L-71 -645 L-75 -602 L-79 -559 L-82 -516 L-86 -473 L-90 -430 L-93 -387 L-97 -344 L-101 -301 L-106 -258 L-111 -215 L-117 -172 L-126 -129 L-137 -86 L-153 -43 L-175 0 Z"/>
        <path fill="#ddd5c2" d="M145 -555 L132 -605 L119 -655 L-76 -655 L-95 -605 L-114 -555 Z"/>
        <g class="head">
          <path fill="#d2c6ad" d="M-518 -822 Q32 -862 582 -822 L552 -800 Q32 -830 -488 -800 Z"/>
          <path fill="url(#cap-shade)" d="M591 -820 A560 310 0 1 0 -527 -820 Q32 -860 591 -820 Z"/>
          <g fill="#efe7d6">
            <ellipse cx="12" cy="-1070" rx="30" ry="24"/>
            <ellipse cx="202" cy="-1050" rx="26" ry="21"/>
            <ellipse cx="-188" cy="-1030" rx="28" ry="22"/>
            <ellipse cx="362" cy="-990" rx="30" ry="24"/>
            <ellipse cx="-348" cy="-960" rx="24" ry="19"/>
            <ellipse cx="92" cy="-990" rx="34" ry="27"/>
            <ellipse cx="-88" cy="-940" rx="22" ry="18"/>
            <ellipse cx="252" cy="-930" rx="25" ry="20"/>
            <ellipse cx="472" cy="-900" rx="20" ry="16"/>
            <ellipse cx="-438" cy="-880" rx="18" ry="14"/>
            <ellipse cx="-248" cy="-890" rx="26" ry="21"/>
            <ellipse cx="132" cy="-880" rx="20" ry="16"/>
            <ellipse cx="372" cy="-875" rx="17" ry="14"/>
            <ellipse cx="-28" cy="-880" rx="16" ry="13"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
</template>
<script type="module">
// One parent and five young, by height in units of the shorter side of the view.
const SIZES = [0.34, 0.19, 0.175, 0.16, 0.145, 0.13];
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const template = document.querySelector('template');

// A damped spring, integrated in small steps so it stays stable on slow frames.
function spring(s, target, stiffness, damping, dt) {
  for (let t = 0; t < dt; t += 1 / 240) {
    const h = Math.min(1 / 240, dt - t);
    s.v += (stiffness * (target - s.x) - damping * s.v) * h;
    s.x += s.v * h;
  }
}

const walkers = SIZES.map((size, i) => {
  const node = template.content.firstElementChild.cloneNode(true);
  const shadow = document.createElement('div');
  shadow.className = 'shadow';
  document.body.append(shadow, node);
  return {
    size, node, shadow,
    lean: node.querySelector('.lean'),
    body: node.querySelector('.body'),
    head: node.querySelector('.head'),
    x: { x: -0.2 * i, v: 0 }, y: { x: 0.1, v: 0 },
    tilt: { x: 0, v: 0 }, capTilt: { x: 0, v: 0 }, facing: { x: 1, v: 0 },
    stride: 0,
  };
});

// The parent strolls a looping path whose pace eases to a full stop every few seconds,
// so the young pile up behind it and spring apart again.
function stroll(t, view) {
  const s = 1.25 * (t - 0.85 * Math.sin(t));
  return {
    x: (view.w / 2 - 0.3) * Math.sin(0.37 * s + 0.5),
    y: view.h * 0.08 + (view.h / 2 - 0.3) * Math.sin(0.61 * s),
  };
}

let pointer = null;
let lastInput = -Infinity;
addEventListener('pointermove', (event) => {
  pointer = event;
  lastInput = performance.now();
});

function dropPrint(walker, px, py, unit) {
  const print = document.createElement('div');
  print.className = 'print';
  print.style.translate = `${px}px ${py}px`;
  print.style.fontSize = `${walker.size * unit}px`;
  document.body.prepend(print);
  print.animate({ opacity: [0.8, 0] }, { duration: 3500, easing: 'ease-in' }).finished.then(() => print.remove());
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20);
  last = now;
  const unit = Math.min(innerWidth, innerHeight);
  const view = { w: innerWidth / unit, h: innerHeight / unit };

  let goal = stroll(now / 1000 * (calm ? 0.4 : 1), view);
  if (pointer && now - lastInput < 3000) {
    goal = { x: (pointer.clientX - innerWidth / 2) / unit, y: (pointer.clientY - innerHeight / 2) / unit + 0.1 };
  }

  walkers.forEach((w, i) => {
    // Each young aims for a spot one body-length behind the one ahead of it.
    if (i > 0) {
      const ahead = walkers[i - 1];
      const dx = w.x.x - ahead.x.x, dy = w.y.x - ahead.y.x;
      const gap = 0.5 * (w.size + ahead.size) / Math.max(Math.hypot(dx, dy), 1e-4);
      goal = { x: ahead.x.x + dx * gap, y: ahead.y.x + dy * gap };
    }
    const stiffness = i ? 60 : 30, damping = i ? 8.5 : 9;
    spring(w.x, goal.x, stiffness, damping, dt);
    spring(w.y, goal.y, stiffness, damping, dt);

    // Lean into the motion; the cap lags the lean and swings past it.
    const speed = Math.hypot(w.x.v, w.y.v);
    spring(w.tilt, Math.max(-12, Math.min(12, w.x.v * 30)), 120, 14, dt);
    spring(w.capTilt, w.tilt.x, 90, 6, dt);
    if (Math.abs(w.x.v) > 0.03) spring(w.facing, Math.sign(w.x.v), 140, 18, dt);
    else spring(w.facing, Math.sign(w.facing.x) || 1, 140, 18, dt);

    // Little hops, one per stride; shorter legs take quicker steps.
    const before = Math.floor(w.stride / Math.PI);
    w.stride += speed * dt / (w.size * 0.13);
    const lift = Math.abs(Math.sin(w.stride)) * Math.min(speed / 0.2, 1);
    const contact = Math.pow(1 - Math.abs(Math.sin(w.stride)), 8) * Math.min(speed / 0.2, 1);
    const stretch = 1 + 0.07 * lift - 0.16 * contact;

    const depth = 0.8 + 0.25 * (w.y.x / (view.h / 2));
    const px = innerWidth / 2 + w.x.x * unit;
    const py = innerHeight / 2 + w.y.x * unit;
    const em = w.size * depth * unit;
    w.node.style.cssText = `translate: ${px}px ${py - lift * 0.14 * em}px; font-size: ${em}px; z-index: ${Math.round(py)}`;
    w.shadow.style.cssText = `translate: ${px}px ${py}px; font-size: ${em}px; scale: ${1 - 0.3 * lift}`;
    w.lean.style.rotate = `${w.tilt.x}deg`;
    w.body.style.scale = `${w.facing.x * (2 - stretch)} ${stretch}`;
    w.head.style.rotate = `${(w.capTilt.x - w.tilt.x) * 1.4 * Math.sign(w.facing.x)}deg`;
    if (Math.floor(w.stride / Math.PI) !== before && speed > 0.05) dropPrint(w, px, py, unit * depth);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

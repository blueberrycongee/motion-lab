<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6fa6dc; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2', { antialias: false });

// The scene renders at a fraction of the device resolution; the ink pass draws
// its lines at full resolution on top.
const RENDER_SCALE = 0.75;

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// Pass 1: the painted scene, plus a geometry buffer (normal, depth, part) for the ink.
const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
uniform vec2 uWind;
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outGeometry;

const vec3 SUN = normalize(vec3(-0.7, 0.62, 0.36));
const vec3 BOUNDS_CENTER = vec3(0.0, 0.56, 0.0);
const float BOUNDS_RADIUS = 0.92;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(vec3(i, 0.0)), b = hash(vec3(i + vec2(1, 0), 0.0));
  float c = hash(vec3(i + vec2(0, 1), 0.0)), d = hash(vec3(i + vec2(1, 1), 0.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * noise(p); p = p * 2.03 + 7.1; a *= 0.5; }
  return s;
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// The breeze bends the stem: displacement grows with the square of the height.
vec3 unbend(vec3 p) {
  p.xz -= uWind * p.y * p.y;
  return p;
}

// A tuft of flat grass blades around the foot of the stem, bending with the same breeze.
float grass(vec3 p) {
  if (p.y > 0.32 || dot(p.xz, p.xz) > 0.5) return 1.0;
  float d = 1.0;
  for (int i = 0; i < 22; i++) {
    float fi = float(i);
    float angle = fi * 2.4 + hash(vec3(fi, 1.0, 0.0));
    float height = 0.08 + 0.17 * hash(vec3(fi, 2.0, 0.0));
    vec2 outward = vec2(cos(angle), sin(angle));
    vec3 q = p - vec3(outward.x, 0.0, outward.y) * (0.17 + 0.3 * hash(vec3(fi, 3.0, 0.0)));
    q.xz -= (outward * 0.3 + uWind * 3.0) * q.y * q.y / height;
    float h = clamp(q.y / height, 0.0, 1.0);
    float across = dot(q.xz, vec2(-outward.y, outward.x));
    float blade = length(vec2(across, q.y - h * height)) - 0.028 * (1.0 - h);
    d = min(d, max(max(blade, abs(dot(q.xz, outward)) - 0.004), -q.y));
  }
  return d * 0.7;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(unbend(p));
  m.x *= 0.85;
  float g = grass(p);
  return g < m.x ? vec2(g, 4.0) : m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float shadow(vec3 ro, vec3 rd) {
  float t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = map(ro + rd * t).x;
    if (h < 0.001) return 0.0;
    t += clamp(h, 0.01, 0.12);
    if (t > 2.0) break;
  }
  return 1.0;
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return step(d, 0.24);
}

// Flat cel colours: the lit tone and the hand-picked shadow tone of each part.
void palette(vec3 q, vec3 n, float part, out vec3 lit, out vec3 shade) {
  float r = length(q.xz);
  if (part < 0.5) {
    if (warts(q - vec3(0.0, 0.8, 0.0)) * step(-0.1, n.y) > 0.5) {
      lit = vec3(1.0, 0.96, 0.88); shade = vec3(0.7, 0.71, 0.8);
      return;
    }
    float crown = step(r, 0.24);
    lit = mix(vec3(0.9, 0.24, 0.13), vec3(0.74, 0.12, 0.09), crown);
    shade = mix(vec3(0.55, 0.1, 0.13), vec3(0.42, 0.06, 0.1), crown);
  } else if (part < 1.5) {
    float lamella = step(0.82, cos(atan(q.z, q.x) * 60.0)) * step(0.16, r);
    lit = vec3(0.93, 0.87, 0.74) * (1.0 - 0.25 * lamella);
    shade = vec3(0.66, 0.6, 0.62) * (1.0 - 0.25 * lamella);
  } else if (part < 3.5) {
    lit = vec3(0.98, 0.95, 0.88);
    shade = vec3(0.74, 0.7, 0.77);
  } else {
    lit = vec3(0.5, 0.76, 0.28);
    shade = vec3(0.24, 0.47, 0.32);
  }
}

vec3 shadeMushroom(vec3 p, vec3 n, vec3 rd, float part) {
  vec3 q = unbend(p); q.x -= 0.05 * q.y * q.y;
  vec3 lit, shade;
  palette(q, n, part, lit, shade);
  // Grass blades are thin enough to light from either face.
  float facing = part > 3.5 ? abs(dot(n, SUN)) : dot(n, SUN);
  float light = min(facing, shadow(p + n * 0.004, SUN) - 0.5);
  float w = fwidth(light) + 0.01;
  vec3 col = mix(shade, lit * vec3(1.0, 0.98, 0.94), smoothstep(-w, w, light - 0.02));

  // One crisp specular blob on the cap, and a sky-coloured rim on the shadowed edge.
  vec3 h = normalize(SUN - rd);
  if (part < 0.5) col = mix(col, vec3(1.0, 0.82, 0.72), step(0.994, dot(n, h)) * step(0.0, light));
  float rim = (1.0 + dot(rd, n)) * step(part, 3.5);
  col = mix(col, vec3(0.78, 0.9, 1.0), step(0.62, rim) * step(light, 0.0) * step(0.0, n.y + 0.4) * 0.8);
  return col;
}

// Positive inside a cloud: a bank along the horizon with towers rising out of it.
float cloudBody(vec2 s) {
  float towers = 0.26 * smoothstep(0.45, 0.85, noise(vec2(s.x * 0.9, 0.0)));
  return fbm(s) - 0.4 - s.y * 0.2 + towers;
}

// Cumulus as flat shapes: a billow is lit where no cloud sits above it towards the sun.
vec3 sky(vec3 rd) {
  float h = max(rd.y, 0.0);
  vec3 col = mix(vec3(0.72, 0.86, 0.95), vec3(0.17, 0.45, 0.82), pow(h, 0.6));
  vec2 s = vec2(atan(rd.x, rd.z) * 4.5 + uTime * 0.01, h * 9.0);
  float body = cloudBody(s);
  float cloud = smoothstep(0.0, 0.01, body);
  float lit = step(cloudBody(s + vec2(-0.06, 0.26)), 0.0);
  vec3 cloudCol = mix(vec3(0.68, 0.76, 0.9), vec3(1.0, 0.99, 0.96), lit);
  return mix(col, cloudCol, cloud);
}

vec3 meadow(vec3 p, float dist) {
  vec2 xz = p.xz;
  float patches = step(0.52, fbm(xz * 0.8));
  vec3 col = mix(vec3(0.38, 0.66, 0.24), vec3(0.3, 0.55, 0.22), patches);
  // Gusts comb the grass into brighter bands that run with the wind.
  float gust = fbm(xz * 0.5 + vec2(uTime * 0.35, uTime * 0.1));
  col = mix(col, vec3(0.6, 0.78, 0.33), step(0.62, gust));
  vec2 cell = floor(xz * 9.0);
  vec2 f = fract(xz * 9.0) - 0.5;
  float flower = step(0.92, hash(vec3(cell, 3.0))) * step(length(f), 0.12);
  col = mix(col, mix(vec3(1.0, 0.97, 0.88), vec3(1.0, 0.86, 0.36), step(0.5, hash(vec3(cell, 5.0)))), flower * step(dist, 9.0));
  if (length(xz) < 1.6) {
    float lit = shadow(p + vec3(0.0, 0.002, 0.0), SUN);
    col = mix(col * vec3(0.55, 0.66, 0.85), col, lit);
  }
  return mix(col, vec3(0.42, 0.62, 0.5), smoothstep(8.0, 40.0, dist));
}

// Distant tree line and hills along the horizon, flat as painted flats.
vec3 horizon(vec3 rd, vec3 col) {
  float az = atan(rd.x, rd.z);
  float hills = 0.06 * fbm(vec2(az * 1.2, 1.0)) - 0.012;
  col = mix(col, vec3(0.56, 0.71, 0.8), step(rd.y, hills) * step(-0.004, rd.y));
  float trees = 0.004 + 0.014 * noise(vec2(az * 22.0, 3.0)) + 0.006 * noise(vec2(az * 70.0, 4.0));
  trees *= smoothstep(0.3, 0.5, noise(vec2(az * 2.5, 5.0)));
  return mix(col, vec3(0.27, 0.47, 0.43), step(rd.y, trees) * step(-0.004, rd.y));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  float yaw = 0.5 + 0.08 * sin(uTime * 0.05);
  vec3 target = vec3(0.0, 0.6, 0.0);
  vec3 ro = vec3(sin(yaw) * 4.1, 0.3, cos(yaw) * 4.1);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.3 * fw);

  vec3 col = rd.y < 0.0 ? meadow(ro - rd * ro.y / rd.y, -ro.y / rd.y) : sky(rd);
  col = horizon(rd, col);
  float depth = 1.0;

  vec3 n = vec3(0.0);
  float part = 5.0;
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float disc = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (disc > 0.0) {
    float t = max(-b - sqrt(disc), 0.0), tEnd = -b + sqrt(disc);
    for (int i = 0; i < 90; i++) {
      vec3 p = ro + rd * t;
      vec2 m = map(p);
      if (m.x < 0.0008 * t) {
        n = normalAt(p);
        part = m.y;
        col = shadeMushroom(p, n, rd, m.y);
        depth = t / 8.0;
        break;
      }
      t += m.x;
      if (t > tEnd) break;
    }
  }
  outColor = vec4(col, part / 5.0);
  outGeometry = vec4(n * 0.5 + 0.5, depth);
}`;

// Pass 2: ink where depth jumps, where the normal creases, or where one part meets another.
const inkFragment = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uGeometry;
uniform vec2 uResolution;
out vec4 outColor;

float edge(vec2 uv, vec2 offset) {
  vec4 a = texture(uGeometry, uv + offset), b = texture(uGeometry, uv - offset);
  float pa = texture(uScene, uv + offset).a, pb = texture(uScene, uv - offset).a;
  // Grass and scenery are painted background: only the mushroom cel is inked.
  if (pa > 0.7 && pb > 0.7) return 0.0;
  float depth = abs(a.a - b.a) / min(a.a, b.a);
  float crease = 1.0 - dot(a.rgb * 2.0 - 1.0, b.rgb * 2.0 - 1.0);
  float part = abs(pa - pb) * 5.0;
  return max(max(smoothstep(0.06, 0.12, depth), smoothstep(0.35, 0.6, crease)), smoothstep(0.3, 0.6, part));
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;
  vec2 px = max(1.0, min(uResolution.x, uResolution.y) / 700.0) / uResolution;
  float ink = max(max(edge(uv, vec2(px.x, 0.0)), edge(uv, vec2(0.0, px.y))),
                  max(edge(uv, px), edge(uv, vec2(px.x, -px.y))));
  vec3 col = texture(uScene, uv).rgb;
  col = mix(col, vec3(0.2, 0.09, 0.08), ink * 0.92);
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(fragmentSource) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
  gl.bindAttribLocation(program, 0, 'position');
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  return program;
}

const sceneProgram = createProgram(sceneFragment);
const inkProgram = createProgram(inkFragment);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const scene = {
  resolution: gl.getUniformLocation(sceneProgram, 'uResolution'),
  time: gl.getUniformLocation(sceneProgram, 'uTime'),
  wind: gl.getUniformLocation(sceneProgram, 'uWind'),
};
const ink = {
  resolution: gl.getUniformLocation(inkProgram, 'uResolution'),
  scene: gl.getUniformLocation(inkProgram, 'uScene'),
  geometry: gl.getUniformLocation(inkProgram, 'uGeometry'),
};

function target(width, height) {
  const textures = [0, 1].map(() => {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, width, height);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return texture;
  });
  const framebuffer = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  textures.forEach((texture, i) =>
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, texture, 0));
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  return { framebuffer, textures, width, height };
}

// Breeze: a slow swell with quicker gusts riding on it, mostly along one direction.
function wind(time) {
  const swell = Math.sin(time * 0.7) * 0.5 + 0.5;
  const gust = Math.sin(time * 2.3) * 0.35 + Math.sin(time * 3.7 + 1.2) * 0.15;
  const strength = 0.03 + 0.07 * swell * (1 + gust);
  return [strength, strength * 0.35 + 0.012 * Math.sin(time * 1.9)];
}

let buffer = null;
function frame(ms) {
  const time = ms / 1000;
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  const sw = Math.round(w * RENDER_SCALE), sh = Math.round(h * RENDER_SCALE);
  if (!buffer || buffer.width !== sw || buffer.height !== sh) {
    if (buffer) {
      gl.deleteFramebuffer(buffer.framebuffer);
      buffer.textures.forEach((texture) => gl.deleteTexture(texture));
    }
    buffer = target(sw, sh);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, buffer.framebuffer);
  gl.viewport(0, 0, sw, sh);
  gl.useProgram(sceneProgram);
  gl.uniform2f(scene.resolution, sw, sh);
  gl.uniform1f(scene.time, time);
  gl.uniform2fv(scene.wind, wind(time));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(inkProgram);
  gl.uniform2f(ink.resolution, w, h);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, buffer.textures[0]);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, buffer.textures[1]);
  gl.uniform1i(ink.scene, 0);
  gl.uniform1i(ink.geometry, 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

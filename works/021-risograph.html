<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risograph</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3efe4; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// Pass 1: the artwork separated by hand into two plates, the way riso art is
// drawn: red ink tone in R, blue ink tone in G.
const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uYaw;
out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (p.y < m.x) m = vec2(p.y, 4.0);
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.15);
    if (res < 0.002 || t > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 material(vec3 p, vec3 n, float part) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.43, 0.07, 0.04), vec3(0.72, 0.2, 0.1), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.94, 0.91, 0.84), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) return vec3(0.82, 0.78, 0.68) * (0.75 + 0.25 * cos(atan(q.z, q.x) * 70.0));
  return mix(vec3(0.78, 0.75, 0.68), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 target = vec3(0.0, 0.55, 0.0);
  vec3 ro = target + vec3(sin(uYaw), 0.22, cos(uYaw)) * 3.3;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.0 * fw);

  // A light blue tint fills the sheet, so the pale stem prints as bare paper.
  vec2 plates = vec2(0.0, 0.2 - 0.04 * uv.y);
  float t = 0.0;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 90; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0008 * t) { hit = vec2(t, m.y); break; }
    t += m.x;
    if (t > 7.0) break;
  }

  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    // The mushroom turns under a light that stays put, upper left of the viewer.
    vec3 key = normalize(-0.8 * rt + vec3(0.0, 0.6, 0.0) + 0.25 * vec3(sin(uYaw), 0.0, cos(uYaw)));
    float shadow = softShadow(p + n * 0.003, key);
    float light = clamp(max(dot(n, key), 0.0) * shadow * 0.85 + (0.5 + 0.5 * n.y) * 0.3, 0.0, 1.0);
    vec3 q = p; q.x -= 0.05 * q.y * q.y;
    if (hit.y < 0.5) {
      float wart = warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2);
      float crown = smoothstep(0.45, 0.1, length(q.xz));
      plates = vec2(1.0 - wart, 0.75 * (1.0 - light) + 0.25 * crown) * vec2(1.0, 1.0 - 0.7 * wart);
    } else if (hit.y < 1.5) {
      plates = vec2(0.2, 0.55 + 0.15 * cos(atan(q.z, q.x) * 70.0));
    } else if (hit.y < 3.5) {
      float wrap = (0.5 + 0.5 * dot(n, key)) * mix(0.6, 1.0, shadow);
      plates = vec2(0.0, 0.8 * smoothstep(0.35, 0.95, 1.0 - wrap));
    } else {
      plates.y += 0.55 * (1.0 - shadow) * smoothstep(1.4, 0.3, length(p.xz));
    }
  }
  outColor = vec4(clamp(plates, 0.0, 1.0), 0.0, 1.0);
}`;

// Pass 2: print each plate through a grainy screen with its own drum ink,
// slightly out of register, onto uncoated paper.
const printFragment = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform vec2 uResolution;
uniform float uPrint;
out vec4 outColor;

// Riso "Red" and "Federal Blue" on natural paper.
const vec3 PAPER = vec3(0.95, 0.93, 0.87);
const vec3 RED = vec3(1.0, 0.4, 0.37);
const vec3 BLUE = vec3(0.24, 0.33, 0.53);

float hash(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}

vec2 inksAt(vec2 px) {
  vec2 margin = vec2(0.07 * min(uResolution.x, uResolution.y));
  if (any(lessThan(px, margin)) || any(greaterThan(px, uResolution - margin))) return vec2(0.0);
  return texture(uScene, px / uResolution).rg;
}

// Grain-touch screening: each drum pass lays ink where the tone beats a
// clumpy random threshold, which changes with every print.
float screenInk(float tone, vec2 px, float grain, float seed) {
  vec2 g = px / grain;
  float threshold = 0.7 * hash(floor(g) + seed) + 0.3 * noise(g * 0.3 + seed);
  return step(threshold, tone * 1.08);
}

void main() {
  vec2 px = gl_FragCoord.xy;
  float unit = min(uResolution.x, uResolution.y);
  float grain = max(unit / 800.0, 1.0);
  float seed = uPrint * 17.0;

  // The blue drum lands a little shifted and skewed, differently every pull.
  vec2 centre = 0.5 * uResolution;
  float skew = (hash(vec2(uPrint, 3.0)) - 0.5) * 0.006;
  vec2 shift = (vec2(hash(vec2(uPrint, 1.0)), hash(vec2(uPrint, 2.0))) - 0.5) * unit * 0.012 + unit * vec2(0.004, -0.003);
  vec2 bluePx = centre + mat2(cos(skew), sin(skew), -sin(skew), cos(skew)) * (px - centre) + shift;

  float red = screenInk(inksAt(px).x, px, grain, seed);
  float blue = screenInk(inksAt(bluePx).y, px, grain, seed + 5.0);

  // Ink lays down unevenly: soft blotches and faint banding along the feed.
  float blotch = noise(px / unit * 6.0 + seed);
  float band = noise(vec2(px.y / unit * 40.0, seed));
  float density = 0.8 + 0.15 * blotch + 0.05 * band;

  float fibre = noise(px / unit * vec2(120.0, 900.0)) * 0.6 + noise(px / unit * 300.0) * 0.4;
  vec3 col = PAPER * (0.975 + 0.04 * fibre);
  col *= mix(vec3(1.0), RED, red * density);
  col *= mix(vec3(1.0), BLUE, blue * (density + 0.05));
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(fragment) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
  gl.bindAttribLocation(program, 0, 'position');
  gl.linkProgram(program);
  return program;
}

const scene = createProgram(sceneFragment);
const print = createProgram(printFragment);
const sceneResolution = gl.getUniformLocation(scene, 'uResolution');
const sceneYaw = gl.getUniformLocation(scene, 'uYaw');
const printResolution = gl.getUniformLocation(print, 'uResolution');
const printNumber = gl.getUniformLocation(print, 'uPrint');

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const sceneTexture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const sceneBuffer = gl.createFramebuffer();
const SCENE_SCALE = 0.35;
// Riso animation is a flipbook of separate pulls, so it runs on twos.
const PRINTS_PER_SECOND = 8;

let sceneSize = [0, 0];
function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width === w && canvas.height === h) return false;
  canvas.width = w;
  canvas.height = h;
  sceneSize = [Math.ceil(w * SCENE_SCALE), Math.ceil(h * SCENE_SCALE)];
  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, sceneSize[0], sceneSize[1], 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneBuffer);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTexture, 0);
  return true;
}

let lastPrint = -1;
function frame(ms) {
  const resized = resize();
  const printIndex = Math.floor(ms / 1000 * PRINTS_PER_SECOND);
  if (printIndex !== lastPrint || resized) {
    lastPrint = printIndex;
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneBuffer);
    gl.viewport(0, 0, sceneSize[0], sceneSize[1]);
    gl.useProgram(scene);
    gl.uniform2f(sceneResolution, sceneSize[0], sceneSize[1]);
    gl.uniform1f(sceneYaw, 0.6 + printIndex / PRINTS_PER_SECOND * 0.25);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(print);
    gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
    gl.uniform2f(printResolution, canvas.width, canvas.height);
    gl.uniform1f(printNumber, printIndex % 997);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>

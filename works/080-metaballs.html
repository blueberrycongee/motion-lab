<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaballs</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d3134; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

// The profile signed distance from MUSHROOM.md, ported to JS: y up, ground at 0,
// cap about 1.12 wide, top near 1.11. Returns [distance, part]:
// negative inside; part 0 cap, 1 gills, 2 stem, 3 ring.
function sdEllipse(x, y, rx, ry) {
  const k0 = Math.hypot(x / rx, y / ry);
  const k1 = Math.hypot(x / (rx * rx), y / (ry * ry));
  return k0 * (k0 - 1) / k1;
}

function mushroom2D(x, y) {
  x -= 0.05 * y * y;
  const r = Math.abs(x);
  const stemR = 0.085 + 0.025 * (1 - y / 0.86) + 0.065 * Math.exp(-y * 9);
  let stem = Math.max(r - stemR, Math.abs(y - 0.43) - 0.43);
  const ring = Math.max(r - 0.096 - (0.66 - y) * 0.32, Math.abs(y - 0.605) - 0.05);
  const under = 0.82 + 0.02 * (1 - Math.min(r * r / 0.3125, 1));
  const cap = Math.max(sdEllipse(x, y - 0.8, 0.56, 0.31), under - y);
  const gills = Math.max(r - 0.55, Math.max(y - under, 0.8 + 0.015 * (1 - Math.min(r * r / 0.27, 1)) - y));
  stem = Math.max(stem, -Math.min(cap, gills));
  let res = [cap, 0];
  if (gills < res[0]) res = [gills, 1];
  if (stem < res[0]) res = [stem, 2];
  if (ring < res[0]) res = [ring, 3];
  return res;
}

// Warts from the canonical Path2D, as [x, y, radius] on the cap face.
const WARTS = [
  [-0.02, 1.07, 0.03], [0.17, 1.05, 0.026], [-0.22, 1.03, 0.028], [0.33, 0.99, 0.03],
  [-0.38, 0.96, 0.024], [0.06, 0.99, 0.034], [-0.12, 0.94, 0.022], [0.22, 0.93, 0.025],
  [0.44, 0.9, 0.02], [-0.47, 0.88, 0.018], [-0.28, 0.89, 0.026], [0.1, 0.88, 0.02],
  [0.34, 0.875, 0.017], [-0.06, 0.88, 0.016],
].map(([x, y, r]) => [x + 0.032, y, r]);

const CREAM = [0.94, 0.91, 0.84];

function capTint(x, y) {
  const rim = Math.hypot((x - 0.032) / 0.56, (y - 0.8) / 0.31);
  const t = Math.min(Math.max((rim - 0.2) / 0.8, 0), 1);
  return [0.43 + 0.29 * t, 0.075 + 0.121 * t, 0.043 + 0.059 * t];
}

// Greedy packing: the deepest point not yet covered becomes the centre of a
// circle that just fits inside the silhouette, until the remaining gaps are thin.
function packCircles(maxCount, minRadius) {
  const points = [];
  for (let y = 0.005; y < 1.13; y += 0.01) {
    for (let x = -0.62; x < 0.68; x += 0.01) {
      const [d, part] = mushroom2D(x, y);
      if (d < -minRadius) points.push({ x, y, r: -d, part });
    }
  }
  const circles = [];
  while (circles.length < maxCount) {
    let best = null;
    for (const p of points) {
      if (best && p.r <= best.r) continue;
      if (!circles.some((c) => Math.hypot(p.x - c.x, p.y - c.y) < c.r * 0.8)) best = p;
    }
    if (!best) break;
    circles.push(best);
  }
  return circles;
}

const BLOBS = [
  ...packCircles(36, 0.03).map(({ x, y, r, part }) => ({
    x, y, r, wart: 0,
    tint: part === 0 ? capTint(x, y) : part === 1 ? [0.82, 0.78, 0.68] : [0.91, 0.89, 0.82],
  })),
  ...WARTS.map(([x, y, r]) => ({ x, y, r, wart: 1, tint: CREAM })),
];

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform vec3 uView;
uniform vec4 uBlobs[${BLOBS.length}];
uniform vec3 uTints[${BLOBS.length}];
uniform float uSettle;
out vec4 outColor;

float sdEllipse(vec2 p, vec2 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom in profile: y up, ground at 0, cap about 1.12 wide, top near 1.11.
// Returns signed distance (negative inside) and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom2D(vec2 p) {
  p.x -= 0.05 * p.y * p.y;
  float r = abs(p.x);
  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43);
  float ring = max(r - 0.096 - (0.66 - p.y) * 0.32, abs(p.y - 0.605) - 0.05);
  float under = 0.82 + 0.02 * (1.0 - min(r * r / 0.3125, 1.0));
  float cap = max(sdEllipse(p - vec2(0.0, 0.8), vec2(0.56, 0.31)), under - p.y);
  float gills = max(r - 0.55, max(p.y - under, 0.8 + 0.015 * (1.0 - min(r * r / 0.27, 1.0)) - p.y));
  stem = max(stem, -min(cap, gills));
  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  if (stem < res.x) res = vec2(stem, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec3 partTint(vec2 p, float part) {
  if (part == 1.0) return vec3(0.82, 0.78, 0.68) * (0.9 + 0.1 * sin(p.x * 260.0));
  if (part != 0.0) return vec3(0.91, 0.89, 0.82);
  float rim = length((p - vec2(0.032, 0.8)) / vec2(0.56, 0.31));
  return mix(vec3(0.43, 0.075, 0.043), vec3(0.72, 0.196, 0.102), smoothstep(0.2, 1.0, rim));
}

// Polynomial smooth minimum of two distances, each carried with its gradient
// (.yz) so the wax can be lit without screen-space derivatives. Nearby wax
// flows together instead of overlapping.
vec3 smin(vec3 a, vec3 b, float k) {
  float h = max(k - abs(a.x - b.x), 0.0) / k;
  vec3 near = a.x < b.x ? a : b, far = a.x < b.x ? b : a;
  return vec3(near.x - h * h * k * 0.25, mix(near.yz, far.yz, h * 0.5));
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 p = (frag - uView.xy) / uView.z;
  float pixel = 1.0 / uView.z;

  // Warm water lit from the lamp's bulb below.
  float lift = frag.y / uResolution.y;
  vec3 col = mix(vec3(0.24, 0.36, 0.35), vec3(0.08, 0.15, 0.17), smoothstep(0.0, 1.0, lift));
  col *= 1.0 - 0.35 * pow(abs(frag.x / uResolution.x - 0.5) * 2.0, 2.0);

  vec3 body = vec3(1e3, 0.0, 0.0), wart = body;
  vec3 tint = vec3(0.0);
  float weights = 0.0;
  for (int i = 0; i < ${BLOBS.length}; i++) {
    vec4 blob = uBlobs[i];
    vec2 q = p - blob.xy;
    if (blob.w > 0.5) {
      // Wart droplets become the canonical flattened ellipses as they settle.
      q.y *= mix(1.0, 1.25, uSettle);
      float d = length(q) - blob.z;
      if (d < wart.x) wart = vec3(d, normalize(q));
      continue;
    }
    vec3 d = vec3(length(q) - blob.z, normalize(q));
    // Beyond the blend radius a blob neither merges with the wax here nor tints it.
    if (d.x > 0.15) {
      if (d.x < body.x) body = d;
      continue;
    }
    body = smin(body, d, 0.12);
    float w = exp(-30.0 * d.x);
    tint += w * uTints[i];
    weights += w;
  }
  // Far from every blob there is no tint, and no wax to show it.
  tint /= weights + 1e-6;

  // As the wax settles, the blobs give way to the true outline.
  if (uSettle > 0.0) {
    vec2 shape = mushroom2D(p);
    vec2 e = vec2(0.002, 0.0);
    vec2 gradient = vec2(mushroom2D(p + e.xy).x, mushroom2D(p + e.yx).x) - shape.x;
    body = mix(body, vec3(shape.x, gradient / e.x), uSettle);
    tint = mix(tint, partTint(p, shape.y), uSettle);
  }
  tint = mix(tint, vec3(0.94, 0.91, 0.84), smoothstep(pixel, -pixel, wart.x));
  vec3 wax = smin(body, wart, 0.05);

  // A quarter-round bevel lit by the bulb below, with a gloss from the room.
  // Settled, it narrows so the seams inside the true outline stay hidden.
  float inset = clamp(-wax.x / mix(0.07, 0.035, uSettle), 0.0, 1.0);
  vec2 outward = wax.yz / max(length(wax.yz), 1e-4);
  vec3 normal = normalize(vec3(outward * (1.0 - inset), sqrt(inset * (2.0 - inset))));
  float diffuse = 0.62 + 0.38 * dot(normal, normalize(vec3(0.0, -0.6, 0.8)));
  float gloss = pow(max(dot(normal, normalize(vec3(-0.35, 0.45, 0.82))), 0.0), 36.0);
  vec3 lit = tint * diffuse * (0.85 + 0.3 * (1.0 - lift)) + 0.22 * gloss;
  col = mix(col, lit, smoothstep(pixel, -pixel, wax.x));
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.bindAttribLocation(program, 0, 'position');
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const uniform = (name) => gl.getUniformLocation(program, name);

gl.bindVertexArray(gl.createVertexArray());
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.uniform3fv(uniform('uTints'), BLOBS.flatMap((b) => b.tint));

// Each blob drifts on its own slow loop, rising and sinking more than it wanders sideways.
for (const blob of BLOBS) {
  blob.drift = {
    x: 0.06 + Math.random() * 0.1, y: 0.18 + Math.random() * 0.2,
    phaseX: Math.random() * Math.PI * 2, phaseY: Math.random() * Math.PI * 2,
    // Leaving and returning are staggered: the mushroom melts from a random
    // spot and is rebuilt from the ground up.
    leave: Math.random() * 1.5, arrive: blob.y / 1.1 * 2.5,
  };
}

// One cycle in seconds: formed, melting, drifting apart, gathering, settling.
const CYCLE = 20;
const MELT = 4.5, MELTED = 5.5, SCATTER = 5.5, GATHER = 12, SETTLE = 18;
const TRAVEL = 2.5;

const smoothstep = (a, b, v) => {
  const t = Math.min(Math.max((v - a) / (b - a), 0), 1);
  return t * t * (3 - 2 * t);
};

function blobPositions(t, bounds) {
  const u = t % CYCLE;
  return BLOBS.flatMap((blob) => {
    const { drift } = blob;
    const margin = blob.r + 0.03;
    const x = (bounds.halfWidth - margin) * Math.sin(t * drift.x + drift.phaseX);
    const y = bounds.middle + (bounds.halfHeight - margin) * Math.sin(t * drift.y + drift.phaseY);
    const gathered = u < GATHER
      ? 1 - smoothstep(SCATTER + drift.leave, SCATTER + drift.leave + TRAVEL, u)
      : smoothstep(GATHER + drift.arrive, GATHER + drift.arrive + TRAVEL + 0.5, u);
    return [x + (blob.x - x) * gathered, y + (blob.y - y) * gathered, blob.r, blob.wart];
  });
}

function settled(u) {
  return u < SETTLE ? 1 - smoothstep(MELT, MELTED, u) : smoothstep(SETTLE, CYCLE, u);
}

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  // Portrait screens are limited by the cap's width rather than the height.
  const s = Math.min(w * 0.8, h * 0.6);
  const ground = h / 2 - 0.52 * s;
  const bounds = { halfWidth: w / 2 / s, halfHeight: h / 2 / s, middle: (h / 2 - ground) / s };
  const t = ms / 1000;

  gl.viewport(0, 0, w, h);
  gl.uniform2f(uniform('uResolution'), w, h);
  gl.uniform3f(uniform('uView'), w / 2, ground, s);
  gl.uniform4fv(uniform('uBlobs'), blobPositions(t, bounds));
  gl.uniform1f(uniform('uSettle'), settled(t % CYCLE));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

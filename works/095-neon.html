<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2220; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; }
  path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .lightmap { mix-blend-mode: multiply; isolation: isolate; }
  .spill { mix-blend-mode: screen; }
</style>
</head>
<body>
<svg viewBox="-618 -1340 1300 1560" aria-hidden="true">
  <defs>
    <filter id="grain" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="9"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 -1.2 0.9"/>
    </filter>
    <filter id="far" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="near" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="core" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="street" gradientUnits="userSpaceOnUse" cx="-900" cy="-1700" r="2600">
      <stop offset="0" stop-color="#a49aa0"/>
      <stop offset="0.55" stop-color="#5e5560"/>
      <stop offset="1" stop-color="#2c2630"/>
    </radialGradient>
  </defs>
  <g class="wall"></g>
  <g class="lightmap"><rect x="-3000" y="-3000" width="6000" height="6000" fill="url(#street)"/></g>
  <g class="hardware"></g>
  <g class="tubes"></g>
  <g class="clips"></g>
</svg>

<script type="module">
const SVG = 'http://www.w3.org/2000/svg';
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CYCLE = 16000;
const OFF = 14200;                 // the power is cut and the sign goes dark
const SAMPLE = 25;                 // flicker resolution in milliseconds
const BRICK = [180, 54], MORTAR = 9;
const SPOTS = [
  [-348, -960, 24, 19], [-248, -890, 26, 21], [-188, -1030, 28, 22], [-88, -940, 22, 18], [12, -1070, 30, 24],
  [92, -990, 34, 27], [202, -1050, 26, 21], [252, -930, 25, 20], [362, -990, 30, 24], [472, -900, 20, 16],
];

let seed = 95;
function random() {
  seed = (seed * 16807) % 2147483647;
  return seed / 2147483647;
}

function draw(parent, tag, attributes = {}) {
  const element = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
  parent.append(element);
  return element;
}

function smoothstep(x) {
  const t = Math.min(Math.max(x, 0), 1);
  return t * t * (3 - 2 * t);
}

// Bricks vary in firing; the lightmap above multiplies their colour by whatever light reaches them.
function wall() {
  const group = document.querySelector('.wall');
  draw(group, 'rect', { x: -3000, y: -3000, width: 6000, height: 6000, fill: '#9a9086' });
  const [width, height] = BRICK;
  for (let row = -32; row < 6; row++) {
    const y = row * (height + MORTAR);
    const shift = row % 2 ? 0 : (width + MORTAR) / 2;
    for (let x = -1500 - shift; x < 1500; x += width + MORTAR) {
      const tone = random();
      const lightness = 46 + 14 * tone - (random() < 0.08 ? 12 : 0);
      draw(group, 'rect', {
        x, y, width, height, rx: 5,
        fill: `hsl(${12 + 10 * random()} ${38 + 16 * random()}% ${lightness}%)`,
      });
      draw(group, 'rect', { x: x + 3, y: y + height - 6, width: width - 6, height: 6, rx: 3, fill: '#000', opacity: 0.18 });
    }
  }
  draw(group, 'rect', { x: -3000, y: -3000, width: 6000, height: 6000, filter: 'url(#grain)', style: 'mix-blend-mode: multiply' });
}

// A tube is one continuous piece of glass. Lit runs glow; the runs painted black where the glass
// doubles back or jumps to an electrode stay dark. Each tube ends in an electrode boot.
const TUBES = [
  {
    name: 'cap', colour: '#ff3b26', core: '#ffe9de', spill: '#ff2a12',
    runs: [
      ['dark', 'M-498 -782 Q-506 -804 -527 -820'],
      ['lit', 'M-527 -820 A560 310 0 1 1 591 -820'],
      ['lit', 'M591 -820 Q32 -862 -470 -826'],
      ['dark', 'M-470 -826 Q-456 -808 -456 -782'],
    ],
    ends: [[-498, -782], [-456, -782]],
  },
  {
    name: 'stem', colour: '#ffd9a8', core: '#fffaf2', spill: '#ffcf96',
    runs: [
      ['dark', 'M215 36 Q200 6 175 0'],
      ['lit', 'M175 0 C130 -110 108 -300 108 -450 C108 -600 118 -720 122 -790'],
      ['dark', 'M122 -790 C126 -816 -48 -816 -48 -790'],
      ['lit', 'M-48 -790 C-55 -700 -75 -580 -90 -430 C-100 -300 -120 -120 -175 0'],
      ['dark', 'M-175 0 Q-200 6 -215 36'],
    ],
    ends: [[215, 36], [-215, 36]],
  },
  {
    name: 'ring', colour: '#ffab3d', core: '#fff1d8', spill: '#ff9a20',
    runs: [
      ['dark', 'M196 -590 Q168 -572 145 -555'],
      ['lit', 'M145 -555 Q132 -605 124 -640 Q119 -655 104 -655 L-61 -655 Q-76 -655 -80 -640 Q-95 -605 -114 -555 Q-80 -532 -45 -550 Q-10 -532 25 -548 Q60 -532 95 -548 Q122 -536 138 -546'],
      ['dark', 'M138 -546 Q170 -540 186 -520'],
    ],
    ends: [[196, -590], [186, -520]],
  },
  { name: 'warts', colour: '#ffe2cc', core: '#fffaf6', spill: '#ffd8bc', runs: wartRuns(), ends: wartEnds(), feedThrough: true },
];

// Each wart is its own short loop. Both ends dip straight back through the wall to electrodes
// hidden behind it, so no blackout glass crosses the cap.
function wartLoop([cx, cy, rx, ry]) {
  const [w, h] = [rx * 1.2, ry * 1.2];
  return { w, h, enter: [cx - w * 0.3, cy + h * 0.95], leave: [cx + w * 0.3, cy + h * 0.95] };
}

function wartRuns() {
  return SPOTS.map(wartLoop).map(({ w, h, enter, leave }) => ['lit', `M${enter.join(' ')} A${w} ${h} 0 1 1 ${leave.join(' ')}`]);
}

function wartEnds() {
  return SPOTS.map(wartLoop).flatMap(({ enter, leave }) => [enter, leave]);
}

// How bright each tube is at time t of the cycle, from 0 (off) to 1.
const POWER = {
  cap: (t) => strike(t, 1200, [[0, 0.9], [60, 0.05], [140, 0.7], [180, 0.1], [300, 1]]) * flutter(t, 8600, 80, 0.72),
  ring: (t) => strike(t, 2050, [[0, 1], [50, 0.12], [210, 0.85], [260, 1]]),
  stem: (t) => (t < 2600 ? 0 : 0.22 + 0.78 * smoothstep((t - 2600) / 3000) + (t < 5600 ? 0.06 * Math.sin(t / 37) : 0)),
  warts: (t) => strike(t, 3300, [[0, 0.8], [60, 0], [500, 0.6], [530, 0], [600, 0.9], [660, 0.2], [800, 1]]) * stutter(t, 9800, 420),
};

// A gas tube does not fade in: it catches, drops out and catches again until it holds.
function strike(t, start, steps) {
  let level = 0;
  for (const [after, value] of steps) if (t >= start + after) level = value;
  return level;
}

function flutter(t, start, length, depth) {
  return t >= start && t < start + length ? depth : 1;
}

function stutter(t, start, length) {
  if (t < start || t >= start + length) return 1;
  return Math.floor((t - start) / 45) % 2 ? 1 : 0.25;
}

// Cutting the power drops neon almost at once; the phosphor in the white tube lingers a moment.
function afterglow(name, t) {
  if (t < OFF) return 1;
  const decay = name === 'stem' ? 260 : 35;
  return Math.exp(-(t - OFF) / decay);
}

function intensityFrames(name) {
  const frames = [];
  for (let t = 0; t <= CYCLE; t += SAMPLE) {
    const level = t >= CYCLE - SAMPLE ? 0 : POWER[name](t) * afterglow(name, t);
    frames.push({ offset: t / CYCLE, opacity: Math.min(Math.max(level, 0), 1) });
  }
  return frames;
}

function pathOf(tube, kind) {
  return tube.runs.filter(([run]) => !kind || run === kind).map(([, d]) => d).join(' ');
}

function buildTube(tube) {
  const all = pathOf(tube), lit = pathOf(tube, 'lit'), dark = pathOf(tube, 'dark');
  const tubes = document.querySelector('.tubes');
  // Unlit glass: a pale tube catching a little street light.
  draw(tubes, 'path', { d: all, stroke: '#cfc6bb', 'stroke-width': 14, opacity: 0.28 });
  draw(tubes, 'path', { d: all, stroke: '#ffffff', 'stroke-width': 3, opacity: 0.25, transform: 'translate(-3 -4)' });

  const glow = draw(tubes, 'g', { opacity: calm ? 1 : 0 });
  draw(glow, 'path', { d: lit, stroke: tube.colour, 'stroke-width': 40, opacity: 0.5, filter: 'url(#halo)' });
  draw(glow, 'path', { d: lit, stroke: tube.colour, 'stroke-width': 14 });
  draw(glow, 'path', { d: lit, stroke: tube.core, 'stroke-width': 6, filter: 'url(#core)' });

  draw(tubes, 'path', { d: dark, stroke: '#1d1716', 'stroke-width': 15 });
  draw(tubes, 'path', { d: dark, stroke: '#ffffff', 'stroke-width': 2.5, opacity: 0.16, transform: 'translate(-3 -4)' });

  const spill = draw(document.querySelector('.lightmap'), 'g', { class: 'spill', opacity: calm ? 1 : 0 });
  draw(spill, 'path', { d: lit, stroke: tube.spill, 'stroke-width': 220, opacity: 0.75, filter: 'url(#far)' });
  draw(spill, 'path', { d: lit, stroke: tube.spill, 'stroke-width': 50, opacity: 0.85, filter: 'url(#near)' });

  for (const layer of [glow, spill]) {
    if (calm) layer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 2500, easing: 'ease-in-out' });
    else layer.animate(intensityFrames(tube.name), { duration: CYCLE, iterations: Infinity });
  }
}

function pointAndAngle(path, distance) {
  const { x, y } = path.getPointAtLength(distance);
  const ahead = path.getPointAtLength(distance + 1);
  return [x, y, Math.atan2(ahead.y - y, ahead.x - x) * 180 / Math.PI];
}

// Glass standoffs hold the tube off the wall; a wire tie wraps the tube over each one.
function supports(tube) {
  const hardware = document.querySelector('.hardware'), clips = document.querySelector('.clips');
  for (const [, d] of tube.runs.filter(([run]) => run === 'lit')) {
    const path = draw(hardware, 'path', { d, stroke: 'none' });
    const length = path.getTotalLength(), count = Math.floor(length / 320);
    for (let k = 0; k < count; k++) {
      const [x, y, angle] = pointAndAngle(path, (k + 0.5) * length / count);
      draw(hardware, 'ellipse', { cx: x + 8, cy: y + 14, rx: 13, ry: 11, fill: '#000', opacity: 0.55, filter: 'url(#shadow)' });
      draw(hardware, 'circle', { cx: x, cy: y + 5, r: 10, fill: '#4a4542' });
      draw(hardware, 'circle', { cx: x - 3, cy: y + 2, r: 3.5, fill: '#a39a92', opacity: 0.6 });
      const tie = draw(clips, 'g', { transform: `translate(${x} ${y}) rotate(${angle})` });
      draw(tie, 'path', { d: 'M-4 -11 L-4 11 M4 -11 L4 11', stroke: '#2b2522', 'stroke-width': 3.5 });
    }
    path.remove();
  }
}

// Electrode housings where the glass turns into the wall; the wart loops only need a small
// grommet where they pass through it.
function boots(tube) {
  const hardware = document.querySelector('.hardware');
  const radius = tube.feedThrough ? 7 : 17;
  for (const [x, y] of tube.ends) {
    draw(hardware, 'circle', { cx: x + 6, cy: y + 10, r: radius + 3, fill: '#000', opacity: 0.6, filter: 'url(#shadow)' });
    draw(hardware, 'circle', { cx: x, cy: y, r: radius, fill: '#1a1615' });
    if (!tube.feedThrough) draw(hardware, 'path', { d: `M${x - 9} ${y - 6} A11 11 0 0 1 ${x + 4} ${y - 11}`, stroke: '#6b625c', 'stroke-width': 3 });
  }
}

// The stem's two electrodes are wired down to the transformer bolted under the sign.
function transformer() {
  const hardware = document.querySelector('.hardware');
  const cables = 'M215 36 C230 80 280 70 300 96 M-215 36 C-200 130 160 150 300 132';
  draw(hardware, 'path', { d: cables, stroke: '#000', 'stroke-width': 10, opacity: 0.5, filter: 'url(#shadow)', transform: 'translate(6 10)' });
  draw(hardware, 'path', { d: cables, stroke: '#1f1b1a', 'stroke-width': 7 });
  draw(hardware, 'path', { d: cables, stroke: '#7a716a', 'stroke-width': 1.5, opacity: 0.6, transform: 'translate(-1.5 -2)' });
  draw(hardware, 'rect', { x: 306, y: 84, width: 220, height: 104, rx: 6, fill: '#000', opacity: 0.6, filter: 'url(#shadow)' });
  draw(hardware, 'rect', { x: 296, y: 70, width: 220, height: 104, rx: 6, fill: '#3b3c3a' });
  draw(hardware, 'rect', { x: 296, y: 70, width: 220, height: 10, rx: 4, fill: '#6f716d' });
  for (const x of [312, 500]) for (const y of [92, 158]) draw(hardware, 'circle', { cx: x, cy: y, r: 4, fill: '#8d8f8a' });
}

wall();
for (const tube of TUBES) {
  supports(tube);
  boots(tube);
}
transformer();
for (const tube of TUBES) buildTube(tube);
</script>
</body>
</html>

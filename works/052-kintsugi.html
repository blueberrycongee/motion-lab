<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kintsugi</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a241f; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 WINDOW = vec3(-0.85, 0.55, 0.25);    // a shoji screen to the left
const vec3 BOUNDS_CENTER = vec3(0.0, 0.56, 0.0);
const float BOUNDS_RADIUS = 0.76;
const vec3 GOLD = vec3(1.0, 0.77, 0.34);           // reflectance of gold at normal incidence

float spin;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x),
                 mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
                 mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// Distance to the nearest wart centre on a jittered 3D grid, in grid cells.
float wartDistance(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return d;
}

vec3 local(vec3 p) {
  float c = cos(spin), s = sin(spin);
  p.xz = mat2(c, -s, s, c) * p.xz;
  return p;
}

// Upright coordinates centred on the cap, with the stem's lean removed.
vec3 capSpace(vec3 q) {
  return vec3(q.x - 0.05 * q.y * q.y, q.y - 0.8, q.z);
}

// Warts are low beads of glaze on the cap.
vec2 map(vec3 p) {
  vec3 q = local(p);
  vec2 m = mushroom(q);
  if (m.y < 0.5 && m.x < 0.03) {
    vec3 c = capSpace(q);
    m.x -= 0.007 * smoothstep(0.26, 0.1, wartDistance(c)) * smoothstep(0.0, 0.12, c.y);
  }
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

vec2 march(vec3 ro, vec3 rd) {
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float h = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (h < 0.0) return vec2(-1.0);
  float t = max(-b - sqrt(h), 0.0), tFar = -b + sqrt(h);
  for (int i = 0; i < 96; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0004) return vec2(t, m.y);
    t += m.x;
    if (t > tFar) break;
  }
  return vec2(-1.0);
}

float shadow(vec3 p, vec3 l) {
  float t = 0.02, light = 1.0;
  for (int i = 0; i < 40; i++) {
    float d = map(p + l * t).x;
    light = min(light, 6.0 * d / t);
    if (light < 0.01) break;
    t += clamp(d, 0.01, 0.15);
    if (t > 2.5) break;
  }
  return clamp(light, 0.0, 1.0);
}

float occlusion(vec3 p, vec3 n) {
  float o = 0.0;
  for (int i = 1; i <= 4; i++) {
    float h = 0.04 * float(i);
    o += (h - map(p + n * h).x) / float(i);
  }
  return clamp(1.0 - 2.0 * o, 0.0, 1.0);
}

// Distance to the nearest crack, in grid cells, and the direction across it. Cracks are the
// borders of a 3D Voronoi tessellation, so like real fractures they wander and close into shards.
vec4 crack(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  vec3 nearest, cell;
  float best = 8.0;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 r = o + 0.1 + 0.8 * vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7)) - f;
    float d = dot(r, r);
    if (d < best) { best = d; nearest = r; cell = o; }
  }
  float border = 8.0;
  vec3 across = vec3(0.0);
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = cell + vec3(x, y, z);
    vec3 r = o + 0.1 + 0.8 * vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7)) - f;
    vec3 toward = r - nearest;
    if (dot(toward, toward) < 1e-5) continue;
    float d = dot(0.5 * (nearest + r), normalize(toward));    // distance to the bisecting plane
    if (d < border) { border = d; across = normalize(toward); }
  }
  return vec4(border, across);
}

// The gold seam: coverage and a normal bent across its rounded, slightly raised bead.
vec4 seam(vec3 q, vec3 n) {
  vec3 bent = q + 0.1 * (vec3(noise(q * 4.0), noise(q * 4.0 + 5.0), noise(q * 4.0 + 9.0)) - 0.5);
  vec4 major = crack(bent * 3.2);
  vec4 minor = crack(bent * 7.0 + 3.0);
  float wander = noise(q * 9.0);
  float wMajor = 0.0065 * (0.6 + 0.8 * wander);
  float wMinor = 0.004 * smoothstep(0.55, 0.75, noise(q * 3.0 + 11.0));   // hairlines that taper out
  // Distance from each seam's centre line relative to its half-width: below 1 is gold.
  float toMajor = major.x / 3.2 / wMajor;
  float toMinor = wMinor > 0.0015 ? minor.x / 7.0 / wMinor : 8.0;
  vec4 c = toMajor < toMinor ? vec4(toMajor, major.yzw) : vec4(toMinor, minor.yzw);
  float cover = smoothstep(1.0, 0.8, c.x);
  vec3 tangent = normalize(c.yzw - n * dot(c.yzw, n));
  return vec4(cover, normalize(n - tangent * c.x * 1.3));
}

// The room seen in the glaze: a glowing shoji screen in a dim wood-panelled room.
vec3 room(vec3 rd) {
  vec3 col = mix(vec3(0.05, 0.035, 0.025), vec3(0.2, 0.17, 0.14), smoothstep(-0.15, 0.6, rd.y));
  vec3 w = normalize(WINDOW);
  vec3 wu = normalize(cross(w, vec3(0, 1, 0))), wv = cross(wu, w);
  float facing = dot(rd, w);
  if (facing > 0.0) {
    vec2 s = vec2(dot(rd, wu), dot(rd, wv)) / facing;
    vec2 lattice = abs(fract(s * vec2(5.0, 4.0)) - 0.5);
    float paper = step(abs(s.x), 0.5) * step(abs(s.y), 0.65) * step(0.07, min(lattice.x, lattice.y));
    col += vec3(6.0, 5.6, 5.0) * paper;
  }
  return col + vec3(0.5, 0.4, 0.3) * pow(max(dot(rd, normalize(vec3(0.9, 0.4, 0.8))), 0.0), 40.0);
}

vec3 shadePorcelain(vec3 p, vec3 rd, float part) {
  vec3 q = local(p);
  vec3 n = normalAt(p);
  vec3 l = normalize(WINDOW);
  float light = max(dot(n, l) + 0.2, 0.0) / 1.2 * shadow(p + n * 0.003, l);
  float ao = occlusion(p, n);

  // Unglazed bisque on the warts, glossy glaze everywhere else.
  float bisque = part < 0.5 ? smoothstep(0.2, 0.12, wartDistance(capSpace(q))) * step(0.0, capSpace(q).y) : 0.0;
  vec3 white = mix(vec3(0.86, 0.87, 0.86), vec3(0.84, 0.8, 0.72), bisque);
  vec3 col = white * (vec3(1.5, 1.42, 1.3) * light + vec3(0.16, 0.15, 0.14) * (0.5 + 0.5 * n.y) * ao);
  float fresnel = 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  col += room(reflect(rd, n)) * fresnel * (1.0 - bisque) * ao;

  vec4 gold = seam(q, n);
  vec3 g = gold.yzw;
  vec3 r = reflect(rd, g);
  vec3 metal = GOLD + (1.0 - GOLD) * pow(1.0 - max(dot(-rd, g), 0.0), 5.0);
  vec3 glint = vec3(4.0, 3.6, 3.0) * pow(max(dot(r, l), 0.0), 60.0) * shadow(p + n * 0.003, l);
  vec3 golden = metal * (room(r) * mix(0.4, 1.0, ao) + glint + 0.12 * light);
  return mix(col, golden, gold.x);
}

void main() {
  spin = uTime * 0.16;

  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 ro = vec3(0.9, 1.45, 3.3);
  vec3 target = vec3(0.0, 0.52, 0.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.9 * fw);
  vec3 l = normalize(WINDOW);

  // A dim plaster wall lit from the left, over a dark walnut board.
  vec3 col = vec3(0.07, 0.06, 0.05) * (0.7 + 0.6 * smoothstep(0.6, -0.8, uv.x));
  if (rd.y < 0.0) {
    vec3 p = ro + rd * (-ro.y / rd.y);
    float grain = noise(vec3(p.z * 60.0 + 4.0 * noise(p * 3.0), p.x * 1.5, 0.0));
    vec3 walnut = mix(vec3(0.04, 0.024, 0.014), vec3(0.06, 0.036, 0.021), grain);
    float fresnel = 0.03 + 0.5 * pow(1.0 + rd.y, 8.0);
    vec3 lit = walnut * (vec3(1.6, 1.5, 1.35) * l.y * shadow(p, l) + 0.15) + room(reflect(rd, vec3(0, 1, 0))) * fresnel * 0.4;
    col = mix(lit, col, smoothstep(2.0, 5.0, length(p.xz)));
  }
  vec2 hit = march(ro, rd);
  if (hit.x > 0.0) col = shadePorcelain(ro + rd * hit.x, rd, hit.y);

  col *= 1.0 - 0.35 * dot(uv, uv);
  col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);   // ACES filmic curve
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.008;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

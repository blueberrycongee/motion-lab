<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitch</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8e9581; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const SCENE_SCALE = 0.4;
// Bursts are decided per slot of this many seconds.
const BURST_SLOT = 0.2;
// Every cycle the stream loses its keyframes for a while and the picture moshes.
const MOSH_CYCLE = 7;
const MOSH_START = 3;
const MOSH_END = 6.2;
// Mosh steps advance at a video frame rate, at most one per rendered frame.
const CODEC_FPS = 30;

const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// Pass 1: a clean studio shot of the mushroom on a sage sweep.
const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uYaw;
out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (p.y < m.x) m = vec2(p.y, 4.0);
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.15);
    if (res < 0.002 || t > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 material(vec3 p, vec3 n, float part) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.43, 0.07, 0.04), vec3(0.72, 0.2, 0.1), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.94, 0.91, 0.84), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) return vec3(0.82, 0.78, 0.68) * (0.75 + 0.25 * cos(atan(q.z, q.x) * 70.0));
  return mix(vec3(0.78, 0.75, 0.68), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

vec3 backdrop(vec2 uv) {
  return mix(vec3(0.5, 0.54, 0.44), vec3(0.72, 0.75, 0.66), smoothstep(-0.35, 0.55, uv.y));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 target = vec3(0.0, 0.55, 0.0);
  vec3 ro = target + vec3(sin(uYaw), 0.22, cos(uYaw)) * 3.4;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.0 * fw);

  vec3 col = backdrop(uv);
  float t = 0.0;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 90; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.001 * t) { hit = vec2(t, m.y); break; }
    t += m.x;
    if (t > 7.0) break;
  }

  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    // The mushroom turns under a light that stays put, upper left of the viewer.
    vec3 key = normalize(-0.8 * rt + vec3(0.0, 0.55, 0.0) + 0.3 * vec3(sin(uYaw), 0.0, cos(uYaw)));
    float shadow = softShadow(p + n * 0.003, key);
    if (hit.y > 3.5) {
      // The floor dissolves into the sweep; only the cast shadow remains.
      col *= mix(0.6 + 0.4 * shadow, 1.0, smoothstep(0.2, 1.6, length(p.xz)));
    } else {
      vec3 albedo = material(p, n, hit.y);
      float diff = max(dot(n, key), 0.0) * shadow;
      float fill = 0.5 + 0.5 * n.y;
      float bounce = clamp(0.6 - 0.4 * n.y, 0.0, 1.0);
      col = albedo * (vec3(1.05, 1.0, 0.92) * diff * 1.1 + vec3(0.6, 0.68, 0.66) * fill * 0.85
                      + vec3(0.7, 0.72, 0.6) * bounce * 0.7);
    }
  }
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

// Pass 2: the codec. Normally every frame is a keyframe. While moshing, each
// macroblock drags the stale picture along its own motion vector, and
// only the odd intra-coded block snaps back to the real image.
const moshFragment = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uPrevious;
uniform float uBlock;
uniform float uMosh;
uniform float uStep;
out vec4 outColor;

float hash(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}

void main() {
  ivec2 px = ivec2(gl_FragCoord.xy);
  vec3 fresh = texelFetch(uScene, px, 0).rgb;
  if (uMosh < 0.5) {
    outColor = vec4(fresh, 1.0);
    return;
  }
  // Vectors vary smoothly between blocks, so the picture flows rather than shatters.
  vec2 block = floor(gl_FragCoord.xy / uBlock);
  float angle = noise(block * 0.25 + uStep * 0.01) * 12.566;
  vec2 motion = vec2(cos(angle), sin(angle)) * (0.3 + 1.0 * hash(block + 7.0)) * uBlock / 16.0;
  ivec2 from = clamp(px - ivec2(round(motion)), ivec2(0), textureSize(uPrevious, 0) - 1);
  vec3 stale = texelFetch(uPrevious, from, 0).rgb;
  float intra = step(0.985, hash(block + uStep * 1.37));
  outColor = vec4(mix(stale, fresh, intra), 1.0);
}`;

// Pass 3: transmission damage on top of the decoded picture: torn bands,
// misplaced and coarsely quantised blocks, and channels out of alignment.
const displayFragment = `#version 300 es
precision highp float;
uniform sampler2D uImage;
uniform vec2 uResolution;
uniform float uBlock;
uniform float uBurst;
uniform float uSeed;
out vec4 outColor;

float hash(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;
  float band = floor(uv.y * 30.0);
  float torn = step(1.0 - 0.3 * uBurst, hash(vec2(band, uSeed)));
  uv.x += torn * (hash(vec2(band, uSeed + 1.0)) - 0.5) * 0.15;

  vec2 cell = floor(uv * vec2(9.0, 7.0));
  if (hash(cell + uSeed * 1.7) > 1.0 - 0.14 * uBurst) {
    uv += (vec2(hash(cell + uSeed + 2.3), hash(cell + uSeed + 5.1)) - 0.5) * 0.25;
  }
  float split = (0.0012 + 0.012 * uBurst) * min(uResolution.x, uResolution.y) / uResolution.x;
  if (hash(cell + uSeed + 9.0) > 1.0 - 0.18 * uBurst) {
    // A starved block decodes as flat squares, its channels still aligned.
    vec2 size = vec2(textureSize(uImage, 0)) / (0.5 * uBlock);
    uv = (floor(uv * size) + 0.5) / size;
    split = 0.0;
  }

  vec3 col = vec3(texture(uImage, uv + vec2(split, 0.0)).r,
                  texture(uImage, uv).g,
                  texture(uImage, uv - vec2(split, 0.0)).b);
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(fragment) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
  gl.bindAttribLocation(program, 0, 'position');
  gl.linkProgram(program);
  const uniforms = {};
  for (let i = 0; i < gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); i++) {
    const { name } = gl.getActiveUniform(program, i);
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return { program, uniforms };
}

const scene = createProgram(sceneFragment);
const mosh = createProgram(moshFragment);
const display = createProgram(displayFragment);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function createTarget() {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return { texture, framebuffer: gl.createFramebuffer() };
}

const sceneTarget = createTarget();
const moshTargets = [createTarget(), createTarget()];

let sceneSize = [0, 0];
let macroblock = 16;
function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w;
  canvas.height = h;
  sceneSize = [Math.ceil(w * SCENE_SCALE), Math.ceil(h * SCENE_SCALE)];
  // Macroblocks keep their size relative to the picture, as at any video resolution.
  macroblock = Math.max(4, Math.round(Math.min(...sceneSize) / 22));
  for (const { texture, framebuffer } of [sceneTarget, ...moshTargets]) {
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, sceneSize[0], sceneSize[1], 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  }
}

function hash(n) {
  const s = Math.sin(n * 127.1) * 43758.5453;
  return s - Math.floor(s);
}

// The signal is never quite clean; a few slots carry a burst, more of them while moshing.
function burstAt(slot, moshing) {
  const threshold = moshing ? 0.55 : 0.75;
  const h = hash(slot);
  return h < threshold ? 0.12 : 0.35 + 0.65 * (h - threshold) / (1 - threshold);
}

function drawInto(target, size) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.framebuffer : null);
  gl.viewport(0, 0, size[0], size[1]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let current = 0;
let lastStep = -1;
function frame(ms) {
  resize();
  const seconds = ms / 1000;
  const cycle = seconds % MOSH_CYCLE;
  const moshing = cycle > MOSH_START && cycle < MOSH_END;
  const slot = Math.floor(seconds / BURST_SLOT);

  gl.useProgram(scene.program);
  gl.uniform2f(scene.uniforms.uResolution, sceneSize[0], sceneSize[1]);
  gl.uniform1f(scene.uniforms.uYaw, 0.6 + seconds * 0.3);
  drawInto(sceneTarget, sceneSize);

  const step = Math.floor(seconds * CODEC_FPS);
  if (step !== lastStep) {
    lastStep = step;
    const previous = moshTargets[current];
    current = 1 - current;
    gl.useProgram(mosh.program);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTarget.texture);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, previous.texture);
    gl.uniform1i(mosh.uniforms.uScene, 0);
    gl.uniform1i(mosh.uniforms.uPrevious, 1);
    gl.uniform1f(mosh.uniforms.uBlock, macroblock);
    gl.uniform1f(mosh.uniforms.uMosh, moshing ? 1 : 0);
    gl.uniform1f(mosh.uniforms.uStep, step % 10007);
    drawInto(moshTargets[current], sceneSize);
  }

  gl.useProgram(display.program);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, moshTargets[current].texture);
  gl.uniform1i(display.uniforms.uImage, 0);
  gl.uniform2f(display.uniforms.uResolution, canvas.width, canvas.height);
  gl.uniform1f(display.uniforms.uBlock, macroblock);
  gl.uniform1f(display.uniforms.uBurst, burstAt(slot, moshing));
  gl.uniform1f(display.uniforms.uSeed, slot % 997);
  drawInto(null, [canvas.width, canvas.height]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape Text</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(100% 80% at 50% 45%, #221d18, #15120f 70%); }
  .word, .probe {
    position: absolute; left: 0; top: 0; white-space: pre;
    font-family: ui-serif, Georgia, 'Times New Roman', serif; line-height: 1;
  }
  .word { font-size: var(--size); transform-origin: 0 0; will-change: transform; }
  .probe { font-size: 100px; visibility: hidden; }
</style>
</head>
<body>
<span class="probe"></span>
<script type="module">
const TEXT = 'The fly agaric, Amanita muscaria, rises through the moss of birch and pine woods in late summer '
  + 'and autumn. It begins as a white egg wrapped in a universal veil; as the cap swells and opens, the veil '
  + 'tears into the pale warts scattered over its scarlet skin, warts that a hard rain can wash away. Beneath '
  + 'the cap the gills are free and crowded, white to cream, and they drop a white spore print. A soft skirt, '
  + 'the remains of a partial veil, hangs from the upper stem, and the base swells into a bulb ringed with the '
  + 'scaly edge of the volva. Its roots are not its own: its hyphae sheath the fine roots of the trees, trading '
  + 'water and minerals for sugar, so the mushroom is only the brief fruit of a mycelium that may run through '
  + 'the whole wood. The name recalls an old use, the cap crumbled into a saucer of milk to stun flies. It is '
  + 'poisonous, and it has kept its place in folklore, picture books and winter cards for centuries. ';
const LINE = 0.0225;           // line pitch in mushroom units
const SIZE = 0.0215;            // type size in mushroom units
const BREATH = 5.5;            // seconds per breath
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

// The canonical profile, sampled in mushroom units: y up, ground at 0, cap about 1.12 wide.
const SPOTS = [
  [-0.02, 1.07, 0.03], [0.17, 1.05, 0.026], [-0.22, 1.03, 0.028], [0.33, 0.99, 0.03],
  [-0.38, 0.96, 0.024], [0.06, 0.99, 0.034], [-0.12, 0.94, 0.022], [0.22, 0.93, 0.025],
  [0.44, 0.9, 0.02], [-0.47, 0.88, 0.018], [-0.28, 0.89, 0.026], [0.1, 0.88, 0.02],
  [0.34, 0.875, 0.017], [-0.06, 0.88, 0.016],
];

function ellipse(px, py, rx, ry) {
  const k0 = Math.hypot(px / rx, py / ry);
  const k1 = Math.hypot(px / (rx * rx), py / (ry * ry));
  return k0 * (k0 - 1) / k1;
}

function partAt(x0, y) {
  const x = x0 - 0.05 * y * y;
  const r = Math.abs(x);
  const under = 0.82 + 0.02 * (1 - Math.min(r * r / 0.3125, 1));
  if (Math.max(ellipse(x, y - 0.8, 0.56, 0.31), under - y) < 0) {
    const onSpot = SPOTS.some(([sx, sy, sr]) => ((x0 - 0.032 - sx) / sr) ** 2 + ((y - sy) / (sr * 0.8)) ** 2 < 2);
    return onSpot ? 'spot' : 'cap';
  }
  const gillTop = 0.8 + 0.015 * (1 - Math.min(r * r / 0.27, 1));
  if (Math.max(r - 0.55, y - under, gillTop - y) < 0) return 'gills';
  if (Math.max(r - 0.096 - (0.66 - y) * 0.32, Math.abs(y - 0.605) - 0.05) < 0) return 'ring';
  const stemR = 0.085 + 0.025 * (1 - y / 0.86) + 0.065 * Math.exp(-y * 9);
  if (Math.max(r - stemR, Math.abs(y - 0.43) - 0.43) < 0) return 'stem';
  return null;
}

function mix(a, b, t) {
  const ca = a.match(/\w\w/g).map((h) => parseInt(h, 16));
  const cb = b.match(/\w\w/g).map((h) => parseInt(h, 16));
  return `rgb(${ca.map((c, i) => Math.round(c + (cb[i] - c) * t)).join()})`;
}

// Seen from the side, the cap's distance from the stem axis depends only on height,
// so the crown darkens towards the top as it does on the 3D specimen.
function colorOf(part, y) {
  if (part === 'cap') {
    const axis = 0.56 * Math.sqrt(Math.max(0, 1 - ((y - 0.8) / 0.31) ** 2));
    return mix('8a1a0e', 'c8401f', Math.min(1, Math.max(0, (axis - 0.12) / 0.4)));
  }
  return { spot: '#f4ecdb', gills: '#c9bc9f', ring: '#d8cfbb', stem: '#e8e2d2' }[part];
}

// Advance widths in em, measured once from the browser's own layout of the system serif.
const probe = document.querySelector('.probe');
const advance = new Map();
function widthOf(text) {
  if (!advance.has(text)) {
    probe.textContent = text;
    advance.set(text, probe.getBoundingClientRect().width / 100);
  }
  return advance.get(text);
}

// Each line is the run of the silhouette at its height, found by scanning across it.
function runAt(y) {
  let left = null, right = null;
  for (let x = -0.62; x <= 0.68; x += 0.003) {
    if (partAt(x, y)) {
      left ??= x;
      right = x;
    }
  }
  return left === null ? null : { left, width: right - left };
}

// Fill a run with text, breaking at the last space when one is near the end.
let cursor = 0;
function takeLine(width) {
  while (TEXT[cursor % TEXT.length] === ' ') cursor++;
  let used = 0, end = cursor;
  while (used + widthOf(TEXT[end % TEXT.length]) * SIZE <= width) used += widthOf(TEXT[end++ % TEXT.length]) * SIZE;
  let text = '';
  for (let i = cursor; i < end; i++) text += TEXT[i % TEXT.length];
  const space = text.lastIndexOf(' ');
  if (space > text.length * 0.6) text = text.slice(0, space);
  cursor += text.length;
  return text.trim();
}

// A word is one element; letters that fall on a wart or a different part get their own colour.
function makeWord(text, y, left, stretch) {
  const el = document.createElement('span');
  el.className = 'word';
  const scaleToWord = widthOf(text) / [...text].reduce((sum, char) => sum + widthOf(char), 0);
  let x = left;
  for (const char of text) {
    const width = widthOf(char) * scaleToWord * SIZE * stretch;
    const color = colorOf(partAt(x + width / 2, y) ?? 'stem', y);
    if (el.lastChild?.dataset.color !== color) {
      el.append(Object.assign(document.createElement('span'), { style: `color: ${color}` }));
      el.lastChild.dataset.color = color;
    }
    el.lastChild.textContent += char;
    x += width;
  }
  document.body.append(el);
  return { el, width: widthOf(text) };
}

const SPACE = widthOf('\u00a0');
const lines = [];
for (let y = 1.11 - LINE * 0.5; y > 0; y -= LINE) {
  const run = runAt(y);
  if (!run) continue;
  const texts = takeLine(run.width).split(' ');
  const natural = texts.reduce((sum, text) => sum + widthOf(text), 0) + SPACE * (texts.length - 1);
  const stretch = run.width / (natural * SIZE);
  let x = run.left;
  const words = texts.map((text) => {
    const word = makeWord(text, y, x, stretch);
    x += (word.width + SPACE) * SIZE * stretch;
    return word;
  });
  lines.push({ y, ...run, words });
}

let scale, groundX, groundY;
function resize() {
  scale = Math.min(innerHeight * 0.7 / 1.11, innerWidth * 0.84 / 1.12);
  groundX = innerWidth / 2 - 0.05 * scale;
  groundY = innerHeight / 2 + 0.57 * scale;
  document.body.style.setProperty('--size', `${SIZE * scale}px`);
}
addEventListener('resize', resize);
resize();

// A breath runs down from the crown to the bulb: where it passes, the type swells wide
// and heavy; behind it, it draws in narrow and light. Each line is re-justified so its
// words always fill the silhouette exactly.
function frame(ms) {
  const t = ms / 1000 * (calm ? 0.4 : 1);
  const depth = calm ? 0.35 : 0.5 - 0.5 * Math.cos(2 * Math.PI * t / BREATH);
  for (const line of lines) {
    const count = line.words.length;
    const swell = line.words.map((word, i) => {
      const along = count > 1 ? i / (count - 1) : 0.5;
      const wave = Math.sin((1.11 - line.y) * 7 + along * 2.2 - t * 2.1) * 0.6
        + Math.sin(along * 7 - t * 1.3 + line.y * 4) * 0.4;
      return wave * (0.06 + 0.22 * depth);
    });
    const natural = line.words.reduce((sum, word, i) => sum + word.width * (1 + swell[i]), 0) + SPACE * (count - 1);
    const fit = line.width / (natural * SIZE);
    const top = groundY - (line.y + SIZE * 0.4) * scale;
    let x = line.left;
    line.words.forEach((word, i) => {
      const stretch = (1 + swell[i]) * fit;
      word.el.style.transform = `translate(${(groundX + x * scale).toFixed(1)}px, ${top.toFixed(1)}px) scaleX(${stretch.toFixed(3)})`;
      word.el.style.webkitTextStroke = `${(0.012 + Math.max(0, swell[i]) * 0.14).toFixed(3)}em currentColor`;
      x += (word.width * (1 + swell[i]) + SPACE) * SIZE * fit;
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

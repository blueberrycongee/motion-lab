<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specimen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9b4a8; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
uniform float uYaw;
out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (p.y < m.x) m = vec2(p.y, 4.0);             // the floor
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 48; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.15);
    if (res < 0.002 || t > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float occlusion(vec3 p, vec3 n) {
  float o = 0.0, w = 1.0;
  for (int i = 1; i <= 5; i++) {
    float h = 0.02 + 0.06 * float(i);
    o += (h - map(p + n * h).x) * w;
    w *= 0.7;
  }
  return clamp(1.0 - 2.2 * o, 0.0, 1.0);
}

// Cream warts scattered over the cap, nearest feature point on a jittered 3D grid.
float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 material(vec3 p, vec3 n, float part) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.42, 0.06, 0.035), vec3(0.70, 0.22, 0.06), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.86, 0.82, 0.72), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) {
    float lamella = 0.5 + 0.5 * cos(atan(q.z, q.x) * 70.0);
    return vec3(0.82, 0.77, 0.66) * (0.7 + 0.3 * lamella);
  }
  if (part < 3.5) {
    float scales = 0.5 + 0.5 * sin(q.y * 90.0 + sin(atan(q.z, q.x) * 5.0) * 2.0);
    vec3 stem = mix(vec3(0.72, 0.68, 0.6), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
    return stem * (1.0 - 0.06 * scales * smoothstep(0.5, 0.1, q.y));
  }
  return vec3(0.55, 0.53, 0.48);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
  float yaw = uYaw;
  vec3 target = vec3(0.0, 0.54, 0.0);
  vec3 ro = target + vec3(sin(yaw), 0.26, cos(yaw)) * 3.6;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.0 * fw);

  // Seamless studio paper: lighter where the key light lands.
  vec3 paper = vec3(0.56, 0.54, 0.49);
  vec3 col = paper * (0.9 + 0.25 * uv.y) * (1.0 - 0.25 * dot(uv, uv));

  float t = 0.0;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 120; i++) {
    vec3 p = ro + rd * t;
    vec2 m = map(p);
    if (m.x < 0.0006 * t) { hit = vec2(t, m.y); break; }
    t += m.x;
    if (t > 8.0) break;
  }

  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    vec3 key = normalize(vec3(-0.75, 0.45, 0.6));
    float shadow = softShadow(p + n * 0.003, key);
    float ao = occlusion(p, n);
    vec3 albedo = material(p, n, hit.y);

    float diff = max(dot(n, key), 0.0) * shadow;
    float fill = 0.5 + 0.5 * n.y;
    float back = pow(clamp(1.0 + dot(rd, n), 0.0, 1.0), 3.0);
    vec3 h = normalize(key - rd);
    float spec = pow(max(dot(n, h), 0.0), 24.0) * shadow * (hit.y < 0.5 ? 0.18 : 0.05);

    float bounce = clamp(-n.y, 0.0, 1.0) * 0.5 + clamp(0.5 - n.y * 0.5, 0.0, 1.0) * 0.25;
    vec3 lit = albedo * (vec3(1.05, 0.98, 0.9) * diff * 1.25 + vec3(0.55, 0.58, 0.62) * fill * 0.7 * ao
                       + vec3(0.6, 0.55, 0.47) * bounce * ao);
    lit += albedo * back * 0.25 * ao + spec;
    // Light scattered through the thin cap rim reads as a warm glow.
    if (hit.y < 0.5) lit += vec3(0.5, 0.12, 0.03) * pow(max(dot(rd, key), 0.0), 2.0) * 0.4 * smoothstep(0.4, 0.56, length(p.xz));
    if (hit.y > 3.5) {
      float fade = smoothstep(0.0, 2.5, length(p.xz));
      lit = mix(col * (0.55 + 0.45 * shadow) * (0.6 + 0.4 * ao), col, fade);
    }
    col = lit;
  }

  col = pow(col, vec3(0.92));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.012;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');
const uYaw = gl.getUniformLocation(program, 'uYaw');

// A slow turntable; dragging spins it and it drifts back to its own pace.
let yaw = 0.6, spin = 0.12, dragX = null;
canvas.addEventListener('pointerdown', (event) => {
  canvas.setPointerCapture(event.pointerId);
  dragX = event.clientX;
});
canvas.addEventListener('pointermove', (event) => {
  if (dragX === null) return;
  spin = (event.clientX - dragX) * 0.6;
  yaw += (event.clientX - dragX) * 0.01;
  dragX = event.clientX;
});
canvas.addEventListener('pointerup', () => { dragX = null; });

let last = performance.now();
function frame(ms) {
  const dt = Math.min((ms - last) / 1000, 0.1);
  last = ms;
  if (dragX === null) {
    spin += (0.12 - spin) * Math.min(dt * 1.5, 1);
    yaw += spin * dt;
  }
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.uniform1f(uYaw, yaw);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

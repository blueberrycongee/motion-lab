<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Rain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3a4048; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// The garden at dusk seen through wet glass. The scene is out of focus behind
// the glass; each drop is a small lens that shows it sharp and inverted.
const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
uniform sampler2D uWater;
out vec4 outColor;

const float SCALE = 0.62;
const float GROUND = -0.36;
const vec3 LAMP = vec3(1.0, 0.72, 0.45);

float sdEllipse(vec2 p, vec2 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

vec2 mushroom2D(vec2 p) {
  p.x -= 0.05 * p.y * p.y;
  float r = abs(p.x);
  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43);
  float ring = max(r - 0.096 - (0.66 - p.y) * 0.32, abs(p.y - 0.605) - 0.05);
  float under = 0.82 + 0.02 * (1.0 - min(r * r / 0.3125, 1.0));
  float cap = max(sdEllipse(p - vec2(0.0, 0.8), vec2(0.56, 0.31)), under - p.y);
  float gills = max(r - 0.55, max(p.y - under, 0.8 + 0.015 * (1.0 - min(r * r / 0.27, 1.0)) - p.y));
  stem = max(stem, -min(cap, gills));
  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  if (stem < res.x) res = vec2(stem, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// Warts on the visible face of the cap: centre and radius, in mushroom units.
const vec3 WARTS[14] = vec3[14](
  vec3(0.012, 1.07, 0.03), vec3(0.202, 1.05, 0.026), vec3(-0.188, 1.03, 0.028), vec3(0.362, 0.99, 0.03),
  vec3(-0.348, 0.96, 0.024), vec3(0.092, 0.99, 0.034), vec3(-0.088, 0.94, 0.022), vec3(0.252, 0.93, 0.025),
  vec3(0.472, 0.9, 0.02), vec3(-0.438, 0.88, 0.018), vec3(-0.248, 0.89, 0.026), vec3(0.132, 0.88, 0.02),
  vec3(0.372, 0.875, 0.017), vec3(-0.028, 0.88, 0.016));

// Colours are blended by soft masks of width blur (in mushroom units), so
// edges inside the mushroom defocus along with its silhouette.
vec3 mushroomColour(vec2 m, float blur) {
  float x = m.x - 0.05 * m.y * m.y;
  float stemR = 0.085 + 0.025 * (1.0 - m.y / 0.86) + 0.065 * exp(-m.y * 9.0);
  float side = clamp(x / stemR, -1.0, 1.0);
  vec3 col = vec3(0.91, 0.886, 0.824) * (0.1 + 0.2 * smoothstep(0.6, -0.8, side));
  float ring = max(abs(x) - 0.096 - (0.66 - m.y) * 0.32, abs(m.y - 0.605) - 0.05);
  col = mix(col, vec3(0.86, 0.835, 0.76) * (0.07 + 0.12 * smoothstep(0.55, 0.66, m.y)), smoothstep(blur, -blur, ring));
  col = mix(col, vec3(0.82, 0.776, 0.678) * 0.08, smoothstep(-blur, blur, m.y - 0.8));

  float under = 0.82 + 0.02 * (1.0 - min(x * x / 0.3125, 1.0));
  float crown = smoothstep(0.84, 1.1, m.y) * smoothstep(0.6, 0.0, abs(x));
  vec3 cap = mix(vec3(0.722, 0.196, 0.102), vec3(0.431, 0.075, 0.043), crown);
  // The lamp is off to the left; the cap rounds away from it.
  cap *= 0.16 + 0.34 * smoothstep(0.5, -0.4, x) * smoothstep(0.82, 1.0, m.y) + 0.08 * smoothstep(0.9, 1.1, m.y);
  col = mix(col, cap, smoothstep(-blur, blur, m.y - under));

  float wart = 1e3;
  for (int i = 0; i < 14; i++) {
    vec2 d = (m - WARTS[i].xy) / vec2(1.0, 0.8);
    wart = min(wart, length(d) - WARTS[i].z);
  }
  vec3 wartColour = vec3(0.937, 0.906, 0.839) * (0.18 + 0.22 * smoothstep(0.4, -0.4, x));
  return mix(col, wartColour, smoothstep(blur, -blur, wart) * smoothstep(-blur, blur, m.y - under));
}

float treeline(float x) {
  return -0.07 + 0.025 * sin(x * 3.1 + 1.0) + 0.012 * sin(x * 8.7) + 0.02 * abs(sin(x * 17.0 + sin(x * 5.0)));
}

// The view outside, defocused by blur (screen units).
vec3 garden(vec2 p, float blur) {
  vec3 col = mix(vec3(0.62, 0.4, 0.25), vec3(0.13, 0.17, 0.22), sqrt(smoothstep(-0.12, 0.6, p.y)));
  col = mix(vec3(0.045, 0.055, 0.055), col, smoothstep(-blur, blur, p.y - treeline(p.x)));

  // Lit windows in a distant house turn to discs out of focus and points in a drop.
  for (int i = 0; i < 5; i++) {
    vec2 light = vec2(-0.95 + 0.43 * float(i) + 0.07 * sin(float(i) * 4.1), treeline(-0.95 + 0.43 * float(i)) - 0.035);
    float radius = blur * 1.4 + 0.003;
    col += LAMP * min(1.2e-4 / (radius * radius), 1.2) * smoothstep(radius, radius * 0.85, length(p - light));
  }

  float lawn = -0.17 + 0.03 * p.x;
  vec3 grass = mix(vec3(0.03, 0.04, 0.03), vec3(0.08, 0.1, 0.07), smoothstep(-0.7, lawn, p.y));
  col = mix(grass, col, smoothstep(-blur, blur, p.y - lawn));
  col *= 1.0 - 0.5 * exp(-pow(length((p - vec2(0.02, GROUND)) / vec2(0.3, 0.05)), 2.0));

  vec2 m = (p - vec2(0.0, GROUND)) / SCALE;
  if (abs(m.x) < 0.7 && m.y > -0.1 && m.y < 1.25) {
    float d = mushroom2D(m).x * SCALE;
    col = mix(col, mushroomColour(m, blur / SCALE), smoothstep(blur, -blur, d));
  }
  return col;
}

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec4 water = texture(uWater, gl_FragCoord.xy / uResolution);
  vec3 col = garden(p, 0.018);

  float wet = smoothstep(0.03, 0.25, water.b);
  if (wet > 0.0) {
    // The texture holds the drop's surface normal (canvas y points down).
    vec2 n = (water.rg - 0.5) * vec2(2.0, -2.0);
    float rim = smoothstep(0.55, 0.92, length(n));
    vec2 slope = n / sqrt(max(1.0 - dot(n, n), 0.05));
    vec3 through = garden(p - slope * 0.05, 0.004) * (1.0 - 0.7 * rim);
    through += 0.12 * pow(max(dot(normalize(vec3(n, 0.6)), normalize(vec3(-0.5, 0.6, 0.6))), 0.0), 30.0);
    col = mix(col, through, wet);
  }

  vec2 q = gl_FragCoord.xy / uResolution - 0.5;
  col *= 1.0 - 0.4 * dot(q, q);
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) * 0.01;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

// Drops live in units where the short side of the window is 1, y down.
const SLIDE_RADIUS = 0.01; // above this, weight beats the pinning of the glass
const MAX_DROPS = 2400;
const CELL = 0.07;
const SIM_PIXELS = 640; // water map resolution across the short side
const FLAT = '#808000'; // flat normal, no water

const world = { w: 1, h: 1 };
let drops = [];

// A spherical-cap drop: rg is the surface normal, b the water depth.
function dropSprite(size) {
  const sprite = document.createElement('canvas');
  sprite.width = sprite.height = size;
  const context = sprite.getContext('2d');
  const image = context.createImageData(size, size);
  for (let j = 0; j < size; j++) {
    for (let i = 0; i < size; i++) {
      const x = (i + 0.5) / size * 2 - 1, y = (j + 0.5) / size * 2 - 1;
      const r = Math.hypot(x, y);
      if (r >= 1) continue;
      const k = (j * size + i) * 4;
      image.data[k] = 128 + 127 * 0.92 * x;
      image.data[k + 1] = 128 + 127 * 0.92 * y;
      image.data[k + 2] = 255 * Math.sqrt(1 - r * r);
      image.data[k + 3] = 255 * Math.min((1 - r) * size * 0.5, 1);
    }
  }
  context.putImageData(image, 0, 0);
  return sprite;
}

const sprite = dropSprite(64);
const water = document.createElement('canvas');
const waterContext = water.getContext('2d', { alpha: false });

function spawn(x, y, r) {
  drops.push({ x, y, r, v: 0, trail: 0, phase: Math.random() * Math.PI * 2 });
}

// Rain comes and goes in long swells.
function rain(dt, t) {
  const rate = 700 * world.w * world.h * (0.6 + 0.4 * Math.sin(t * 0.11));
  for (let n = rate * dt + Math.random(); n >= 1 && drops.length < MAX_DROPS; n--) {
    const r = Math.random() < 0.08 ? 0.005 + 0.008 * Math.random() : 0.002 + 0.004 * Math.random() ** 2;
    spawn(Math.random() * world.w, Math.random() * world.h, r);
  }
}

// Heavy drops run down in stutters, wandering a little and shedding beads.
function slide(drop, dt, t) {
  if (drop.r < SLIDE_RADIUS) {
    drop.v = 0;
    return;
  }
  const grip = 0.5 + 0.5 * Math.sin(t * 2.3 + drop.phase);
  const target = (drop.r - SLIDE_RADIUS) * 32 * (0.2 + 0.8 * grip);
  drop.v += (target - drop.v) * Math.min(dt * 6, 1);
  drop.y += drop.v * dt;
  drop.x += drop.v * dt * 0.3 * Math.sin(drop.y * 30 + drop.phase);
  drop.trail += drop.v * dt;
  if (drop.trail > drop.r * 1.2) {
    drop.trail = 0;
    const r = drop.r * (0.15 + 0.2 * Math.random());
    spawn(drop.x + (Math.random() - 0.5) * drop.r * 0.5, drop.y - drop.r - r * 1.5, r);
    drop.r = Math.sqrt(drop.r * drop.r - r * r);
  }
}

function absorb(big, small) {
  const share = small.r * small.r / (big.r * big.r + small.r * small.r);
  big.x += (small.x - big.x) * share;
  big.y += (small.y - big.y) * share * 0.5;
  big.r = Math.hypot(big.r, small.r);
  small.r = 0;
}

// Drops that touch coalesce; the grid keeps neighbour checks local.
function coalesce() {
  const cols = Math.ceil(world.w / CELL) + 2;
  const grid = new Map();
  const cell = (d) => (Math.floor(d.y / CELL) + 1) * cols + Math.floor(d.x / CELL) + 1;
  for (const d of drops) {
    const key = cell(d);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(d);
  }
  for (const a of drops) {
    if (!a.r) continue;
    const key = cell(a);
    for (const offset of [-cols - 1, -cols, -cols + 1, -1, 0, 1, cols - 1, cols, cols + 1]) {
      for (const b of grid.get(key + offset) ?? []) {
        if (b === a || !b.r || !a.r) continue;
        const reach = (a.r + b.r) * 0.8;
        if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 < reach * reach) {
          if (a.r >= b.r) absorb(a, b);
          else absorb(b, a);
        }
      }
    }
  }
  drops = drops.filter((d) => d.r && d.y - d.r < world.h && d.x > -0.05 && d.x < world.w + 0.05);
}

function step(dt, t) {
  rain(dt, t);
  for (const drop of drops) slide(drop, dt, t);
  coalesce();
}

function paintWater(scale) {
  waterContext.fillStyle = FLAT;
  waterContext.fillRect(0, 0, water.width, water.height);
  drops.sort((a, b) => a.r - b.r);
  for (const d of drops) {
    const r = d.r * scale;
    const stretch = 1 + Math.min(d.v * 1.5, 0.35);
    const x = d.x * scale, y = d.y * scale;
    if (d.v > 0) waterContext.drawImage(sprite, x - r * 0.5, y - r * 1.4 * stretch, r, r * 1.6);
    waterContext.drawImage(sprite, x - r, y - r * (2 * stretch - 1), r * 2, r * 2 * stretch);
  }
}

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  const short = Math.min(w, h);
  world.w = w / short;
  world.h = h / short;
  const scale = Math.min(SIM_PIXELS, short);
  const width = Math.round(world.w * scale), height = Math.round(world.h * scale);
  if (water.width !== width || water.height !== height) {
    water.width = width;
    water.height = height;
  }
  return scale;
}

resize();
for (let i = 0; i < 300; i++) step(1 / 30, i / 30);

let last = performance.now();
function frame(ms) {
  const dt = Math.min((ms - last) / 1000, 0.05);
  last = ms;
  const scale = resize();
  step(dt, ms / 1000 + 10);
  paintWater(scale);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, water);
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Rain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161a11; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const ROWS = 84;
const GLYPHS = 64;

const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// Pass 1: the lit mushroom, one texel per glyph cell; alpha marks the mushroom.
const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uScreen;
uniform vec2 uCell;
uniform vec2 uOrigin;
uniform float uYaw;
out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (p.y < m.x) m = vec2(p.y, 4.0);
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.15);
    if (res < 0.002 || t > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 material(vec3 p, vec3 n, float part) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.43, 0.07, 0.04), vec3(0.72, 0.2, 0.1), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.94, 0.91, 0.84), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) return vec3(0.82, 0.78, 0.68) * (0.75 + 0.25 * cos(atan(q.z, q.x) * 70.0));
  return mix(vec3(0.78, 0.75, 0.68), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

void main() {
  vec2 screen = uOrigin + gl_FragCoord.xy * uCell;
  vec2 uv = (screen - 0.5 * uScreen) / min(uScreen.x, uScreen.y);
  vec3 target = vec3(0.0, 0.58, 0.0);
  vec3 ro = target + vec3(sin(uYaw), 0.2, cos(uYaw)) * 3.2;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.0 * fw);
  vec3 key = normalize(-0.8 * rt + vec3(0.0, 0.5, 0.0) + 0.4 * vec3(sin(uYaw), 0.0, cos(uYaw)));

  outColor = vec4(0.0);
  float t = 0.0;
  for (int i = 0; i < 90; i++) {
    vec3 p = ro + rd * t;
    vec2 m = mushroom(p);
    if (m.x < 0.001 * t) {
      vec3 n = normalAt(p);
      vec3 albedo = material(p, n, m.y);
      float diff = max(dot(n, key), 0.0) * softShadow(p + n * 0.003, key);
      vec3 lit = albedo * (diff * 1.3 + (0.5 + 0.5 * n.y) * 0.45 + 0.2);
      outColor = vec4(lit, 1.0);
      break;
    }
    t += m.x;
    if (t > 6.0) break;
  }
}`;

// Pass 2: falling glyph streams; where they cross the mushroom they take its light.
const rainFragment = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uGlyphs;
uniform vec2 uCell;
uniform vec2 uOrigin;
uniform float uTime;
out vec4 outColor;

const float GLYPHS = ${GLYPHS}.0;
const vec3 GROUND = vec3(0.085, 0.1, 0.065);
const vec3 MOSS = vec3(0.36, 0.43, 0.27);
const vec3 HEAD = vec3(0.95, 0.93, 0.84);

float hash(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

// Brightness of a stream at this row: 1 at its head, fading up its tail.
float stream(float column, float row, float rows, float seed) {
  float speed = mix(10.0, 26.0, hash(vec2(column, seed)));
  float tail = mix(14.0, 44.0, hash(vec2(column, seed + 1.0)));
  float span = rows + tail + mix(0.0, rows, hash(vec2(column, seed + 2.0)));
  float head = mod(uTime * speed + hash(vec2(column, seed + 3.0)) * span, span);
  float behind = head - row;
  return behind < 0.0 || behind > tail ? 0.0 : pow(1.0 - behind / tail, 1.6);
}

void main() {
  vec2 grid = vec2(textureSize(uScene, 0));
  vec2 px = gl_FragCoord.xy - uOrigin;
  vec2 cell = floor(px / uCell);
  if (any(lessThan(cell, vec2(0.0))) || any(greaterThanEqual(cell, grid))) {
    outColor = vec4(GROUND, 1.0);
    return;
  }
  float row = grid.y - 1.0 - cell.y;
  float rain = max(stream(cell.x, row, grid.y, 0.0), stream(cell.x, row, grid.y, 7.0));
  float isHead = step(0.97, rain);

  // Glyphs mutate, some cells restlessly, most slowly.
  float rate = mix(0.4, 9.0, pow(hash(cell + 0.5), 6.0));
  float glyph = floor(hash(cell + floor(uTime * rate + hash(cell) * 10.0) * 0.137) * GLYPHS);
  vec2 local = fract(px / uCell);
  vec2 atlas = (vec2(mod(glyph, 8.0), floor(glyph / 8.0)) + vec2(local.x, 1.0 - local.y)) / 8.0;
  // Gradients from the unwrapped coordinate keep the mip level steady across cell edges.
  vec2 footprint = px / uCell / 8.0;
  float ink = textureGrad(uGlyphs, atlas, dFdx(footprint), dFdy(footprint)).a;

  vec4 scene = texelFetch(uScene, ivec2(cell), 0);
  // Off the mushroom the rain is a dim drizzle. On it every glyph burns in the
  // mushroom's own colours, a passing stream brightens it further, and the
  // cell behind it takes a faint wash so the silhouette holds at thumbnail size.
  vec3 drizzle = MOSS * rain * 0.75;
  vec3 revealed = scene.rgb * (0.95 + 1.0 * rain);
  vec3 glyphColor = mix(drizzle, revealed, scene.a);
  glyphColor = mix(glyphColor, HEAD, isHead * mix(0.5, 0.9, scene.a));
  vec3 backdrop = mix(GROUND, scene.rgb * 0.11, scene.a);
  outColor = vec4(backdrop + glyphColor * ink, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(fragment) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
  gl.bindAttribLocation(program, 0, 'position');
  gl.linkProgram(program);
  const uniforms = {};
  for (let i = 0; i < gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); i++) {
    const { name } = gl.getActiveUniform(program, i);
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return { program, uniforms };
}

const scene = createProgram(sceneFragment);
const rain = createProgram(rainFragment);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function createTexture(filter) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return texture;
}

// An invented script in the spirit of mirrored katakana: each glyph is a few
// strokes between points of a 3 × 4 lattice, so no font is needed.
function glyphAtlas() {
  const size = 64;
  const atlas = document.createElement('canvas');
  atlas.width = atlas.height = size * 8;
  const context = atlas.getContext('2d');
  context.strokeStyle = '#fff';
  context.lineWidth = size * 0.1;
  context.lineCap = 'round';
  let seed = 7;
  const random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const point = () => [Math.floor(random() * 3), Math.floor(random() * 4)];
  for (let i = 0; i < GLYPHS; i++) {
    const ox = (i % 8) * size + size * 0.24, oy = Math.floor(i / 8) * size + size * 0.12;
    const step = [size * 0.26, size * 0.25];
    context.beginPath();
    for (let s = 0, strokes = 2 + Math.floor(random() * 3); s < strokes; s++) {
      const [ax, ay] = point();
      // Strokes run to a nearby lattice point: a bar across, a drop, or a short diagonal.
      const across = random() < 0.35;
      const bx = across ? (ax === 0 ? 2 : 0) : Math.min(2, Math.max(0, ax + Math.round(random() * 2 - 1)));
      const by = across ? ay : Math.min(3, ay + 1 + Math.floor(random() * 2));
      context.moveTo(ox + ax * step[0], oy + ay * step[1]);
      context.lineTo(ox + bx * step[0], oy + by * step[1]);
    }
    context.stroke();
  }
  return atlas;
}

const sceneTexture = createTexture(gl.NEAREST);
const glyphTexture = createTexture(gl.LINEAR);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, glyphAtlas());
gl.generateMipmap(gl.TEXTURE_2D);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
const sceneBuffer = gl.createFramebuffer();

let grid;
function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w;
  canvas.height = h;
  const cellH = Math.min(w, h) / ROWS;
  const cell = [cellH * 0.72, cellH];
  const size = [Math.floor(w / cell[0]), Math.floor(h / cell[1])];
  grid = { cell, size, origin: [(w - size[0] * cell[0]) / 2, (h - size[1] * cell[1]) / 2] };
  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, size[0], size[1], 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneBuffer);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTexture, 0);
}

function frame(ms) {
  resize();
  const { cell, size, origin } = grid;

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneBuffer);
  gl.viewport(0, 0, size[0], size[1]);
  gl.useProgram(scene.program);
  gl.uniform2f(scene.uniforms.uScreen, canvas.width, canvas.height);
  gl.uniform2f(scene.uniforms.uCell, cell[0], cell[1]);
  gl.uniform2f(scene.uniforms.uOrigin, origin[0], origin[1]);
  gl.uniform1f(scene.uniforms.uYaw, 0.6 + ms / 1000 * 0.25);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(rain.program);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, glyphTexture);
  gl.uniform1i(rain.uniforms.uScene, 0);
  gl.uniform1i(rain.uniforms.uGlyphs, 1);
  gl.uniform2f(rain.uniforms.uCell, cell[0], cell[1]);
  gl.uniform2f(rain.uniforms.uOrigin, origin[0], origin[1]);
  gl.uniform1f(rain.uniforms.uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

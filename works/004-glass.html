<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e4e2dc; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 LIGHT = vec3(0.35, 1.0, -0.7);        // key light above and behind the glass
const vec3 BOUNDS_CENTER = vec3(0.0, 0.56, 0.0);
const float BOUNDS_RADIUS = 0.74;
const vec3 IOR = vec3(1.47, 1.51, 1.56);          // exaggerated dispersion of flint glass

float spin;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// The glass piece turns slowly on its base.
vec3 local(vec3 p) {
  float c = cos(spin), s = sin(spin);
  p.xz = mat2(c, -s, s, c) * p.xz;
  return p;
}

vec2 map(vec3 p) { return mushroom(local(p)); }

// The cap and stem are separate pieces of glass, joined along the underside of the gills. A ray
// that enters the cap leaves through it, rather than dropping into the stem, where it would
// bounce off the walls of the rod too many times to follow.
float joint(vec3 p) {
  vec3 q = local(p);
  q.x -= 0.05 * q.y * q.y;
  return q.y - 0.78 - 0.08 * (1.0 - min(dot(q.xz, q.xz) / 0.31, 1.0));
}

// Distance to one piece: side 1 is the cap, -1 the stem, 0 the whole mushroom.
float piece(vec3 p, float side) { return side == 0.0 ? map(p).x : max(map(p).x, -side * joint(p)); }

float sideOf(vec3 p) { return joint(p) > 0.0 ? 1.0 : -1.0; }

vec3 normalAt(vec3 p, float side) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(piece(p + e.xyy, side) - piece(p - e.xyy, side),
                        piece(p + e.yxy, side) - piece(p - e.yxy, side),
                        piece(p + e.yyx, side) - piece(p - e.yyx, side)));
}

float march(vec3 ro, vec3 rd) {
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float h = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (h < 0.0) return -1.0;
  float t = max(-b - sqrt(h), 0.0), tFar = -b + sqrt(h);
  for (int i = 0; i < 96; i++) {
    float d = map(ro + rd * t).x;
    if (d < 0.0005) return t;
    t += d;
    if (t > tFar) break;
  }
  return -1.0;
}

// Distance travelled inside the glass before the ray reaches the far surface.
float marchInside(vec3 ro, vec3 rd, float side) {
  float t = 0.004;
  for (int i = 0; i < 48; i++) {
    float d = -piece(ro + rd * t, side);
    if (d < 0.0005) break;
    t += max(d, 0.001);
  }
  return t;
}

// Beer–Lambert absorption: a cranberry-glass cap on a clear, faintly green soda-lime stem.
vec3 absorption(float part) {
  return part < 1.5 ? vec3(0.15, 2.0, 1.5) : vec3(0.22, 0.06, 0.16);
}

// A pale sweep rising into a dark studio, two strip lights overhead, and black flags
// either side of the set that draw dark lines along the glass edges.
vec3 sky(vec3 rd) {
  vec3 col = mix(vec3(0.86, 0.85, 0.82), vec3(0.2, 0.2, 0.21), smoothstep(0.0, 0.3, rd.y));
  float flag = smoothstep(0.38, 0.46, abs(rd.x)) * smoothstep(0.8, 0.6, rd.y);
  col *= 1.0 - 0.9 * flag;
  float strips = smoothstep(0.07, 0.05, abs(abs(rd.x + 0.05) - 0.2)) * smoothstep(0.55, 0.6, rd.y);
  return col + vec3(2.0, 1.97, 1.9) * strips;
}

// Light reaching the floor through the glass. Where a path crosses the middle of a piece,
// its two faces are nearly opposite and the curved glass acts as a lens, focusing a caustic
// with spectral fringes at its edge. Grazing paths are bent away and leave a dark rim.
vec3 lightOnFloor(vec3 p) {
  vec3 l = normalize(LIGHT);
  float t = 0.02, penumbra = 1.0;
  for (int i = 0; i < 40; i++) {
    vec3 q = p + l * t;
    vec2 m = map(q);
    if (m.x < 0.001) {
      // The seam is too thin to show in a soft shadow, so light passes through the whole mushroom.
      float len = marchInside(q, l, 0.0);
      float centred = max(-dot(normalAt(q, 0.0), normalAt(q + l * len, 0.0)), 0.0);
      vec3 focus = pow(vec3(centred), vec3(48.0, 60.0, 76.0)) * 3.0;
      return exp(-absorption(m.y) * len) * (0.4 + focus);
    }
    penumbra = min(penumbra, 10.0 * m.x / t);
    t += clamp(m.x, 0.01, 0.12);
    if (t > 3.0) break;
  }
  return vec3(0.3 + 0.7 * clamp(penumbra, 0.0, 1.0));
}

vec3 floorColor(vec3 p, vec3 rd, vec3 direct) {
  vec3 paper = vec3(0.86, 0.85, 0.82);
  vec3 col = paper * (0.38 + 0.7 * direct);
  return mix(col, sky(vec3(rd.x, 0.0, rd.z)), 1.0 - exp(-length(p.xz) * 0.15));
}

vec3 environment(vec3 ro, vec3 rd, vec3 direct) {
  if (rd.y >= 0.0) return sky(rd);
  return floorColor(ro + rd * (-ro.y / rd.y), rd, direct);
}

// Milk-glass warts, fused onto the cap.
float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.17, 0.22, d);
}

vec3 shadeGlass(vec3 p, vec3 rd, float part) {
  float side = sideOf(p);
  vec3 n = normalAt(p, side);
  float fresnel = 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  vec3 reflected = environment(p, reflect(rd, n), vec3(1.0));

  // Follow the ray through the glass, letting it bounce off the inside walls by total
  // internal reflection until it can leave.
  vec3 inside = refract(rd, n, 1.0 / IOR.g);
  vec3 exit = p - n * 0.002, nExit;
  float len = 0.0;
  for (int bounce = 0; bounce < 3; bounce++) {
    float segment = marchInside(exit, inside, side);
    exit += inside * segment;
    len += segment;
    nExit = -normalAt(exit, side);
    vec3 escape = refract(inside, nExit, IOR.g);
    if (dot(escape, escape) > 0.0) break;
    inside = reflect(inside, nExit);
    exit += nExit * 0.002;
  }
  // The floor seen through the glass carries its shadow and caustic; one lookup serves all three channels.
  vec3 seen = refract(inside, nExit, IOR.g);
  vec3 direct = seen.y < 0.0 ? lightOnFloor(exit + seen * (-exit.y / seen.y)) : vec3(1.0);
  vec3 transmitted;
  for (int c = 0; c < 3; c++) {
    vec3 leaving = refract(inside, nExit, IOR[c]);
    if (dot(leaving, leaving) == 0.0) leaving = reflect(inside, nExit);
    transmitted[c] = environment(exit, leaving, direct)[c];
  }
  transmitted *= exp(-absorption(part) * len);
  vec3 col = mix(transmitted, reflected, fresnel);

  vec3 q = local(p);
  q.x -= 0.05 * q.y * q.y;
  if (part < 0.5) {
    float milk = warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2);
    vec3 frosted = vec3(0.95, 0.94, 0.91) * (0.55 + 0.35 * n.y + 0.3 * max(dot(n, normalize(LIGHT)), 0.0));
    col = mix(col, frosted, milk * 0.92);
  }
  return col;
}

void main() {
  spin = uTime * 0.22;
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 ro = vec3(0.0, 1.0, 3.6);
  vec3 target = vec3(0.0, 0.5, 0.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.9 * fw);

  vec3 col = sky(rd);
  if (rd.y < 0.0) {
    vec3 p = ro + rd * (-ro.y / rd.y);
    col = floorColor(p, rd, lightOnFloor(p));
  }
  float t = march(ro, rd);
  if (t > 0.0) {
    vec3 p = ro + rd * t;
    col = shadeGlass(p, rd, map(p).y);
  }

  col *= 1.0 - 0.18 * dot(uv, uv);
  col = pow(col, vec3(0.9));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.01;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

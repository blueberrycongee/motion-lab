<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2e2b; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 SPOT = vec3(-0.55, 1.0, 0.35);        // a gallery spotlight, high and to the left
const vec3 BOUNDS_CENTER = vec3(0.0, 0.56, 0.0);
const float BOUNDS_RADIUS = 0.76;
const vec3 PLINTH = vec3(0.55, 0.6, 0.55);       // half-size; the top is at y = 0

float spin;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x),
                 mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
                 mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// Distance to the nearest wart centre on a jittered 3D grid, in grid cells.
float wartDistance(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return d;
}

vec3 local(vec3 p) {
  float c = cos(spin), s = sin(spin);
  p.xz = mat2(c, -s, s, c) * p.xz;
  return p;
}

// Warts are carved in low relief.
vec2 map(vec3 p) {
  vec3 q = local(p);
  vec2 m = mushroom(q);
  if (m.y < 0.5 && m.x < 0.03) {
    vec3 c = vec3(q.x - 0.05 * q.y * q.y, q.y - 0.8, q.z);
    m.x -= 0.008 * smoothstep(0.26, 0.12, wartDistance(c)) * smoothstep(0.0, 0.12, c.y);
  }
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

vec2 march(vec3 ro, vec3 rd) {
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float h = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (h < 0.0) return vec2(-1.0);
  float t = max(-b - sqrt(h), 0.0), tFar = -b + sqrt(h);
  for (int i = 0; i < 96; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0004) return vec2(t, m.y);
    t += m.x;
    if (t > tFar) break;
  }
  return vec2(-1.0);
}

float shadow(vec3 p, vec3 l) {
  float t = 0.02, light = 1.0;
  for (int i = 0; i < 40; i++) {
    float d = map(p + l * t).x;
    light = min(light, 10.0 * d / t);
    if (light < 0.01) break;
    t += clamp(d, 0.01, 0.15);
    if (t > 2.0) break;
  }
  return clamp(light, 0.0, 1.0);
}

float occlusion(vec3 p, vec3 n) {
  float o = 0.0;
  for (int i = 1; i <= 4; i++) {
    float h = 0.04 * float(i);
    o += (h - map(p + n * h).x) / float(i);
  }
  return clamp(1.0 - 2.0 * o, 0.0, 1.0);
}

// Ray against the plinth box: distance and outward normal, or -1.
vec4 plinth(vec3 ro, vec3 rd) {
  vec3 centre = vec3(0.0, -PLINTH.y, 0.0);
  vec3 m = 1.0 / rd;
  vec3 k = abs(m) * PLINTH;
  vec3 a = -m * (ro - centre) - k, b = -m * (ro - centre) + k;
  float tNear = max(max(a.x, a.y), a.z), tFar = min(min(b.x, b.y), b.z);
  if (tNear > tFar || tFar < 0.0) return vec4(-1.0);
  vec3 n = -sign(rd) * step(a.yzx, a.xyz) * step(a.zxy, a.xyz);
  return vec4(tNear, n);
}

float fbm(vec3 p) {
  float sum = 0.0, amp = 0.5;
  for (int i = 0; i < 5; i++) {
    sum += amp * noise(p);
    p = p * 2.03 + 1.7;
    amp *= 0.5;
  }
  return sum;
}

// Calacatta: white stone with soft grey clouding, a few bold veins and fine secondary veining.
// Each vein family is a set of parallel bands bent by turbulence, so the veins wander, pinch
// and keep a steady direction through the form, running up the stem and across the cap.
float veins(vec3 q, vec3 dir, float freq, float warp) {
  return abs(sin(dot(q, dir) * freq + fbm(q * 1.6 + dir) * warp));
}

vec3 marble(vec3 q) {
  float bold = veins(q, normalize(vec3(0.7, 1.6, -0.4)), 7.5, 3.0);
  float width = 0.03 + 0.09 * noise(q * 3.0 + 4.0);
  float fine = veins(q, normalize(vec3(-0.8, 0.9, 1.1)), 13.0, 5.0);
  float hair = abs(fbm(q * 9.0 + 23.0) - 0.5);

  vec3 col = mix(vec3(0.94, 0.93, 0.9), vec3(0.8, 0.8, 0.79), smoothstep(0.4, 0.7, fbm(q * 3.0 + 7.0)));
  col = mix(col, vec3(0.52, 0.51, 0.49), smoothstep(0.07, 0.015, fine) * (0.3 + 0.7 * noise(q * 6.0)));
  col = mix(col, vec3(0.62, 0.61, 0.59), smoothstep(0.006, 0.0015, hair) * 0.35);
  col = mix(col, vec3(0.72, 0.7, 0.66), smoothstep(width * 4.0, width, bold) * 0.5);     // stain bleeding from the vein
  return mix(col, vec3(0.38, 0.35, 0.3), smoothstep(width, width * 0.4, bold));
}

// What polished stone reflects: a dark gallery with a ceiling spot and a long skylight.
vec3 gallery(vec3 rd) {
  vec3 col = mix(vec3(0.03, 0.032, 0.03), vec3(0.09, 0.1, 0.095), smoothstep(-0.3, 0.4, rd.y));
  col += vec3(9.0, 8.6, 7.8) * smoothstep(0.996, 0.998, dot(rd, normalize(SPOT)));
  // A rectangular skylight overhead, with a crossbar.
  vec2 sky = rd.xz / max(rd.y, 0.05);
  vec2 frame = abs(sky - vec2(0.3, 0.1));
  float pane = step(frame.x, 0.5) * step(frame.y, 0.8) * step(0.025, min(frame.x, frame.y));
  col += vec3(3.0, 3.1, 3.2) * pane * step(0.0, rd.y);
  return col;
}

// The spotlight falls off in a pool around the plinth.
float spotPool(vec3 p) {
  return smoothstep(1.4, 0.3, length(p.xz - vec2(-0.1, 0.15)));
}

vec3 shadeMarble(vec3 p, vec3 rd) {
  vec3 n = normalAt(p);
  vec3 l = normalize(SPOT);
  vec3 base = marble(local(p));
  float ao = occlusion(p, n);
  float direct = max(dot(n, l), 0.0) * shadow(p + n * 0.003, l) * spotPool(p);

  // Light diffusing through the stone softens the terminator and warms the shadow side, and
  // glows faintly through thin edges such as the cap rim and the ring.
  float through = max(dot(n, l) + 0.5, 0.0) / 1.5 - max(dot(n, l), 0.0);
  float thin = clamp(1.0 + map(p - n * 0.06).x / 0.06, 0.0, 1.0);
  vec3 col = base * (vec3(1.25, 1.2, 1.12) * direct + vec3(0.4, 0.32, 0.22) * through
                     + vec3(0.3, 0.24, 0.16) * thin * spotPool(p) + vec3(0.1, 0.11, 0.11) * ao);
  float fresnel = 0.05 + 0.95 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  return col + gallery(reflect(rd, n)) * fresnel * mix(0.4, 1.5, ao);
}

// Polished black granite: a sharp mirror of the mushroom on top, honed sides.
vec3 shadeGranite(vec3 p, vec3 rd, vec3 n) {
  vec3 l = normalize(SPOT);
  float fleck = smoothstep(0.7, 0.95, noise(p * 260.0));
  vec3 base = vec3(0.025, 0.026, 0.028) + vec3(0.025) * fleck;
  if (n.y < 0.5) return base * (0.6 + 0.6 * spotPool(p) * max(dot(n, l), 0.0)) + vec3(0.012);

  vec3 col = base * (1.6 * shadow(p, l) * spotPool(p) * l.y + 0.2);
  vec3 r = reflect(rd, n);
  vec2 hit = march(p, r);
  vec3 seen = hit.x > 0.0 ? shadeMarble(p + r * hit.x, r) : gallery(r);
  float fresnel = 0.05 + 0.95 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  return col + seen * fresnel;
}

void main() {
  spin = uTime * 0.1;

  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 ro = vec3(0.9, 0.85, 3.3);
  vec3 target = vec3(0.0, 0.42, 0.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.8 * fw);

  // A green-grey gallery wall, brightest where the spot spills behind the work.
  vec2 spill = uv - vec2(-0.05, 0.15);
  vec3 col = vec3(0.04, 0.045, 0.042) + vec3(0.09, 0.095, 0.085) * exp(-3.5 * dot(spill, spill));
  vec4 box = plinth(ro, rd);
  if (box.x > 0.0) col = shadeGranite(ro + rd * box.x, rd, box.yzw);
  vec2 hit = march(ro, rd);
  if (hit.x > 0.0) col = shadeMarble(ro + rd * hit.x, rd);

  col *= 1.0 - 0.3 * dot(uv, uv);
  col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);   // ACES filmic curve
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.008;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0b0a; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 BOUNDS_CENTER = vec3(0.0, 0.5, 0.0);
const float BOUNDS_RADIUS = 1.05;
const float PLATTER = 0.05;                       // height of the turntable platter
const vec3 CHROME = vec3(0.62, 0.63, 0.65);       // reflectance of polished chrome at normal incidence

float spin;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// Distance to the nearest wart centre on a jittered 3D grid, in grid cells.
float wartDistance(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return d;
}

// The mushroom turns on the platter; warts are raised so the spin shows in the reflections.
vec3 local(vec3 p) {
  float c = cos(spin), s = sin(spin);
  p.xz = mat2(c, -s, s, c) * p.xz;
  p.y -= PLATTER;
  return p;
}

// Upright coordinates centred on the cap, with the stem's lean removed.
vec3 capSpace(vec3 q) {
  return vec3(q.x - 0.05 * q.y * q.y, q.y - 0.8, q.z);
}

// Returns distance and part: mushroom parts as above, 4 platter.
vec2 map(vec3 p) {
  vec3 q = local(p);
  vec2 m = mushroom(q);
  if (m.y < 0.5 && m.x < 0.03) {
    vec3 c = capSpace(q);
    m.x -= 0.014 * smoothstep(0.3, 0.1, wartDistance(c)) * smoothstep(0.0, 0.12, c.y);
  }
  vec2 platter = vec2(max(length(p.xz) - 0.85, abs(p.y - PLATTER * 0.5) - PLATTER * 0.5) + 0.004, 4.0);
  return platter.x < m.x ? platter : m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

vec2 march(vec3 ro, vec3 rd) {
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float h = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (h < 0.0) return vec2(-1.0);
  float t = max(-b - sqrt(h), 0.0), tFar = -b + sqrt(h);
  for (int i = 0; i < 96; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0004) return vec2(t, m.y);
    t += m.x;
    if (t > tFar) break;
  }
  return vec2(-1.0);
}

// Soft-edged rectangle in direction space, centred on (x, y) with half-size (w, h).
float softbox(vec2 d, vec2 centre, vec2 size, float blur) {
  vec2 q = abs(d - centre) - size;
  return smoothstep(blur, -blur, max(q.x, q.y));
}

// The studio: a charcoal sweep with a lit pool on the floor, a large overhead softbox,
// two strip lights at the sides, a warm kicker behind and a grey bounce card at the camera.
// Blur widens every edge for satin surfaces.
vec3 studio(vec3 ro, vec3 rd, float blur) {
  vec3 col;
  if (rd.y < 0.0) {
    vec2 floorPoint = ro.xz + rd.xz * (-ro.y / rd.y);
    col = vec3(0.025, 0.023, 0.021) + vec3(0.14, 0.13, 0.12) * exp(-dot(floorPoint, floorPoint) * 0.35);
  } else {
    col = mix(vec3(0.035, 0.032, 0.03), vec3(0.008), smoothstep(0.0, 0.5, rd.y));
  }
  float azimuth = atan(rd.x, -rd.z);
  col += vec3(0.1, 0.095, 0.085) * exp(-abs(rd.y) * (70.0 / (1.0 + 40.0 * blur)) - azimuth * azimuth * 0.3);
  float elevation = asin(clamp(rd.y, -1.0, 1.0));
  vec2 d = vec2(azimuth, elevation);
  float b = 0.02 + blur;
  col += vec3(3.2, 3.15, 3.0) * softbox(vec2(rd.x, rd.z), vec2(0.0, -0.1), vec2(0.45, 0.3), b) * step(0.7, rd.y);
  col += vec3(2.1, 2.3, 2.6) * softbox(d, vec2(-2.0, 0.3), vec2(0.28, 0.45), b);
  col += vec3(2.6, 2.4, 2.1) * softbox(d, vec2(1.6, 0.25), vec2(0.07, 0.5), b);
  col += vec3(2.2, 1.5, 0.8) * softbox(d, vec2(0.5, 0.15), vec2(0.06, 0.12), b);
  col += vec3(0.16, 0.16, 0.17) * softbox(d, vec2(3.14159, 0.1), vec2(0.7, 0.35), 0.3 + blur);
  return col;
}

// Gills, warts and the platter are satin rather than mirror; their reflections are blurred.
float roughness(vec3 p, float part) {
  if (part > 0.5 && part < 1.5) return 0.25;
  if (part > 3.5) return 0.12;
  if (part > 0.5) return 0.0;
  vec3 c = capSpace(local(p));
  return 0.35 * smoothstep(0.24, 0.16, wartDistance(c)) * smoothstep(0.0, 0.12, c.y);
}

vec3 chrome(vec3 rd, vec3 n, vec3 reflected) {
  float cosine = max(dot(-rd, n), 0.0);
  return (CHROME + (1.0 - CHROME) * pow(1.0 - cosine, 5.0)) * reflected;
}

// Satin black anodised aluminium, lit from the overhead softbox.
vec3 platter(vec3 p, vec3 rd, vec3 n, vec3 reflected) {
  float fresnel = 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  vec3 diffuse = vec3(0.035, 0.034, 0.033) * (0.4 + 0.6 * exp(-dot(p.xz, p.xz) * 1.5)) * max(n.y, 0.2);
  return diffuse + reflected * mix(0.25, 1.0, fresnel);
}

// One bounce: whatever a reflected ray sees, with the mushroom shown in its own reflection.
vec3 bounce(vec3 p, vec3 r, float blur) {
  vec2 hit = march(p, r);
  if (hit.x < 0.0) return studio(p, r, blur);
  vec3 q = p + r * hit.x;
  vec3 n = normalAt(q);
  vec3 seen = studio(q, reflect(r, n), blur + roughness(q, hit.y));
  return hit.y > 3.5 ? platter(q, r, n, seen) : chrome(r, n, seen);
}

void main() {
  spin = uTime * 0.35;
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 ro = vec3(0.0, 0.95, 3.5);
  vec3 target = vec3(0.0, 0.52, 0.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.95 * fw);

  vec3 col = studio(ro, rd, 0.0);
  vec2 hit = march(ro, rd);
  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    float blur = roughness(p, hit.y);
    if (hit.y > 0.5 && hit.y < 1.5) {
      vec3 q = local(p);
      n = normalize(n + 0.35 * sin(atan(q.z, q.x) * 70.0) * normalize(vec3(-q.z, 0.0, q.x)));
    }
    vec3 reflected = bounce(p + n * 0.002, reflect(rd, n), blur);
    col = hit.y > 3.5 ? platter(p, rd, n, reflected) : chrome(rd, n, reflected);
  }

  col *= 1.0 - 0.3 * dot(uv, uv);
  col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);   // ACES filmic curve
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.012;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

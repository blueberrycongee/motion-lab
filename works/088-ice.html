<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171a; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 WINDOW = vec3(-0.6, 0.65, -0.55);     // an overcast window behind, to the left
const vec3 BOUNDS_CENTER = vec3(0.0, 0.56, 0.0);
const float BOUNDS_RADIUS = 0.8;
const float IOR = 1.31;
const vec3 ICE_ABSORPTION = vec3(0.45, 0.14, 0.07);
const float FALL = 0.26;                          // seconds a drop takes to reach the floor

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x),
                 mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
                 mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// Distance to the nearest wart centre on a jittered 3D grid, in grid cells.
float wartDistance(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return d;
}

// Melt water collects at three points under the rim of the cap.
vec3 dripAnchor(float i) {
  float a = 0.6 + i * 0.75;
  return vec3(0.51 * cos(a) + 0.033, 0.815, 0.51 * sin(a));
}

// Seconds into drip i's cycle: it swells for most of the period, then lets go.
float dripAge(float i, out float period) {
  period = 4.0 + i * 0.6;
  return mod(uTime + i * 1.7, period);
}

float drops(vec3 p) {
  float d = 1e9;
  for (int k = 0; k < 3; k++) {
    float i = float(k), period;
    float age = dripAge(i, period);
    vec3 anchor = dripAnchor(i);
    float hang = period - FALL;
    if (age < hang) {
      float r = 0.006 + 0.014 * age / hang;
      d = min(d, sdEllipsoid(p - anchor + vec3(0.0, 0.004 + 1.3 * r, 0.0), vec3(r, 1.5 * r, r)));
    } else {
      float f = age - hang;
      vec3 c = anchor - vec3(0.0, 0.03 + 12.5 * f * f, 0.0);
      if (c.y > 0.0) d = min(d, sdEllipsoid(p - c, vec3(0.016, 0.027, 0.016)));
    }
  }
  return d;
}

// Returns distance and part: mushroom parts, 4 melt water. Melting leaves shallow scallops.
vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (m.x < 0.02) m.x += 0.006 * noise(p * 7.0);
  float water = drops(p);
  float joined = smin(m.x, water, 0.015);
  return vec2(joined, water < m.x ? 4.0 : m.y);
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

vec2 march(vec3 ro, vec3 rd) {
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float h = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (h < 0.0) return vec2(-1.0);
  float t = max(-b - sqrt(h), 0.0), tFar = -b + sqrt(h);
  for (int i = 0; i < 96; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0005) return vec2(t, m.y);
    t += m.x;
    if (t > tFar) break;
  }
  return vec2(-1.0);
}

float marchInside(vec3 ro, vec3 rd) {
  float t = 0.004;
  for (int i = 0; i < 48; i++) {
    float d = -map(ro + rd * t).x;
    if (d < 0.0005) break;
    t += max(d, 0.001);
  }
  return t;
}

float shadow(vec3 p, vec3 l) {
  float t = 0.02, light = 1.0;
  for (int i = 0; i < 32; i++) {
    float d = map(p + l * t).x;
    light = min(light, 5.0 * d / t);
    if (light < 0.01) break;
    t += clamp(d, 0.02, 0.2);
    if (t > 2.5) break;
  }
  return clamp(light, 0.0, 1.0);
}

// Air trapped as the ice froze. The deepest ice froze last and is clouded with fine bubbles;
// larger ones are scattered nearer the surface. Returns bubble rims and the cloud crossed.
vec2 trappedAir(vec3 from, vec3 dir, float len) {
  float glow = 0.0, cloud = 0.0;
  vec3 last = vec3(1e5);
  for (int i = 0; i < 20; i++) {
    vec3 s = from + dir * (len * (float(i) + 0.5) / 20.0);
    float core = smoothstep(0.035, 0.09, -mushroom(s).x);
    cloud += core * noise(s * 24.0) * len / 20.0;
    vec3 cell = floor(s * 16.0);
    if (cell == last || hash(cell + 4.4) > 0.05 + 0.25 * core) continue;
    last = cell;
    vec3 c = cell + 0.2 + 0.6 * vec3(hash(cell), hash(cell + 2.9), hash(cell + 6.1));
    float r = mix(0.1 + 0.2 * hash(cell + 8.8), 0.07, core);
    float d = length(cross(c - from * 16.0, dir));
    glow += smoothstep(r, 0.6 * r, d) * (0.3 + 0.7 * d / r);    // bright rims, as bubbles show in ice
  }
  return vec2(glow, cloud);
}

// A dim cold room lit by one tall window, which gives the ice something to refract and reflect.
vec3 sky(vec3 rd) {
  vec3 col = mix(vec3(0.07, 0.08, 0.09), vec3(0.16, 0.18, 0.2), smoothstep(-0.1, 0.8, rd.y));
  vec3 w = normalize(WINDOW);
  vec3 across = normalize(cross(w, vec3(0, 1, 0)));
  vec3 up = cross(across, w);
  float facing = dot(rd, w);
  vec2 q = vec2(dot(rd, across), dot(rd, up)) / max(facing, 1e-3);
  vec2 pane = abs(q) - vec2(0.32, 0.5);
  float glass = step(0.0, facing) * step(max(pane.x, pane.y), 0.0) * step(0.015, min(abs(q.x), abs(q.y - 0.12)));
  return col + vec3(2.6, 2.7, 2.8) * glass * (0.8 + 0.2 * q.y) + vec3(0.12, 0.13, 0.14) * smoothstep(0.5, 1.0, facing);
}

// Concentric rings spreading from where each drop landed, as a slope across the puddle.
vec2 ripples(vec2 xz) {
  vec2 slope = vec2(0.0);
  for (int k = 0; k < 3; k++) {
    float i = float(k), period;
    float age = dripAge(i, period);
    vec2 away = xz - dripAnchor(i).xz;
    float dist = length(away);
    float wave = (dist - 0.25 * age) / 0.04;
    slope += away / max(dist, 1e-3) * cos(dist * 120.0) * exp(-wave * wave - age * 1.5) * 0.5;
  }
  return slope;
}

// Wet slate tiles with a puddle of melt water around the base. Only camera rays look for the
// mushroom's shadow and reflection; rays leaving the ice settle for the plain floor.
vec3 environment(vec3 ro, vec3 rd, bool primary) {
  if (rd.y >= 0.0) return sky(rd);
  vec3 p = ro + rd * (-ro.y / rd.y);
  vec2 tile = p.xz / 0.42;
  vec2 grout = abs(fract(tile) - 0.5);
  vec3 col = vec3(0.05, 0.055, 0.06) * (0.7 + 0.6 * hash(vec3(floor(tile), 1.0))) * (0.8 + 0.4 * noise(vec3(p.xz * 9.0, 0.0)));
  col *= 1.0 - 0.6 * smoothstep(0.475, 0.49, max(grout.x, grout.y));
  vec3 l = normalize(WINDOW);
  col *= primary ? 0.55 + 0.45 * shadow(p, l) : 1.0;

  float puddle = smoothstep(0.02, -0.02, length(p.xz) - 0.6 - 0.1 * noise(vec3(p.xz * 5.0, 2.0)));
  vec3 n = normalize(vec3(-ripples(p.xz) * puddle, 1.0).xzy);
  vec3 r = reflect(rd, n);
  float fresnel = (0.02 + 0.98 * pow(1.0 - max(-rd.y, 0.0), 5.0)) * puddle;
  vec3 mirrored = sky(r);
  if (primary && puddle > 0.0 && march(p, r).x > 0.0) mirrored = mix(mirrored, vec3(0.5, 0.56, 0.6), 0.6);
  col = mix(col * (1.0 - 0.5 * puddle), mirrored, fresnel);
  return mix(col, sky(rd), smoothstep(3.0, 7.0, length(p.xz)));
}

// Frost: patchy rime on surfaces facing up, and clumps of it where the warts would be.
float frost(vec3 p, vec3 n, float part) {
  if (part > 3.5) return 0.0;
  vec3 c = vec3(p.x - 0.05 * p.y * p.y, p.y - 0.8, p.z);
  float clumps = part < 0.5 ? smoothstep(0.3, 0.2, wartDistance(c)) * smoothstep(0.0, 0.1, c.y) : 0.0;
  float rime = smoothstep(0.4, 0.95, n.y + 0.5 * noise(p * 5.0) - 0.25) * smoothstep(0.3, 0.6, noise(p * 40.0));
  return max(clumps, 0.9 * rime);
}

vec3 shadeIce(vec3 p, vec3 rd, float part) {
  vec3 n = normalAt(p);
  vec3 l = normalize(WINDOW);
  float fresnel = 0.02 + 0.98 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  vec3 reflected = environment(p, reflect(rd, n), false);

  // Follow the ray through the ice, bouncing off the inside walls by total internal
  // reflection until it can leave, and light up the bubbles it passes.
  vec3 inside = refract(rd, n, 1.0 / IOR);
  vec3 exit = p - n * 0.002, nExit;
  float len = 0.0;
  vec2 air = vec2(0.0);
  for (int bounce = 0; bounce < 3; bounce++) {
    float segment = marchInside(exit, inside);
    air += trappedAir(exit, inside, segment);
    exit += inside * segment;
    len += segment;
    nExit = -normalAt(exit);
    if (dot(refract(inside, nExit, IOR), inside) != 0.0) break;
    inside = reflect(inside, nExit);
    exit += nExit * 0.002;
  }
  vec3 leaving = refract(inside, nExit, IOR);
  if (dot(leaving, leaving) == 0.0) leaving = reflect(inside, nExit);
  vec3 transmitted = environment(exit, leaving, false) + vec3(0.75, 0.8, 0.85) * air.x * 0.4;
  transmitted = mix(transmitted, vec3(0.5, 0.55, 0.6), 1.0 - exp(-air.y * 9.0)) * exp(-ICE_ABSORPTION * len);
  vec3 col = mix(transmitted, reflected, fresnel);
  col += vec3(1.4, 1.4, 1.35) * pow(max(dot(reflect(rd, n), l), 0.0), 300.0);     // wet sheen

  float rime = frost(p, n, part);
  vec3 crystal = floor(p * 260.0);
  float sparkle = step(0.97, hash(crystal)) * pow(max(dot(n, normalize(l - rd)), 0.0), 4.0);
  vec3 frosted = vec3(0.8, 0.84, 0.88) * (0.55 + 0.25 * n.y + 0.35 * max(dot(n, l), 0.0)) + sparkle;
  return mix(col, frosted, rime);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 ro = vec3(0.7, 0.95, 3.2);
  vec3 target = vec3(0.0, 0.46, 0.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.9 * fw);

  vec2 hit = march(ro, rd);
  vec3 col = hit.x > 0.0 ? shadeIce(ro + rd * hit.x, rd, hit.y) : environment(ro, rd, true);

  col *= 1.0 - 0.25 * dot(uv, uv);
  col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);   // ACES filmic curve
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.008;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

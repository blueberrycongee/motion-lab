<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Planet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9c7cf; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const float FOCAL = 2.4;
const float RADIUS = 0.85;              // the planet; the mushroom stands on its north pole
const vec3 CENTRE = vec3(0.0, -RADIUS, 0.0);
const vec3 KEY = vec3(-0.6, 0.65, 0.45);
const vec3 KEYLIGHT = vec3(1.0, 0.92, 0.8);
const vec3 SKYLIGHT = vec3(0.55, 0.66, 0.78);

const vec3 MINI = vec3(0.6, 0.7, 0.4);               // where the small mushroom grows
const vec4 PEBBLES[5] = vec4[5](                      // direction from the centre, size
  vec4(-0.5, 0.62, 0.6, 0.07), vec4(-0.42, 0.66, 0.66, 0.045), vec4(0.85, 0.3, -0.42, 0.08),
  vec4(-0.75, 0.2, -0.6, 0.06), vec4(0.2, 0.55, -0.8, 0.05));
const vec3 TUFTS[12] = vec3[12](
  vec3(0.62, 0.55, 0.55), vec3(-0.66, 0.5, 0.55), vec3(0.2, 0.62, 0.76), vec3(-0.3, 0.45, -0.84),
  vec3(0.75, 0.6, -0.25), vec3(-0.85, 0.48, -0.1), vec3(0.3, 0.1, 0.95), vec3(-0.15, 0.2, -0.97),
  vec3(0.95, -0.1, 0.3), vec3(-0.6, -0.2, 0.75), vec3(0.5, 0.3, -0.8), vec3(-0.9, 0.05, -0.45));

vec3 gLocal;       // the hit point in the frame of the mushroom it belongs to, for shading

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x),
                 mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
                 mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

mat2 rotation(float a) {
  float s = sin(a), c = cos(a);
  return mat2(c, s, -s, c);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// p in the frame of something standing on the planet at unit direction up: y along the surface normal.
vec3 standing(vec3 p, vec3 up) {
  vec3 right = normalize(cross(up, vec3(0.0, 0.0, 1.0)));
  vec3 forward = cross(right, up);
  vec3 d = p - CENTRE - up * RADIUS;
  return vec3(dot(d, right), dot(d, up), dot(d, forward));
}

float ground(vec3 p) {
  vec3 d = p - CENTRE;
  return length(d) - RADIUS - 0.025 * noise(d * 4.0) + 0.012;
}

// A clump of blades fanning out of one point and curving away from it: a tall inner ring
// and a short outer one, offset so they do not line up.
float blades(vec3 q, float count, float height, float spread, float twist) {
  float sector = 6.2831853 / count;
  float a = atan(q.z, q.x) + twist;
  float r = length(q.xz);
  a = mod(a + 0.5 * sector, sector) - 0.5 * sector;
  vec3 b = vec3(r * cos(a), q.y, r * sin(a));
  float h = clamp(b.y / height, 0.0, 1.0);
  float blade = length(vec2(b.x - 0.01 - spread * h * h, b.z * 1.4)) - 0.018 * (1.0 - h);
  return max(blade, max(-b.y, b.y - height)) * 0.6;
}

float tuft(vec3 q, float seed) {
  return min(blades(q, 6.0, 0.12 + 0.04 * seed, 0.04, seed * 3.0),
             blades(q, 9.0, 0.07 + 0.02 * seed, 0.07, seed * 3.0 + 0.35));
}

// Parts: 0-3 mushroom (both), 4 grass, 5 pebble, 6 blade.
vec2 map(vec3 p) {
  vec2 res = vec2(ground(p), 4.0);
  if (length(p - vec3(0.03, 0.55, 0.0)) - 0.8 < res.x) {
    vec2 m = mushroom(p);
    if (m.x < res.x) { res = m; gLocal = p; }
  }
  vec3 q = standing(p, normalize(MINI)) / 0.3;
  if (length(q - vec3(0.0, 0.55, 0.0)) - 0.85 < res.x / 0.3) {
    vec2 m = mushroom(q);
    if (m.x * 0.3 < res.x) { res = vec2(m.x * 0.3, m.y); gLocal = q; }
  }
  // Each detail is tested against a bound first. The bound never stands in for the real
  // distance, so it cannot darken a soft shadow.
  for (int i = 0; i < 5; i++) {
    vec3 up = normalize(PEBBLES[i].xyz);
    float size = PEBBLES[i].w;
    if (length(p - CENTRE - up * RADIUS) - 2.0 * size > res.x) continue;
    vec3 s = standing(p, up);
    float d = sdEllipsoid(s - vec3(0.0, size * 0.55, 0.0), vec3(1.0, 0.7, 0.85) * size);
    if (d < res.x) res = vec2(d, 5.0);
  }
  for (int i = 0; i < 12; i++) {
    vec3 up = normalize(TUFTS[i]);
    if (length(p - CENTRE - up * RADIUS) - 0.2 > res.x) continue;
    float d = tuft(standing(p, up), fract(float(i) * 0.37));
    if (d < res.x) res = vec2(d, 6.0);
  }
  return res;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.01;
  for (int i = 0; i < 40; i++) {
    float h = map(ro + rd * t).x;
    res = min(res, 5.0 * h / t);
    t += clamp(h, 0.01, 0.2);
    if (res < 0.002 || t > 3.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float occlusion(vec3 p, vec3 n) {
  float o = 0.0, w = 1.0;
  for (int i = 1; i <= 5; i++) {
    float h = 0.015 + 0.04 * float(i);
    o += (h - map(p + n * h).x) * w;
    w *= 0.7;
  }
  return clamp(1.0 - 2.5 * o, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 mushroomAlbedo(vec3 q, float part) {
  q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.42, 0.06, 0.035), vec3(0.70, 0.22, 0.06), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.86, 0.82, 0.72), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.85, 0.95, q.y));
  }
  if (part < 1.5) return vec3(0.82, 0.77, 0.66) * (0.7 + 0.3 * (0.5 + 0.5 * cos(atan(q.z, q.x) * 70.0)));
  return mix(vec3(0.72, 0.68, 0.6), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

// Short turf: patches of two greens, a fine speckle of blades, clover-dark hollows.
vec3 grassAlbedo(vec3 p) {
  vec3 d = p - CENTRE;
  float patches = noise(d * 3.0) * 0.6 + noise(d * 9.0) * 0.4;
  vec3 turf = mix(vec3(0.2, 0.33, 0.1), vec3(0.42, 0.52, 0.18), patches);
  float blades = noise(d * 90.0) * 0.6 + noise(d * 37.0) * 0.4;
  return turf * (0.75 + 0.45 * blades);
}

vec3 albedoOf(vec3 p, float part) {
  if (part < 3.5) return mushroomAlbedo(gLocal, part);
  if (part < 4.5) return grassAlbedo(p);
  if (part < 5.5) return mix(vec3(0.46, 0.44, 0.4), vec3(0.62, 0.58, 0.5), noise(p * 40.0));
  return vec3(0.42, 0.58, 0.18) * (0.7 + 0.3 * smoothstep(0.0, 0.1, length(p - CENTRE) - RADIUS));
}

// A pale afternoon sky with a few slow, soft clouds, laid out on the screen like a backdrop.
vec3 sky(vec2 uv) {
  vec3 col = mix(vec3(0.93, 0.89, 0.8), vec3(0.56, 0.7, 0.84), smoothstep(-0.5, 0.5, uv.y));
  col += vec3(0.1, 0.07, 0.02) * smoothstep(0.9, 0.0, length(uv - vec2(-0.6, 0.5)));
  vec2 c = uv * vec2(1.4, 3.0) + vec2(uTime * 0.01, 0.0);
  float cloud = noise(vec3(c * 2.0, 0.0)) * 0.6 + noise(vec3(c * 5.0, 1.0)) * 0.3 + noise(vec3(c * 11.0, 2.0)) * 0.1;
  return mix(col, vec3(0.97, 0.95, 0.92), smoothstep(0.55, 0.8, cloud) * 0.6);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 target = vec3(0.0, -0.16, 0.0);
  vec3 ro = target + vec3(0.0, 0.33, 0.94) * 7.3;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + FOCAL * fw);

  // The planet turns under a fixed camera and light, so the world is spun the other way.
  mat2 spin = rotation(uTime * 0.12);
  ro.xz = spin * ro.xz;
  rd.xz = spin * rd.xz;
  vec3 key = normalize(KEY);
  key.xz = spin * key.xz;

  vec3 col = sky(uv);
  // Bounding sphere around the planet and both mushrooms.
  vec3 oc = ro - vec3(0.0, -0.4, 0.0);
  float b = dot(oc, rd), c = dot(oc, oc) - 1.6 * 1.6;
  float disc = b * b - c;
  if (disc > 0.0) {
    float t = max(-b - sqrt(disc), 0.0), far = -b + sqrt(disc);
    vec2 hit = vec2(-1.0);
    for (int i = 0; i < 100; i++) {
      vec2 m = map(ro + rd * t);
      if (m.x < 0.0003 * t) { hit = vec2(t, m.y); break; }
      t += m.x;
      if (t > far) break;
    }
    if (hit.x > 0.0) {
      vec3 p = ro + rd * hit.x;
      vec3 n = normalAt(p);
      map(p);
      float shadow = softShadow(p + n * 0.003, key);
      float ao = occlusion(p, n);
      vec3 albedo = albedoOf(p, hit.y);
      vec3 sphereUp = normalize(p - CENTRE);
      float diff = clamp((dot(n, key) + 0.2) / 1.2, 0.0, 1.0) * shadow;
      float skyFill = 0.6 + 0.4 * dot(n, sphereUp);
      vec3 lit = albedo * (KEYLIGHT * diff * 1.3 + SKYLIGHT * skyFill * 0.65 * ao);
      vec3 h = normalize(key - rd);
      float gloss = hit.y < 0.5 ? 0.12 : hit.y > 4.5 && hit.y < 5.5 ? 0.08 : 0.02;
      lit += KEYLIGHT * pow(max(dot(n, h), 0.0), 20.0) * shadow * gloss;
      // Turf and blades are soft-edged: light catches their fuzz at grazing angles.
      float fuzz = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
      if (hit.y > 3.5 && hit.y < 4.5 || hit.y > 5.5) lit += vec3(0.5, 0.6, 0.35) * fuzz * 0.35 * ao;
      else lit += SKYLIGHT * fuzz * 0.15 * ao;
      col = lit;
    }
  }

  col *= 1.0 - 0.2 * dot(uv, uv);
  col = pow(col, vec3(0.92));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.01;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uniform = (name) => gl.getUniformLocation(program, name);
const uResolution = uniform('uResolution');
const uTime = uniform('uTime');

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

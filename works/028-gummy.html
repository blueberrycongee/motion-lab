<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gummy</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bccab8; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 LIGHT = vec3(0.5, 1.0, -0.65);      // a warm backlight, so the candy glows
const vec3 FILL = vec3(-0.7, 0.5, 0.6);
const vec3 BOUNDS_CENTER = vec3(0.0, 0.56, 0.0);
const float BOUNDS_RADIUS = 0.8;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x),
                 mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
                 mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// Jelly wobble: the base stays planted while the cap sways and the body squashes,
// keeping its volume. Two incommensurate sways keep the motion from looping visibly.
vec3 wobble(vec3 p) {
  float t = uTime;
  vec2 sway = vec2(sin(t * 2.3), sin(t * 1.9 + 1.2)) * (0.035 + 0.02 * sin(t * 0.41));
  float squash = 1.0 + 0.025 * sin(t * 4.1 + 0.6);
  p.xz -= sway * pow(clamp(p.y / 1.1, 0.0, 1.2), 2.0);
  return vec3(p.x * sqrt(squash), p.y / squash, p.z * sqrt(squash));
}

vec2 map(vec3 p) {
  vec2 m = mushroom(wobble(p));
  return vec2(m.x * 0.85, m.y);
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

vec2 march(vec3 ro, vec3 rd) {
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float h = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (h < 0.0) return vec2(-1.0);
  float t = max(-b - sqrt(h), 0.0), tFar = -b + sqrt(h);
  for (int i = 0; i < 96; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0005) return vec2(t, m.y);
    t += m.x;
    if (t > tFar) break;
  }
  return vec2(-1.0);
}

// How much candy lies between a point and the light.
float depthToward(vec3 p, vec3 dir) {
  float t = 0.01;
  for (int i = 0; i < 28; i++) {
    float d = -map(p + dir * t).x;
    if (d < 0.001) break;
    t += max(d, 0.01);
  }
  return t;
}

// Cream foam warts, like the white half of a two-layer gummy.
float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.2, 0.26, d);
}

// Beer–Lambert extinction inside the candy: clear cherry gelatin for the cap, milky for the
// stem, and dense cream foam for the warts.
vec3 extinction(float part, float foam) {
  vec3 sigma = part < 1.5 ? vec3(0.7, 7.0, 6.0) : vec3(2.4, 3.4, 6.0);
  return mix(sigma, vec3(5.0, 5.4, 6.5), foam);
}

// Colour of light scattered back out just under the surface.
vec3 albedo(float part, float foam) {
  vec3 base = part < 1.5 ? vec3(0.72, 0.05, 0.06) : vec3(0.82, 0.62, 0.36);
  return mix(base, vec3(0.95, 0.9, 0.8), foam);
}

// Sugar crystals: one per cell on a fine grid, each with its own facet tilt.
// Returns coverage and a glint for the given half vector.
vec2 sugar(vec3 p, vec3 n, vec3 h) {
  vec3 g = p * 130.0;
  vec3 cell = floor(g);
  vec3 jitter = vec3(hash(cell), hash(cell + 3.1), hash(cell + 5.7));
  float settled = smoothstep(-0.2, 0.6, n.y) * smoothstep(0.3, 0.7, noise(p * 7.0));
  float crystal = smoothstep(0.42, 0.25, length(fract(g) - jitter)) * step(0.35, hash(cell + 9.2)) * settled;
  vec3 facet = normalize(n + (jitter - 0.5) * 1.5);
  return vec2(crystal, pow(max(dot(facet, h), 0.0), 90.0) * crystal);
}

vec3 shadeCandy(vec3 p, vec3 rd, float part) {
  vec3 n = normalAt(p);
  vec3 l = normalize(LIGHT), fill = normalize(FILL);
  vec3 q = wobble(p);
  q.x -= 0.05 * q.y * q.y;
  float foam = part < 0.5 ? warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2) : 0.0;
  vec3 sigma = extinction(part, foam);
  vec3 body = albedo(part, foam);
  vec3 key = vec3(1.25, 1.12, 0.95);

  // The paper seen through the candy, and backlight that crossed it to reach the eye.
  float facing = max(dot(n, l), 0.0);
  float shaded = smoothstep(0.1, -0.4, dot(n, l));
  vec3 seen = exp(-sigma * depthToward(p - n * 0.004, refract(rd, n, 0.7))) * vec3(0.75, 0.82, 0.72);
  float forward = 0.5 + 0.9 * pow(max(dot(rd, l) + 0.3, 0.0), 2.0);
  vec3 transmitted = exp(-sigma * depthToward(p - n * 0.004, l)) * key * forward * shaded;

  // Light scattered back out near the surface.
  float wrap = max(dot(n, fill) + 0.4, 0.0) / 1.4;
  vec3 scattered = body * (key * facing * 0.7 + vec3(0.5, 0.53, 0.55) * wrap + vec3(0.2, 0.24, 0.2) * (0.5 + 0.5 * n.y));
  vec3 col = scattered * (0.6 + 0.6 * foam) + seen + transmitted;

  vec2 dust = sugar(q, n, normalize(l - rd));
  col = mix(col, vec3(0.95, 0.93, 0.88) * (0.5 + 0.4 * wrap + 0.3 * facing), dust.x * 0.6);
  vec3 h = normalize(fill - rd);
  float gloss = pow(max(dot(n, h), 0.0), 70.0) * 0.45 + pow(1.0 - max(dot(-rd, n), 0.0), 4.0) * 0.18;
  return col + gloss * (1.0 - dust.x) + vec3(1.2, 1.15, 1.0) * dust.y;
}

// Backlight on the paper, filtered through the candy. Extinction is gathered along the whole
// light ray across a soft boundary that widens with distance, as from a broad light, so the
// coloured shadow deepens where the candy is thick and fades out at its thin edges.
vec3 lightOnFloor(vec3 p) {
  vec3 l = normalize(LIGHT);
  vec3 oc = p - BOUNDS_CENTER;
  float b = dot(oc, l);
  float h = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (h < 0.0) return vec3(1.0);
  float t0 = max(-b - sqrt(h), 0.0), dt = (-b + sqrt(h) - t0) / 40.0;
  float t = t0 + dt * hash(p * 517.0);           // a jittered start hides the step pattern
  vec3 depth = vec3(0.0);
  for (int i = 0; i < 40; i++) {
    vec2 m = map(p + l * t);
    float soft = 0.01 + 0.05 * t;
    depth += extinction(m.y, 0.0) * dt * smoothstep(soft, -soft, m.x);
    t += dt;
  }
  return exp(-0.8 * depth);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 ro = vec3(-1.0, 1.2, 3.4);
  vec3 target = vec3(0.0, 0.5, 0.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.9 * fw);

  // Sage paper sweep; the floor never meets a visible horizon.
  vec3 paper = vec3(0.7, 0.77, 0.68);
  vec3 col = paper * (0.95 + 0.2 * uv.y);
  if (rd.y < 0.0) {
    vec3 p = ro + rd * (-ro.y / rd.y);
    float contact = smoothstep(0.0, 0.15, map(p + vec3(0.0, 0.05, 0.0)).x);
    vec3 lit = paper * (0.55 + 0.5 * lightOnFloor(p)) * (0.7 + 0.3 * contact);
    col = mix(lit, col, smoothstep(1.5, 4.0, length(p.xz)));
  }
  vec2 hit = march(ro, rd);
  if (hit.x > 0.0) col = shadeCandy(ro + rd * hit.x, rd, hit.y);

  col *= 1.0 - 0.25 * dot(uv, uv);
  col = pow(col, vec3(0.92));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.012;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1b19; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
// The broadcast picture: 240 visible lines, sampled 320 times along each line.
const LINE_SAMPLES = 320;
const LINES = 240;

const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// Pass 1: the signal, in tube coordinates. On a tall viewport the set is
// mounted on its side like a vertical arcade monitor, so the picture is
// rendered rotated and the scanlines end up running vertically.
const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uRotated;
uniform float uYaw;
out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (p.y < m.x) m = vec2(p.y, 4.0);
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.15);
    if (res < 0.002 || t > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 material(vec3 p, vec3 n, float part) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.43, 0.07, 0.04), vec3(0.72, 0.2, 0.1), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.94, 0.91, 0.84), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) return vec3(0.82, 0.78, 0.68) * (0.75 + 0.25 * cos(atan(q.z, q.x) * 70.0));
  return mix(vec3(0.78, 0.75, 0.68), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

void main() {
  vec2 c = gl_FragCoord.xy - 0.5 * uResolution;
  // Mounted on its side the picture is width-limited, so it is framed tighter.
  vec2 uv = uRotated > 0.5 ? vec2(-c.y, c.x) / (uResolution.y * 1.3) : c / uResolution.y;
  vec3 target = vec3(0.0, 0.55, 0.0);
  vec3 ro = target + vec3(sin(uYaw), 0.22, cos(uYaw)) * 3.4;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.0 * fw);

  // A studio cyclorama in dusty teal.
  vec3 col = mix(vec3(0.15, 0.27, 0.27), vec3(0.36, 0.48, 0.45), smoothstep(-0.4, 0.5, uv.y));
  float t = 0.0;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 90; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.001 * t) { hit = vec2(t, m.y); break; }
    t += m.x;
    if (t > 7.0) break;
  }

  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    // The mushroom turns under a light that stays put, upper left of the camera.
    vec3 key = normalize(-0.8 * rt + vec3(0.0, 0.55, 0.0) + 0.3 * vec3(sin(uYaw), 0.0, cos(uYaw)));
    float shadow = softShadow(p + n * 0.003, key);
    if (hit.y > 3.5) {
      col *= mix(0.5 + 0.5 * shadow, 1.0, smoothstep(0.2, 1.6, length(p.xz)));
    } else {
      vec3 albedo = material(p, n, hit.y);
      float diff = max(dot(n, key), 0.0) * shadow;
      // The stem sits in the cap's shadow; wrapped light keeps it from sinking into the backdrop.
      if (hit.y > 1.5) diff = max(diff, 0.6 * (0.5 + 0.5 * dot(n, key)) * mix(0.6, 1.0, shadow));
      float fill = 0.5 + 0.5 * n.y;
      float bounce = clamp(0.6 - 0.4 * n.y, 0.0, 1.0);
      col = albedo * (vec3(1.05, 1.0, 0.92) * diff * 1.15 + vec3(0.5, 0.64, 0.64) * fill * 0.7
                      + vec3(0.55, 0.62, 0.58) * bounce * 0.6);
    }
  }
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

// Pass 2: the tube. The beam draws each line as a soft gaussian that swells
// with brightness, through stripes of RGB phosphor, on curved glass.
const tubeFragment = `#version 300 es
precision highp float;
uniform sampler2D uSignal;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const float LINES = ${LINES}.0;
const float CURVE = 0.07;
const vec3 GLASS = vec3(0.032, 0.036, 0.034);
const vec3 PLASTIC = vec3(0.16, 0.15, 0.14);

float hash(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

float roundedBox(vec2 p, vec2 halfSize, float radius) {
  vec2 d = abs(p) - halfSize + radius;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - radius;
}

// One line's contribution at distance d (in lines) from its centre.
vec3 beam(vec3 color, float d) {
  float sigma = mix(0.2, 0.38, dot(color, vec3(0.3, 0.5, 0.2)));
  return color * exp(-0.5 * d * d / (sigma * sigma)) / (sigma * 2.5066);
}

vec3 signalAt(vec2 uv, float lod) {
  return textureLod(uSignal, uv, lod).rgb;
}

// The vertical hold slips every so often and the picture rolls one frame.
float rollAt(float time) {
  return smoothstep(0.0, 1.0, clamp((mod(time, 9.0) - 6.0) / 1.6, 0.0, 1.0));
}

// An aperture grille: unbroken vertical phosphor stripes, so the scanlines stay legible.
vec3 apertureGrille(float x, float triad) {
  vec3 mask = vec3(0.3);
  mask[int(fract(x / triad) * 3.0)] = 1.0;
  return mask * 1.75;
}

void main() {
  bool rotated = uResolution.x < uResolution.y;
  vec2 aspect = rotated ? vec2(3.0, 4.0) : vec2(4.0, 3.0);
  float scale = min(uResolution.x * 0.9 / aspect.x, uResolution.y * 0.9 / aspect.y);
  vec2 tube = aspect * scale;
  float shortSide = 3.0 * scale;
  vec2 d = gl_FragCoord.xy - 0.5 * uResolution;

  // The bezel opening is a flat rounded rectangle; the room light falls off around it.
  float edge = roundedBox(d, 0.5 * tube, 0.07 * shortSide);
  if (edge > 0.0) {
    float lip = smoothstep(0.03 * shortSide, 0.0, edge);
    float room = 1.0 - 0.45 * length(d / uResolution);
    vec3 plastic = PLASTIC * room * (0.9 + 0.2 * gl_FragCoord.y / uResolution.y) + lip * 0.035;
    outColor = vec4(plastic, 1.0);
    return;
  }

  // Tube coordinates: u runs along the lines, v across them, both -1..1.
  vec2 tubePx = rotated ? vec2(d.y, -d.x) : d;
  vec2 t = tubePx / (0.5 * vec2(4.0, 3.0) * scale);
  t *= 1.0 + CURVE * dot(t, t);
  vec2 uv = 0.5 + 0.5 * t;

  float roll = rollAt(uTime);
  float rolling = 4.0 * roll * (1.0 - roll);
  // While the frame rolls, horizontal sync wavers too.
  uv.x += 0.006 * rolling * sin(uv.y * 40.0 + uTime * 25.0);
  // A rolling frame shows the vertical blanking interval as a black bar.
  float frameV = mod(uv.y + roll * 1.08, 1.08);
  float blank = smoothstep(1.0, 0.995, frameV) * smoothstep(0.0, 0.005, frameV);

  vec3 col = vec3(0.0);
  if (all(greaterThan(uv, vec2(0.0))) && all(lessThan(uv, vec2(1.0)))) {
    float line = frameV * LINES - 0.5;
    float base = floor(line);
    float within = line - base;
    vec3 upper = signalAt(vec2(uv.x, (base + 1.5) / LINES), 0.0);
    vec3 lower = signalAt(vec2(uv.x, (base + 0.5) / LINES), 0.0);
    vec3 lines = beam(lower, within) + beam(upper, 1.0 - within);
    // When the lines are finer than the display can show, the picture reads as flat.
    float lineGap = shortSide / LINES;
    vec3 blended = signalAt(vec2(uv.x, frameV), 0.0);
    col = mix(blended, lines, smoothstep(1.5, 3.0, lineGap)) * blank;

    // Halation: light scattering in the thick faceplate glass.
    col += (signalAt(vec2(uv.x, frameV), 3.0) * 0.12 + signalAt(vec2(uv.x, frameV), 5.0) * 0.08) * blank;
    // A mains hum bar crawls slowly up the picture.
    col *= 1.0 - 0.06 * (0.5 + 0.5 * sin((uv.y - uTime * 0.11) * 6.2832));
    col *= pow(16.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y), 0.18);
    col *= smoothstep(0.0, 0.004, min(min(uv.x, uv.y), min(1.0 - uv.x, 1.0 - uv.y)));
    col += (hash(gl_FragCoord.xy + fract(uTime) * 91.0) - 0.5) * 0.025;

    float triad = max(3.0, floor(shortSide / 260.0));
    col *= mix(vec3(1.0), apertureGrille(tubePx.x + 4096.0, triad), smoothstep(300.0, 520.0, shortSide));
  }

  // The faceplate: dark glass, an inner shadow from the bezel and a faint window reflection.
  vec2 q = d / (0.5 * tube);
  float reflection = smoothstep(0.5, 0.0, abs(q.x * 0.6 + q.y - 0.9)) * smoothstep(-0.2, 0.6, q.y) * 0.03;
  col = GLASS + max(col, 0.0) + reflection;
  col *= smoothstep(-0.02 * shortSide, 0.0, -edge) * 0.5 + 0.5;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(fragment) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
  gl.bindAttribLocation(program, 0, 'position');
  gl.linkProgram(program);
  const uniforms = {};
  for (let i = 0; i < gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS); i++) {
    const { name } = gl.getActiveUniform(program, i);
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return { program, uniforms };
}

const scene = createProgram(sceneFragment);
const tube = createProgram(tubeFragment);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// The signal keeps a mip chain so the tube can sample it blurred for halation.
const signal = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, signal);
gl.texStorage2D(gl.TEXTURE_2D, 1 + Math.floor(Math.log2(LINE_SAMPLES)), gl.RGBA8, LINE_SAMPLES, LINES);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const signalBuffer = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, signalBuffer);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, signal, 0);

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}

function frame(ms) {
  resize();
  const seconds = ms / 1000;

  gl.bindFramebuffer(gl.FRAMEBUFFER, signalBuffer);
  gl.viewport(0, 0, LINE_SAMPLES, LINES);
  gl.useProgram(scene.program);
  gl.uniform2f(scene.uniforms.uResolution, LINE_SAMPLES, LINES);
  gl.uniform1f(scene.uniforms.uRotated, canvas.width < canvas.height ? 1 : 0);
  gl.uniform1f(scene.uniforms.uYaw, 0.6 + seconds * 0.3);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindTexture(gl.TEXTURE_2D, signal);
  gl.generateMipmap(gl.TEXTURE_2D);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(tube.program);
  gl.uniform2f(tube.uniforms.uResolution, canvas.width, canvas.height);
  gl.uniform1f(tube.uniforms.uTime, seconds);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holo Card</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #121311; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2', { antialias: true });

// ---- Card face ---------------------------------------------------------------
// The face is painted twice with the same geometry: once in colour, and once as
// a material mask (R = laser foil, G = gloss, B = emboss height).

const W = 1008, H = 1408;
const ART_WINDOW = { x: 76, y: 172, w: W - 152, h: H - 172 - 76 };

function paint(layer) {
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d');
  const art = layer === 'art';
  const pick = (color, mask) => (art ? color : mask);
  const mask = (r, g, b) => `rgb(${r * 255}, ${g * 255}, ${b * 255})`;
  const gold = pick('#d3b06c', mask(0.2, 1, 1));

  // Matte frame perforated with laser-cut holes, larger towards the corners,
  // that expose the foil underneath.
  ctx.fillStyle = pick('#18211b', mask(0, 0.35, 0));
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = pick('#c9cdbf', mask(1, 1, 0));
  const step = 26;
  for (let y = 0; y < H + step; y += step * 0.866) {
    const row = Math.round(y / (step * 0.866));
    for (let x = (row % 2) * step / 2; x < W + step; x += step) {
      const edge = Math.hypot((x - W / 2) / W, (y - H / 2) / H);
      ctx.beginPath();
      ctx.arc(x, y, 2 + 9 * Math.min(edge * 1.5, 1) ** 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.lineWidth = 6;
  ctx.strokeStyle = gold;
  roundRect(ctx, 30, 30, W - 60, H - 60, 30);
  ctx.stroke();

  panel(ctx, 60, 64, W - 120, 92, pick('#101712', mask(0, 0.45, 0)), gold);
  ctx.font = '600 50px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = pick('#ead9ae', mask(0.3, 1, 1));
  ctx.fillText('Fly Agaric', 96, 112);

  // Illustration: the mushroom against a low sun in a mossy clearing.
  const { x, y, w, h } = ART_WINDOW;
  const groundY = y + h * 0.84, sunX = x + w / 2, sunY = y + h * 0.42;
  ctx.save();
  roundRect(ctx, x, y, w, h, 10);
  ctx.clip();
  if (art) {
    const sky = ctx.createLinearGradient(0, y, 0, groundY);
    sky.addColorStop(0, '#0e2224');
    sky.addColorStop(0.55, '#2c4636');
    sky.addColorStop(1, '#c98b4c');
    ctx.fillStyle = sky;
  } else {
    ctx.fillStyle = mask(0.18, 0.8, 0);
  }
  ctx.fillRect(x, y, w, h);

  const glow = art ? ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 300) : null;
  glow?.addColorStop(0, 'rgba(255, 228, 170, 0.9)');
  glow?.addColorStop(1, 'rgba(255, 200, 120, 0)');
  ctx.fillStyle = pick(glow, mask(0.55, 1, 0));
  ctx.beginPath();
  ctx.arc(sunX, sunY, 300, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = pick('rgba(255, 222, 170, 0.45)', mask(1, 1, 0.6));
  for (const r of [340, 384]) {
    ctx.beginPath();
    ctx.arc(sunX, sunY, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Fireflies are foil, so they flash as the card turns.
  let seed = 7;
  const random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  ctx.fillStyle = pick('#ffe7a8', mask(1, 1, 0.7));
  for (let i = 0; i < 40; i++) {
    ctx.beginPath();
    ctx.arc(x + random() * w, y + random() * h * 0.75, 2 + random() * 4, 0, Math.PI * 2);
    ctx.fill();
  }

  hills(ctx, x, y + h, w, y + h - groundY + 60, 0.9, pick('#22382a', mask(0, 0.5, 0)));
  hills(ctx, x, y + h, w, y + h - groundY + 10, 2.3, pick('#13211a', mask(0, 0.5, 0)));

  const parts = mushroomPaths();
  ctx.save();
  ctx.translate(sunX - 12, groundY);
  ctx.scale(480, -480);
  const body = (color, height) => pick(color, mask(0, 0.75, height));
  ctx.fillStyle = body(art ? stemShade(ctx) : null, 0.45);
  ctx.fill(parts.stem);
  ctx.fillStyle = body('#d6ccb6', 0.55);
  ctx.fill(parts.ring);
  ctx.fillStyle = body('#b7a685', 0.5);
  ctx.fill(parts.gills);
  ctx.fillStyle = body(art ? capShade(ctx) : null, 0.65);
  ctx.fill(parts.cap);
  ctx.fillStyle = pick('#efe7d6', mask(1, 1, 0.9));
  for (const spot of parts.spots) ctx.fill(spot);
  ctx.restore();
  ctx.restore();

  ctx.lineWidth = 6;
  ctx.strokeStyle = gold;
  roundRect(ctx, x, y, w, h, 10);
  ctx.stroke();

  return c;
}

// Shading in mushroom units: the sun sits behind, so edges glow and faces fall dark.
function capShade(ctx) {
  const g = ctx.createLinearGradient(0, 1.11, 0, 0.82);
  g.addColorStop(0, '#7c170c');
  g.addColorStop(1, '#c43a1c');
  return g;
}

function stemShade(ctx) {
  const g = ctx.createLinearGradient(-0.18, 0, 0.18, 0);
  g.addColorStop(0, '#f2ead6');
  g.addColorStop(0.5, '#cfc5ae');
  g.addColorStop(1, '#8f8670');
  return g;
}

// The canonical mushroom in profile, in mushroom units: y up, ground at 0.
function mushroomPaths() {
  const lean = (y) => 0.05 * y * y;
  const stemR = (y) => 0.085 + 0.025 * (1 - y / 0.86) + 0.065 * Math.exp(-y * 9);
  const outline = (y0, y1, radius) => {
    const path = new Path2D();
    const n = 32;
    for (let i = 0; i <= n; i++) {
      const y = y0 + (y1 - y0) * (i / n);
      path.lineTo(lean(y) + radius(y), y);
    }
    for (let i = n; i >= 0; i--) {
      const y = y0 + (y1 - y0) * (i / n);
      path.lineTo(lean(y) - radius(y), y);
    }
    path.closePath();
    return path;
  };
  const stem = outline(0, 0.86, stemR);
  const ring = outline(0.555, 0.655, (y) => 0.096 + (0.66 - y) * 0.32);

  const cx = lean(0.8), a = Math.asin(0.02 / 0.31);
  const cap = new Path2D();
  cap.ellipse(cx, 0.8, 0.56, 0.31, 0, a, Math.PI - a);
  cap.quadraticCurveTo(cx, 0.86, cx + 0.559, 0.82);
  cap.closePath();

  const gills = new Path2D();
  gills.moveTo(cx - 0.55, 0.822);
  gills.quadraticCurveTo(cx, 0.862, cx + 0.55, 0.822);
  gills.lineTo(cx + 0.52, 0.8);
  gills.quadraticCurveTo(cx, 0.83, cx - 0.52, 0.8);
  gills.closePath();

  const spots = [
    [-0.02, 1.07, 0.03], [0.17, 1.05, 0.026], [-0.22, 1.03, 0.028], [0.33, 0.99, 0.03],
    [-0.38, 0.96, 0.024], [0.06, 0.99, 0.034], [-0.12, 0.94, 0.022], [0.22, 0.93, 0.025],
    [0.44, 0.9, 0.02], [-0.47, 0.88, 0.018], [-0.28, 0.89, 0.026], [0.1, 0.88, 0.02],
    [0.34, 0.875, 0.017], [-0.06, 0.88, 0.016],
  ].map(([x, y, r]) => {
    const path = new Path2D();
    path.ellipse(cx + x, y, r, r * 0.8, 0, 0, Math.PI * 2);
    return path;
  });
  return { cap, gills, stem, ring, spots };
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function panel(ctx, x, y, w, h, fill, stroke) {
  roundRect(ctx, x, y, w, h, 12);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = stroke;
  ctx.stroke();
}

function hills(ctx, x, base, w, height, seed, fill) {
  ctx.beginPath();
  ctx.moveTo(x, base);
  for (let i = 0; i <= 60; i++) {
    const t = i / 60;
    const n = Math.sin(t * 7 + seed) * 0.5 + Math.sin(t * 17 + seed * 3) * 0.25 + Math.sin(t * 31 + seed) * 0.1;
    ctx.lineTo(x + t * w, base - height * (0.85 + 0.15 * n));
  }
  ctx.lineTo(x + w, base);
  ctx.fillStyle = fill;
  ctx.fill();
}

// ---- Renderer ------------------------------------------------------------------

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform vec2 uTilt;
uniform sampler2D uArt;
uniform sampler2D uMask;
out vec4 outColor;

const vec2 CARD = vec2(0.63, 0.88);
const float CORNER = 0.03;
const vec3 CAMERA = vec3(0.0, 0.0, 2.6);
const vec3 LAMP = vec3(0.2, 0.3, 1.0);

mat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1, 0, 0, 0, c, s, 0, -s, c); }
mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0, -s, 0, 1, 0, s, 0, c); }

float roundedBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

vec3 spectrum(float x) {
  return 0.5 + 0.5 * cos(6.28318 * (x + vec3(0.0, 0.33, 0.67)));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;

  // Backdrop with a soft contact shadow that slides opposite the tilt.
  vec3 col = mix(vec3(0.06, 0.065, 0.06), vec3(0.13, 0.135, 0.125), smoothstep(-0.7, 0.6, uv.y));
  float shadow = roundedBox(uv - vec2(-uTilt.y, uTilt.x) * 0.05 - vec2(0.015, -0.03), CARD * 0.42, CORNER);
  col *= 1.0 - 0.6 * (1.0 - smoothstep(-0.03, 0.10, shadow));

  // Intersect the view ray with the tilted card plane.
  mat3 toWorld = rotY(uTilt.y) * rotX(uTilt.x);
  mat3 toCard = transpose(toWorld);
  vec3 rd = normalize(vec3(uv, -2.25));
  vec3 o = toCard * CAMERA, d = toCard * rd;
  vec3 hit = o + d * (-o.z / d.z);
  vec2 p = hit.xy;
  float sd = roundedBox(p, CARD * 0.5, CORNER);
  float coverage = 1.0 - smoothstep(-fwidth(sd), fwidth(sd), sd);

  vec2 tuv = vec2(p.x / CARD.x + 0.5, 0.5 - p.y / CARD.y);
  vec3 art = texture(uArt, tuv).rgb;
  vec4 m = texture(uMask, tuv);

  // Emboss: height in the mask's blue channel bends the normal.
  vec2 texel = 2.0 / vec2(textureSize(uMask, 0));
  float hx = texture(uMask, tuv + vec2(texel.x, 0)).b - texture(uMask, tuv - vec2(texel.x, 0)).b;
  float hy = texture(uMask, tuv - vec2(0, texel.y)).b - texture(uMask, tuv + vec2(0, texel.y)).b;
  vec3 nCard = normalize(vec3(-hx, -hy, 1.0) * vec3(0.9, 0.9, 1.0));

  vec3 worldPos = toWorld * vec3(p, 0.0);
  vec3 N = toWorld * nCard;
  vec3 V = normalize(CAMERA - worldPos);
  vec3 L = normalize(LAMP - worldPos);
  vec3 Hv = normalize(L + V);
  vec3 h = toCard * Hv;  // half vector in card space drives the diffraction

  // Laser foil: rainbow bands from the grating angle, plus glitter facets.
  vec2 grid = tuv * vec2(160.0, 224.0);
  vec2 cell = floor(grid);
  float jitter = hash(cell);
  float hue = h.x * 3.2 + h.y * 2.1 + (tuv.x + tuv.y) * 0.7 + jitter * 0.06;
  float band = 0.55 + 0.45 * cos((h.x - h.y) * 14.0 + (tuv.x - tuv.y) * 6.0);
  vec3 foil = spectrum(hue) * band * 1.15;
  vec3 facet = normalize(vec3(vec2(hash(cell + 3.1), hash(cell + 7.7)) - 0.5, 1.6));
  float glint = pow(max(dot(facet, h), 0.0), 260.0) * smoothstep(0.5, 0.15, length(fract(grid) - 0.5))
    * smoothstep(0.6, 1.0, m.r);
  float foilAmount = m.r;
  vec3 face = mix(art, art * 0.35 + foil, foilAmount);
  face += glint * foilAmount * vec3(1.0, 0.97, 0.92) * 2.2;

  // Raised gold catches light on its bevels.
  face *= 1.0 + (dot(N, L) - dot(toWorld * vec3(0, 0, 1), L)) * 2.5;

  // Glare: a sharp lamp reflection and a broad sheen, scaled by gloss.
  float nh = max(dot(N, Hv), 0.0);
  face += (pow(nh, 120.0) * 0.5 + pow(nh, 16.0) * 0.22) * m.g;

  col = mix(col, face, coverage);
  outColor = vec4(pow(col, vec3(0.95)), 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

function upload(unit, source, name) {
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(gl.getUniformLocation(program, name), unit);
}
upload(0, paint('art'), 'uArt');
upload(1, paint('mask'), 'uMask');

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTilt = gl.getUniformLocation(program, 'uTilt');

// Follow the pointer; when it rests or leaves, the card sways on its own.
const tilt = { x: 0, y: 0 };
let target = null, lastMove = -Infinity;
addEventListener('pointermove', (event) => {
  target = { x: (event.clientY / innerHeight - 0.5) * 0.8, y: (event.clientX / innerWidth - 0.5) * 1.0 };
  lastMove = performance.now();
});
document.documentElement.addEventListener('pointerleave', () => (target = null));

function frame(ms) {
  const t = ms / 1000;
  const idle = !target || ms - lastMove > 3000;
  const goal = idle ? { x: Math.sin(t * 0.53 + 1) * 0.22, y: Math.sin(t * 0.71) * 0.38 } : target;
  const ease = idle ? 0.04 : 0.12;
  tilt.x += (goal.x - tilt.x) * ease;
  tilt.y += (goal.y - tilt.y) * ease;

  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform2f(uTilt, tilt.x, tilt.y);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

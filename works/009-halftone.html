<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halftone</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f1ece0; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// Pass 1: the lit mushroom as continuous tone, the "original" that gets screened.
const sceneFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uYaw;
out vec4 outColor;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

vec2 map(vec3 p) {
  vec2 m = mushroom(p);
  if (p.y < m.x) m = vec2(p.y, 4.0);
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

float softShadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = mushroom(ro + rd * t).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.15);
    if (res < 0.002 || t > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float warts(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return 1.0 - smoothstep(0.18, 0.26, d);
}

vec3 material(vec3 p, vec3 n, float part) {
  vec3 q = p; q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) {
    vec3 cap = mix(vec3(0.43, 0.07, 0.04), vec3(0.72, 0.2, 0.1), smoothstep(0.2, 0.56, r));
    return mix(cap, vec3(0.94, 0.91, 0.84), warts(q - vec3(0.0, 0.8, 0.0)) * smoothstep(0.0, 0.3, n.y + 0.2));
  }
  if (part < 1.5) return vec3(0.82, 0.78, 0.68) * (0.75 + 0.25 * cos(atan(q.z, q.x) * 70.0));
  return mix(vec3(0.78, 0.75, 0.68), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

// A pale sky over warm ground, both light enough to keep the paper showing.
vec3 backdrop(vec2 uv) {
  return mix(vec3(0.95, 0.84, 0.66), vec3(0.66, 0.84, 0.9), smoothstep(-0.25, 0.5, uv.y));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 target = vec3(0.0, 0.55, 0.0);
  vec3 ro = target + vec3(sin(uYaw), 0.22, cos(uYaw)) * 3.4;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 2.0 * fw);

  vec3 col = backdrop(uv);
  float t = 0.0;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 90; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0008 * t) { hit = vec2(t, m.y); break; }
    t += m.x;
    if (t > 7.0) break;
  }

  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    vec3 n = normalAt(p);
    // The mushroom turns under a light that stays put, upper left of the viewer.
    vec3 key = normalize(-0.8 * rt + vec3(0.0, 0.55, 0.0) + 0.3 * vec3(sin(uYaw), 0.0, cos(uYaw)));
    float shadow = softShadow(p + n * 0.003, key);
    if (hit.y > 3.5) {
      // The floor dissolves into the backdrop; only the cast shadow remains.
      col *= mix(0.55 + 0.45 * shadow, 1.0, smoothstep(0.2, 1.6, length(p.xz)));
    } else {
      vec3 albedo = material(p, n, hit.y);
      float diff = max(dot(n, key), 0.0) * shadow;
      float fill = 0.5 + 0.5 * n.y;
      float bounce = clamp(0.6 - 0.4 * n.y, 0.0, 1.0);
      float rim = pow(clamp(1.0 + dot(rd, n), 0.0, 1.0), 3.0);
      col = albedo * (vec3(1.05, 1.0, 0.92) * diff * 1.1 + vec3(0.62, 0.68, 0.74) * fill * 0.9
                      + vec3(0.85, 0.78, 0.66) * bounce * 0.8) + rim * 0.12;
    }
  }
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

// Pass 2: separate into CMYK and screen each plate at its classic angle, like a RIP.
const screenFragment = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 PAPER = vec3(0.95, 0.93, 0.88);
const vec3 CYAN = vec3(0.0, 0.62, 0.88);
const vec3 MAGENTA = vec3(0.86, 0.04, 0.47);
const vec3 YELLOW = vec3(1.0, 0.91, 0.0);
const vec3 BLACK = vec3(0.14, 0.13, 0.14);

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}

vec4 cmyk(vec3 rgb) {
  // Grey component replacement: black takes over the neutral only in the
  // shadows, so highlights stay clean colour dots, as a press would set it.
  float grey = 1.0 - max(max(rgb.r, rgb.g), rgb.b);
  float k = smoothstep(0.4, 1.0, grey) * 0.85;
  vec3 cmy = clamp((1.0 - rgb - k) / (1.0 - k), 0.0, 1.0);
  // Three overlapping tints darken more than their sum; hold the light tones back.
  return vec4(pow(cmy, vec3(1.35)), k);
}

// Ink coverage of one plate. The cosine spot grows round dots that join into a
// checkerboard at 50% and close into white holes towards 100%.
float plate(vec2 px, float angle, vec2 shift, int channel, float cell, float gain) {
  vec2 pos = px + shift;
  float tone = cmyk(texture(uScene, pos / uResolution).rgb)[channel];
  // Dot gain, then the press curve: the faintest dots never hold and the
  // deepest tones close up to solid.
  tone = (tone + gain * tone * (1.0 - tone)) * 1.12 - 0.06;
  float c = cos(angle), s = sin(angle);
  vec2 q = mat2(c, s, -s, c) * pos / cell;
  float spot = 0.5 - 0.25 * (cos(6.2831853 * q.x) + cos(6.2831853 * q.y));
  spot += (noise(pos * 0.35) - 0.5) * 0.08;      // ragged dot edges on uncoated stock
  float edge = fwidth(spot) * 0.8;
  return smoothstep(spot - edge, spot + edge, tone);
}

void main() {
  vec2 px = gl_FragCoord.xy;
  float unit = min(uResolution.x, uResolution.y);
  float cell = unit / 84.0;

  // Dot gain swells and settles in a slow wave from the centre of the sheet.
  vec2 uv = (px - 0.5 * uResolution) / unit;
  float gain = 0.25 * sin(uTime * 0.9 - length(uv) * 6.0);

  // Each plate sits slightly off register and drifts on its own.
  float r = unit * 0.0025;
  vec2 shiftC = r * vec2(sin(uTime * 0.31), cos(uTime * 0.23)) + vec2(r, 0.0);
  vec2 shiftM = r * vec2(cos(uTime * 0.27), sin(uTime * 0.35)) - vec2(0.0, r);
  vec2 shiftY = r * vec2(sin(uTime * 0.19 + 2.0), cos(uTime * 0.29)) * 1.6;

  float c = plate(px, radians(15.0), shiftC, 0, cell, gain);
  float m = plate(px, radians(75.0), shiftM, 1, cell, gain);
  float y = plate(px, radians(0.0), shiftY, 2, cell, gain);
  float k = plate(px, radians(45.0), vec2(0.0), 3, cell, gain);

  float fibre = noise(px * vec2(0.08, 0.6) / (unit / 900.0)) * 0.5 + noise(px * 0.02 / (unit / 900.0)) * 0.5;
  vec3 col = PAPER * (0.97 + 0.05 * fibre);
  col *= mix(vec3(1.0), CYAN, c * 0.92);
  col *= mix(vec3(1.0), MAGENTA, m * 0.9);
  col *= mix(vec3(1.0), YELLOW, y * 0.95);
  col *= mix(vec3(1.0), BLACK, k * 0.95);
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(fragment) {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
  gl.bindAttribLocation(program, 0, 'position');
  gl.linkProgram(program);
  return program;
}

const scene = createProgram(sceneFragment);
const screen = createProgram(screenFragment);
const sceneResolution = gl.getUniformLocation(scene, 'uResolution');
const sceneYaw = gl.getUniformLocation(scene, 'uYaw');
const screenResolution = gl.getUniformLocation(screen, 'uResolution');
const screenTime = gl.getUniformLocation(screen, 'uTime');

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// The continuous-tone original only needs to be finer than the halftone cells.
const sceneTexture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const sceneBuffer = gl.createFramebuffer();
const SCENE_SCALE = 0.3;

function resize() {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w;
  canvas.height = h;
  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, Math.ceil(w * SCENE_SCALE), Math.ceil(h * SCENE_SCALE), 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneBuffer);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTexture, 0);
}

function frame(ms) {
  resize();
  const t = ms / 1000;
  const { width: w, height: h } = canvas;

  const sw = Math.ceil(w * SCENE_SCALE), sh = Math.ceil(h * SCENE_SCALE);

  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneBuffer);
  gl.viewport(0, 0, sw, sh);
  gl.useProgram(scene);
  gl.uniform2f(sceneResolution, sw, sh);
  gl.uniform1f(sceneYaw, 0.6 + t * 0.15);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(screen);
  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.uniform2f(screenResolution, w, h);
  gl.uniform1f(screenTime, t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>

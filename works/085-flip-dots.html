<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip-Dots</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 35%, #4b5052, #33373a 80%);
  }
  .board {
    --p: min(calc(90vh / var(--rows)), calc(92vw / var(--cols)));
    display: grid; grid-template-columns: repeat(var(--cols), var(--p)); grid-auto-rows: var(--p);
    padding: calc(var(--p) * 0.8); border-radius: calc(var(--p) * 0.4);
    /* Each disc sits in a dark socket that shows when the disc turns edge-on. */
    background:
      radial-gradient(circle, #060606 0 43%, #0000 46%) calc(var(--p) * 0.8) calc(var(--p) * 0.8) / var(--p) var(--p),
      #141513;
    box-shadow: 0 0 0 calc(var(--p) * 0.25) #2a2c2b, 0 calc(var(--p) * 0.6) calc(var(--p) * 1.6) #12141566;
  }
  .dot {
    margin: 7%; border-radius: 50%;
    background-image: radial-gradient(circle at 34% 30%, #ffffff26, #0000 55%);
    box-shadow: 0 calc(var(--p) * 0.04) calc(var(--p) * 0.04) #0008;
  }
</style>
</head>
<body>
<div class="board"></div>
<script type="module">
const ROWS = 34;
const PITCH = 0.044;   // mushroom units per dot
const FPS = 12;
const CYCLE = 13;
const YELLOW = 'e9cf3c', BLACK = '242522';
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

// The canonical profile, sampled in mushroom units: y up, ground at 0, cap about 1.12 wide.
const SPOTS = [
  [-0.02, 1.07, 0.03], [0.17, 1.05, 0.026], [-0.22, 1.03, 0.028], [0.33, 0.99, 0.03],
  [-0.38, 0.96, 0.024], [0.06, 0.99, 0.034], [-0.12, 0.94, 0.022], [0.22, 0.93, 0.025],
  [0.44, 0.9, 0.02], [-0.47, 0.88, 0.018], [-0.28, 0.89, 0.026], [0.1, 0.88, 0.02],
  [0.34, 0.875, 0.017], [-0.06, 0.88, 0.016],
];

function ellipse(px, py, rx, ry) {
  const k0 = Math.hypot(px / rx, py / ry);
  const k1 = Math.hypot(px / (rx * rx), py / (ry * ry));
  return k0 * (k0 - 1) / k1;
}

// Whether the disc at (x0, y) is yellow. Warts and the gills are left as black holes.
function litAt(x0, y) {
  const x = x0 - 0.05 * y * y;
  const r = Math.abs(x);
  const under = 0.82 + 0.02 * (1 - Math.min(r * r / 0.3125, 1));
  if (Math.max(ellipse(x, y - 0.8, 0.56, 0.31), under - y) < 0) {
    return !SPOTS.some(([sx, sy, sr]) => ((x0 - 0.032 - sx) / sr) ** 2 + ((y - sy) / (sr * 0.8)) ** 2 < 1.6);
  }
  const gillTop = 0.8 + 0.015 * (1 - Math.min(r * r / 0.27, 1)) - PITCH * 0.5;
  if (Math.max(r - 0.55, y - under, gillTop - y) < 0) return false;
  const ring = Math.max(r - 0.096 - (0.66 - y) * 0.32, Math.abs(y - 0.605) - 0.05);
  const stemR = 0.085 + 0.025 * (1 - y / 0.86) + 0.065 * Math.exp(-y * 9);
  return Math.min(ring, Math.max(r - stemR, Math.abs(y - 0.43) - 0.43)) < 0;
}

const smooth = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p));

// Squash, stretch and lift for two hops; the base stays planted while it gathers and lands.
function hop(t) {
  if (calm || t < 4.6 || t >= 7.6) return { sx: 1, sy: 1, lift: 0 };
  const u = (t - 4.6) % 1.5;
  if (u < 0.3) {
    const k = smooth(u / 0.3);
    return { sx: 1 + 0.08 * k, sy: 1 - 0.14 * k, lift: 0 };
  }
  if (u < 0.85) {
    const a = (u - 0.3) / 0.55;
    const sy = 1.1 - 0.1 * a;
    return { sx: 1 / Math.sqrt(sy), sy, lift: 0.17 * 4 * a * (1 - a) };
  }
  const b = Math.min(1, (u - 0.85) / 0.35);
  const squash = Math.sin(Math.PI * b) * (1 - 0.4 * b);
  return { sx: 1 + 0.07 * squash, sy: 1 - 0.13 * squash, lift: 0 };
}

// The spores of one cycle, each released under the cap and drifting down to the ground.
function rng(seed) {
  return () => ((seed = Math.imul(seed ^ (seed >>> 15), 0x2c1b3c6d) + 0x6d2b79f5) >>> 0) / 4294967296;
}
const next = rng(7);
const SPORES = Array.from({ length: calm ? 10 : 26 }, () => ({
  x: -0.42 + next() * 0.9, at: 7.6 + next() * 2.8, fall: 0.18 + next() * 0.1, sway: next() * 6.3,
}));

function sporeAt(x, y, t) {
  return SPORES.some((s) => {
    const age = t - s.at;
    if (age < 0) return false;
    const sy = 0.77 - s.fall * age;
    const sx = s.x + 0.035 * Math.sin(age * 2.4 + s.sway);
    return sy > 0.02 && Math.abs(x - sx) < PITCH / 2 && Math.abs(y - sy) < PITCH / 2;
  });
}

// One frame of the film: the board as the controller would be told to show it.
function picture(t, cols) {
  const bits = new Uint8Array(cols * ROWS);
  // The mushroom pushes up out of the ground and swells to full size.
  const grow = smooth((t - 0.6) / 3);
  const scale = 0.22 + 0.78 * grow;
  const rise = 0.42 * (1 - grow) ** 2;
  const { sx, sy, lift } = hop(t);
  const wipe = (t - 11) / 1.2 * 1.3 - 0.15;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < cols; col++) {
      const x = (col - (cols - 1) / 2) * PITCH + 0.03;
      const y = (ROWS - 4.5 - row) * PITCH;
      let on;
      if (y < 0) on = row === ROWS - 4 ? col / cols < t / 0.6 : row === ROWS - 3 && (col * 7 + row) % 3 === 0 && t > 0.6;
      else on = t > 0.6 && (litAt(x / (scale * sx), (y - lift) / (scale * sy) + rise) || sporeAt(x, y, t));
      // A yellow band sweeps across to clear the board at the end of the cycle.
      if (t >= 11) {
        const d = (col / cols) * 0.85 + (row / ROWS) * 0.15;
        on = d < wipe - 0.15 ? false : d < wipe ? true : on;
      }
      bits[row * cols + col] = on ? 1 : 0;
    }
  }
  return bits;
}

const board = document.querySelector('.board');
let cols, dots, frames;

function build() {
  const fit = Math.round(Math.min(60, Math.max(30, ROWS * innerWidth / innerHeight * 0.92)));
  if (fit === cols) return;
  cols = fit;
  frames = new Map();
  board.replaceChildren();
  board.style.setProperty('--cols', cols);
  board.style.setProperty('--rows', ROWS);
  dots = [];
  for (let i = 0; i < cols * ROWS; i++) {
    const el = document.createElement('div');
    el.className = 'dot';
    el.style.backgroundColor = `#${BLACK}`;
    board.append(el);
    // The controller writes the panel a column at a time.
    dots.push({ el, bit: 0, start: -9, delay: (i % cols) * 0.004 });
  }
}

function frameAt(index) {
  if (!frames.has(index)) frames.set(index, picture(index / FPS, cols));
  return frames.get(index);
}

// The magnet kicks the disc past the stop; it rebounds and settles with a click.
function swing(s) {
  if (calm) return 180 * smooth(s / 0.12);
  const kick = 0.06;
  if (s < kick) return 196 * (s / kick) ** 2;
  return 180 + 16 * Math.exp(-12 * (s - kick)) * Math.cos(45 * (s - kick));
}

function shade(hex, k) {
  return `rgb(${hex.match(/\w\w/g).map((h) => Math.round(parseInt(h, 16) * k)).join()})`;
}

function draw(dot, t) {
  const s = t - dot.start;
  if (s > 0.5) {
    if (dot.done) return;
    dot.done = true;
  }
  const angle = dot.bit ? swing(s) : 180 - swing(s);
  const cos = Math.cos(angle * Math.PI / 180);
  dot.el.style.transform = `scaleX(${Math.max(0.04, Math.abs(cos)).toFixed(3)})`;
  dot.el.style.backgroundColor = shade(cos < 0 ? YELLOW : BLACK, 0.55 + 0.45 * Math.abs(cos));
}

addEventListener('resize', build);
build();

function frame(ms) {
  const t = ms / 1000;
  const total = CYCLE * FPS;
  for (let i = 0; i < dots.length; i++) {
    const dot = dots[i];
    const index = ((Math.floor((t - dot.delay) * FPS) % total) + total) % total;
    const bit = frameAt(index)[i];
    if (bit !== dot.bit) {
      dot.bit = bit;
      dot.start = t;
      dot.done = false;
    }
    draw(dot, t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

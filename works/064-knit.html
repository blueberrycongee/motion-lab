<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8a7550; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const vec3 LIGHT = vec3(-0.5, 0.9, 0.65);        // a large soft window, upper left
const vec3 BOUNDS_CENTER = vec3(0.0, 0.56, 0.0);
const float BOUNDS_RADIUS = 0.78;
const float TAU = 6.2831853;

float spin;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x),
                 mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x),
                 mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// Distance to the nearest wart centre on a jittered 3D grid, in grid cells.
float wartDistance(vec3 p) {
  vec3 g = p * 10.0;
  vec3 i = floor(g), f = fract(g);
  float d = 1e9;
  for (int z = -1; z <= 1; z++)
  for (int y = -1; y <= 1; y++)
  for (int x = -1; x <= 1; x++) {
    vec3 o = vec3(x, y, z);
    vec3 j = o + vec3(hash(i + o), hash(i + o + 7.1), hash(i + o + 3.7));
    d = min(d, length(j - f) * (0.7 + 0.6 * hash(i + o + 1.3)));
  }
  return d;
}

vec3 local(vec3 p) {
  float c = cos(spin), s = sin(spin);
  p.xz = mat2(c, -s, s, c) * p.xz;
  return p;
}

// Upright coordinates centred on the cap, with the stem's lean removed.
vec3 capSpace(vec3 q) {
  return vec3(q.x - 0.05 * q.y * q.y, q.y - 0.8, q.z);
}

// Stockinette at (column, row) coordinates: each stitch is a V of two slanted yarn legs, and
// the legs reach into the neighbouring rows the way real loops interlock. Height is 0..1.
float stockinette(vec2 st) {
  vec2 cell = floor(st);
  vec2 axis = vec2(0.45, 0.89);
  float h = 0.0;
  for (int dy = -1; dy <= 1; dy++) {
    vec2 f = st - cell - vec2(0.0, float(dy));
    vec2 d = vec2(abs(f.x - 0.5), f.y) - vec2(0.24, 0.55);
    float along = dot(d, axis), across = dot(d, vec2(-axis.y, axis.x));
    float e = length(vec2(along / 0.6, across / 0.26));
    float ply = 0.88 + 0.12 * sin(along * 38.0 - across * 22.0);     // twisted plies
    h = max(h, sqrt(max(1.0 - e * e, 0.0)) * ply);
  }
  return h;
}

// Knitted in the round: the cap from the crown down with decrease rounds toward the top,
// ribbing under the cap, and plain tubes for the stem and the ring.
float knit(vec3 q, float part) {
  vec3 c = capSpace(q);
  float around = atan(c.z, c.x) / TAU;
  if (part < 0.5) {
    float ring = length(c.xz) / 0.56;
    float columns = ring > 0.55 ? 84.0 : ring > 0.28 ? 42.0 : 21.0;
    return stockinette(vec2(around * columns, atan(ring, c.y / 0.31) * 11.0));
  }
  if (part < 1.5) return sqrt(abs(cos(around * TAU * 45.0)));
  if (part < 2.5) return stockinette(vec2(around * 18.0, q.y / 0.04));
  return stockinette(vec2(around * 36.0, q.y / 0.03));
}

// Warts are French knots: tight bobbles of cream yarn sewn onto the cap.
float bobble(vec3 q) {
  vec3 c = capSpace(q);
  float d = wartDistance(c);
  return sqrt(max(1.0 - d * d / 0.05, 0.0)) * step(0.0, c.y);
}

vec2 map(vec3 p) {
  vec3 q = local(p);
  vec2 m = mushroom(q);
  if (m.x < 0.03) {
    float raised = m.y < 0.5 ? 0.016 * bobble(q) : 0.0;
    m.x = (m.x - 0.011 * knit(q, m.y) - raised) * 0.7;
  }
  return m;
}

vec3 normalAt(vec3 p) {
  vec2 e = vec2(0.0008, 0.0);
  return normalize(vec3(map(p + e.xyy).x - map(p - e.xyy).x,
                        map(p + e.yxy).x - map(p - e.yxy).x,
                        map(p + e.yyx).x - map(p - e.yyx).x));
}

// Also reports how closely a missed ray grazed the wool, for the halo of stray fibres.
vec2 march(vec3 ro, vec3 rd, out vec3 graze) {
  graze = vec3(1.0, 0.0, 0.0);
  vec3 oc = ro - BOUNDS_CENTER;
  float b = dot(oc, rd);
  float h = b * b - dot(oc, oc) + BOUNDS_RADIUS * BOUNDS_RADIUS;
  if (h < 0.0) return vec2(-1.0);
  float t = max(-b - sqrt(h), 0.0), tFar = -b + sqrt(h);
  for (int i = 0; i < 100; i++) {
    vec2 m = map(ro + rd * t);
    if (m.x < 0.0004) return vec2(t, m.y);
    if (m.x < graze.x) graze = vec3(m.x, t, m.y);
    t += m.x;
    if (t > tFar) break;
  }
  return vec2(-1.0);
}

float shadow(vec3 p, vec3 l) {
  float t = 0.03, light = 1.0;
  for (int i = 0; i < 36; i++) {
    float d = map(p + l * t).x;
    light = min(light, 3.5 * d / t);
    if (light < 0.01) break;
    t += clamp(d, 0.02, 0.2);
    if (t > 2.5) break;
  }
  return clamp(light, 0.0, 1.0);
}

float occlusion(vec3 p, vec3 n) {
  float o = 0.0;
  for (int i = 1; i <= 4; i++) {
    float h = 0.05 * float(i);
    o += (h - map(p + n * h).x) / float(i);
  }
  return clamp(1.0 - 1.8 * o, 0.0, 1.0);
}

vec3 yarn(vec3 q, float part) {
  if (part > 0.5) return part < 1.5 ? vec3(0.62, 0.55, 0.43) : vec3(0.7, 0.63, 0.5);
  return mix(vec3(0.46, 0.09, 0.06), vec3(0.86, 0.82, 0.72), step(0.05, bobble(q)));
}

vec3 shadeWool(vec3 p, vec3 rd, float part) {
  vec3 q = local(p);
  vec3 n = normalAt(p);
  vec3 l = normalize(LIGHT);
  vec3 base = yarn(q, part) * (0.85 + 0.3 * noise(q * vec3(300.0, 900.0, 300.0)));

  // Grooves between stitches stay dark; fibres scatter light around the terminator.
  float cavity = mix(0.55, 1.0, knit(q, part));
  float ao = occlusion(p, n) * cavity;
  float key = max(dot(n, l) + 0.35, 0.0) / 1.35 * shadow(p + n * 0.005, l);
  vec3 col = base * (vec3(1.35, 1.25, 1.1) * key * cavity + vec3(0.3, 0.3, 0.32) * (0.6 + 0.4 * n.y) * ao
                     + vec3(0.24, 0.18, 0.09) * (0.5 - 0.5 * n.y) * ao);
  float rim = pow(1.0 - max(dot(n, -rd), 0.0), 2.5);
  return col + base * rim * (0.25 + 0.5 * key);
}

void main() {
  spin = uTime * 0.12;

  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);
  vec3 ro = vec3(-0.5, 1.35, 3.0);
  vec3 target = vec3(0.0, 0.5, 0.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.8 * fw);
  vec3 l = normalize(LIGHT);

  // A mustard linen sweep with a fine plain weave.
  vec3 linen = vec3(0.44, 0.34, 0.18);
  vec3 col = linen * (0.9 + 0.25 * uv.y);
  if (rd.y < 0.0) {
    vec3 p = ro + rd * (-ro.y / rd.y);
    vec2 weave = abs(fract(p.xz * 90.0) - 0.5);
    vec3 cloth = linen * (0.92 + 0.08 * (weave.x - weave.y) * sign(fract(p.x * 45.0) - fract(p.z * 45.0)));
    vec3 lit = cloth * (0.45 + 0.75 * shadow(p, l) * l.y);
    col = mix(lit, col, smoothstep(1.5, 4.0, length(p.xz)));
  }
  vec3 graze;
  vec2 hit = march(ro, rd, graze);
  if (hit.x > 0.0) {
    col = shadeWool(ro + rd * hit.x, rd, hit.y);
  } else if (graze.x < 0.012) {
    vec3 q = local(ro + rd * graze.y);
    float fibres = smoothstep(0.45, 0.75, noise(q * 260.0)) * smoothstep(0.012, 0.0, graze.x);
    col = mix(col, yarn(q, graze.z) * 1.2, fibres * 0.45);
  }

  col *= 1.0 - 0.3 * dot(uv, uv);
  col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);   // ACES filmic curve
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.01;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(program, 'uResolution');
const uTime = gl.getUniformLocation(program, 'uTime');

function frame(ms) {
  const dpr = Math.min(devicePixelRatio, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

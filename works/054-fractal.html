<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractal</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bcc0b7; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2');

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;

const float FOCAL = 2.0;
const float LEVEL_SECONDS = 10.0;     // one level of the zoom
const int LEVELS = 7;
// The crown wart is a mushroom standing on top of the cap; the camera dives into it forever.
const vec3 CROWN_AT = vec3(0.06, 1.1, 0.0);
const float CROWN_SCALE = 0.17;
const float CROWN_SPIN = 0.9;
// The other warts stand in two rings around the cap: polar angle on the dome, count, scale.
const vec3 RING_INNER = vec3(0.78, 6.0, 0.115);
const vec3 RING_OUTER = vec3(1.3, 11.0, 0.075);
const vec3 KEY = vec3(-0.55, 0.7, 0.45);
const vec3 KEYLIGHT = vec3(1.0, 0.93, 0.82);
const vec3 FOG = vec3(0.74, 0.76, 0.72);

vec3 gLocal;        // the hit point in the frame of the mushroom it belongs to
float gLod;         // features smaller than this, in world units, are left out

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

mat3 rotateY(float a) {
  float s = sin(a), c = cos(a);
  return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c);
}

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / k1;
}

// The mushroom: ground at y = 0, cap top near y = 1.11, cap about 1.12 wide.
// Returns distance and part: 0 cap, 1 gills, 2 stem, 3 ring.
vec2 mushroom(vec3 p) {
  p.x -= 0.05 * p.y * p.y;                       // a slight lean
  float r = length(p.xz);

  float stemR = 0.085 + 0.025 * (1.0 - p.y / 0.86) + 0.065 * exp(-p.y * 9.0);
  float stem = max(r - stemR, abs(p.y - 0.43) - 0.43) * 0.8;

  float frill = 0.008 * sin(atan(p.z, p.x) * 9.0);
  float skirt = abs(r - (0.096 + (0.66 - p.y) * 0.32 + frill * smoothstep(0.64, 0.56, p.y))) - 0.009;
  float ring = max(skirt, abs(p.y - 0.605) - 0.05) * 0.7;

  vec3 c = p - vec3(0.0, 0.8, 0.0);
  float dome = sdEllipsoid(c, vec3(0.56, 0.31, 0.56));
  dome += 0.008 * sin(c.x * 11.0 + 1.3) * sin(c.z * 9.0) * sin(c.y * 7.0 + c.x * 5.0);
  float under = 0.82 + 0.08 * (1.0 - min(r * r / 0.31, 1.0));
  float cap = max(dome, under - p.y);
  float gills = max(dome + 0.02, max(p.y - under - 0.004, under - 0.04 - p.y));

  vec2 res = vec2(cap, 0.0);
  if (gills < res.x) res = vec2(gills, 1.0);
  float body = smin(stem, max(cap, gills), 0.03);
  if (body < res.x - 0.001) res = vec2(body, 2.0);
  if (ring < res.x) res = vec2(ring, 3.0);
  return res;
}

// A child seen from its parent: x_parent = at + scale * frame * x_child.
struct Child { vec3 at; mat3 frame; float scale; };

Child crown() {
  return Child(CROWN_AT, rotateY(CROWN_SPIN), CROWN_SCALE);
}

// The ring member nearest q: the dome at polar angle ring.x, standing along its normal,
// turned about the leaning cap's axis to the nearest of ring.y places.
Child ringMember(vec3 q, vec3 ring, float offset) {
  float y = 0.8 + 0.31 * cos(ring.x);
  float axis = 0.05 * y * y;
  float sector = 6.2831853 / ring.y;
  float turn = round((atan(q.z, q.x - axis) - offset) / sector) * sector + offset;
  vec3 up = normalize(vec3(sin(ring.x) / 0.56, cos(ring.x) / 0.31, 0.0));
  mat3 frame = rotateY(-turn) * mat3(up.y, -up.x, 0.0, up, 0.0, 0.0, 1.0);
  vec3 at = vec3(axis, y, 0.0) + rotateY(-turn) * vec3(0.56 * sin(ring.x), 0.0, 0.0) - 0.004 * frame[1];
  return Child(at, frame, ring.z);
}

vec3 intoChild(vec3 q, Child c) {
  return transpose(c.frame) * (q - c.at) / c.scale;
}

vec3 toParent(vec3 q, Child c) {
  return c.at + c.scale * c.frame * q;
}

// The whole infinite mushroom from two levels above the current one, following one wart down
// at each level: the nearest, as long as it could still be the nearest surface and is not too
// small to see. The second nearest only limits the step; part -1 marks that limit.
vec2 map(vec3 p) {
  vec3 q = toParent(toParent(p, crown()), crown());
  float unit = 1.0 / (CROWN_SCALE * CROWN_SCALE);
  vec2 res = vec2(1e9, -1.0);
  for (int level = 0; level < LEVELS; level++) {
    vec2 m = mushroom(q);
    if (m.x * unit < res.x) { res = vec2(m.x * unit, m.y); gLocal = q; }
    Child options[3] = Child[3](crown(), ringMember(q, RING_INNER, 0.5), ringMember(q, RING_OUTER, 0.0));
    float best = 1e9, second = 1e9;
    int pick = 0;
    for (int i = 0; i < 3; i++) {
      Child c = options[i];
      float bound = (length(q - c.at - c.scale * 0.55 * c.frame[1]) - 0.85 * c.scale) * unit;
      if (bound < best) { second = best; best = bound; pick = i; }
      else second = min(second, bound);
    }
    if (second < res.x) res = vec2(second, -1.0);
    Child c = options[pick];
    if (best > res.x || c.scale * unit < gLod) break;
    q = intoChild(q, c);
    unit *= c.scale;
  }
  return res;
}

vec3 normalAt(vec3 p, float e) {
  vec2 k = vec2(e, 0.0);
  return normalize(vec3(map(p + k.xyy).x - map(p - k.xyy).x,
                        map(p + k.yxy).x - map(p - k.yxy).x,
                        map(p + k.yyx).x - map(p - k.yyx).x));
}

float softShadow(vec3 ro, vec3 rd, float scale) {
  float res = 1.0, t = 0.01 * scale;
  for (int i = 0; i < 40; i++) {
    float h = map(ro + rd * t).x;
    res = min(res, 6.0 * h / t);
    t += clamp(h, 0.005 * scale, 0.2 * scale);
    if (res < 0.002 || t > 3.0 * scale) break;
  }
  return clamp(res, 0.0, 1.0);
}

float occlusion(vec3 p, vec3 n, float scale) {
  float o = 0.0, w = 1.0;
  for (int i = 1; i <= 4; i++) {
    float h = (0.01 + 0.04 * float(i)) * scale;
    o += (h - map(p + n * h).x) / scale * w;
    w *= 0.7;
  }
  return clamp(1.0 - 2.5 * o, 0.0, 1.0);
}

vec3 albedo(vec3 q, float part) {
  q.x -= 0.05 * q.y * q.y;
  float r = length(q.xz);
  if (part < 0.5) return mix(vec3(0.42, 0.06, 0.035), vec3(0.70, 0.22, 0.06), smoothstep(0.2, 0.56, r));
  if (part < 1.5) return vec3(0.82, 0.77, 0.66) * (0.7 + 0.3 * (0.5 + 0.5 * cos(atan(q.z, q.x) * 70.0)));
  return mix(vec3(0.72, 0.68, 0.6), vec3(0.93, 0.9, 0.83), smoothstep(0.0, 0.3, q.y));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);

  // The camera moves by the crown's own map raised to the fraction of a level, so after one
  // level it sees the crown exactly as it saw the parent: the zoom closes on itself.
  float u = fract(uTime / LEVEL_SECONDS);
  float scale = pow(CROWN_SCALE, u);
  mat3 spin = rotateY(CROWN_SPIN * u);
  vec3 centre = inverse(mat3(1.0) - CROWN_SCALE * rotateY(CROWN_SPIN)) * CROWN_AT;
  vec3 start = centre + vec3(0.0, 0.95, 3.9);
  vec3 fw = normalize(centre - start - vec3(0.0, 0.45, 0.0));
  vec3 rt = normalize(cross(fw, vec3(0, 1, 0)));
  vec3 up = cross(rt, fw);
  vec3 ro = centre + scale * spin * (start - centre);
  vec3 rd = spin * normalize(uv.x * rt + uv.y * up + FOCAL * fw);
  vec3 key = spin * normalize(KEY);

  vec3 sky = mix(FOG * 0.82, FOG * 1.08, smoothstep(-0.6, 0.4, rd.y));
  vec3 col = sky;
  float pixel = 1.0 / (FOCAL * min(uResolution.x, uResolution.y));
  float t = 0.0, far = 40.0 * scale;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 100; i++) {
    gLod = 2.0 * pixel * t;
    vec2 m = map(ro + rd * t);
    if (m.y >= 0.0 && m.x < pixel * t) { hit = vec2(t, m.y); break; }
    t += max(m.x, pixel * t);
    if (t > far) break;
  }

  if (hit.x > 0.0) {
    vec3 p = ro + rd * hit.x;
    gLod = 2.0 * pixel * hit.x;
    vec3 n = normalAt(p, pixel * hit.x);
    map(p);
    vec3 local = gLocal;
    float part = hit.y;
    float size = min(scale, hit.x * 0.3);     // shadows and occlusion at the scale in view
    float shadow = softShadow(p + n * pixel * hit.x * 2.0, key, size);
    float ao = occlusion(p, n, size);
    vec3 base = albedo(local, part);
    float diff = clamp((dot(n, key) + 0.15) / 1.15, 0.0, 1.0) * shadow;
    vec3 lit = base * (KEYLIGHT * diff * 1.15 + FOG * (0.55 + 0.25 * n.y) * ao);
    vec3 h = normalize(key - rd);
    lit += KEYLIGHT * pow(max(dot(n, h), 0.0), 24.0) * shadow * (part < 0.5 ? 0.15 : 0.04);
    float fog = 1.0 - exp(-hit.x / scale * 0.07);
    col = mix(lit, sky, fog);
  }

  col *= 1.0 - 0.25 * dot(uv, uv);
  col = pow(col, vec3(0.92));
  col += (hash(vec3(gl_FragCoord.xy, uTime)) - 0.5) * 0.01;
  outColor = vec4(col, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
gl.useProgram(program);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

const uniform = (name) => gl.getUniformLocation(program, name);
const uResolution = uniform('uResolution');
const uTime = uniform('uTime');

function frame(ms) {
  // Each step descends the mushroom level by level; one sample per CSS pixel keeps that affordable.
  const dpr = Math.min(devicePixelRatio, 1);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform2f(uResolution, w, h);
  gl.uniform1f(uTime, ms / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
